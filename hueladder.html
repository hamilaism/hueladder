    + '<span class="sw" id="dtprev" style="background:' + hex + ';color:' + ink(hex) + ';display:inline-grid;place-items:center;min-width:80px;padding:8px;border-radius:8px">' + hex + '</span>'
    + '<span class="mono" id="dtratio">' + num(contrast(hex, state.dark.background), 2) + ':1</span>'
    + '<button class="primary" id="dtpin">' + t('darkTunePin') + '</button>' + (pinned ? '<button id="dtunpin">' + t('darkTuneUnpin') + '</button>' : '') + '</div>'
    + (Object.keys(pins).length ? '<p class="muted" style="font-size:13px">' + t('darkPins') + ' ' + Object.entries(pins).flatMap(([r, p]) => Object.entries(p).map(([st, h]) => esc(r) + ' ' + st + ' <span class="dot" style="background:' + h + '"></span>' + h)).join(' · ') + '</p>' : '') + '</div>';
}
function wireDarkTune(R, RD, steps) {
  if (!$('darktune')) return;
  const hex = RD[ui.dtStep], base = hexToOklch(hex), y = relativeLuminance(hex);
  const calc = () => {
    const H = (base.H + Number($('dthue').value) + 360) % 360, max = __lib.tune.maxChromaAtLuminance(y, H);
    return __lib.tune.solveAtLuminance(y, max * Number($('dtchroma').value), H).hex;
  };
  const show = () => { const h = calc(); $('dtprev').style.background = h; $('dtprev').style.color = ink(h); $('dtprev').textContent = h; $('dtratio').textContent = num(contrast(h, state.dark.background), 2) + ':1'; };
  $('dthue').oninput = show; $('dtchroma').oninput = show;
  $('dtstep').onchange = e => { ui.dtStep = e.target.value; render(); };
  $('dtpin').onclick = () => { const pins = state.dark.pins = state.dark.pins || {}; (pins[R.name] = pins[R.name] || {})[ui.dtStep] = calc(); save(); render(); toast(t('done')); };
  if ($('dtunpin')) $('dtunpin').onclick = () => { delete state.dark.pins[R.name][ui.dtStep]; if (!Object.keys(state.dark.pins[R.name]).length) delete state.dark.pins[R.name]; save(); render(); };
}

// la fiche d'une pastille : tout ce qu'on veut savoir d'une couleur, au clic
function swatchCard(el) {
  const hex = el.dataset.hex, row = [...el.parentElement.querySelectorAll('.sw[data-hex]')], k = row.indexOf(el);
  const prev = row[k - 1] && row[k - 1].dataset.hex, next = row[k + 1] && row[k + 1].dataset.hex;
  const { r, g, b } = __lib.color.hexToRgb(hex), hsl = __lib.color.hexToHsl(hex), ok = hexToOklch(hex);
  const line = (k2, v) => '<div><span class="muted">' + k2 + '</span> <b class="mono">' + v + '</b></div>';
  const bg = state.dark && state.dark.enabled ? state.dark.background : null;
  $('swcard').innerHTML = '<div class="row" style="justify-content:space-between"><b class="mono">' + hex + '</b><button class="ghost" id="swclose" aria-label="' + t('close') + '">×</button></div>'
    + '<div class="sw" style="background:' + hex + ';height:44px;border-radius:8px"></div>'
    + line('RGB', [r, g, b].map(v => Math.round(v * 255)).join(' ')) + line('HSL', Math.round(hsl.h) + '° ' + Math.round(hsl.s * 100) + ' % ' + Math.round(hsl.l * 100) + ' %')
    + line('OKLCH', num(ok.L, 3) + ' ' + num(ok.C, 3) + ' ' + Math.round(ok.H) + '°')
    + line(t('swOnWhite'), num(contrast(hex, '#ffffff'), 2) + ':1') + line(t('swOnBlack'), num(contrast(hex, '#000000'), 2) + ':1')
    + (bg ? line(t('swOnDark', bg), num(contrast(hex, bg), 2) + ':1') : '')
    + line(t('swEarned'), __lib.import.naturalStep(hex) + (el.dataset.step && el.dataset.step !== __lib.import.naturalStep(hex) ? ' (' + t('swNamed', esc(el.dataset.step)) + ')' : ''))
    + (prev ? line(t('swPrev'), 'ΔE ' + num(deltaE2000Hex(prev, hex))) : '') + (next ? line(t('swNext'), 'ΔE ' + num(deltaE2000Hex(hex, next))) : '');
  $('swcard').hidden = false;
  $('swclose').onclick = () => { $('swcard').hidden = true; };
}
document.addEventListener('click', ev => { const sw = ev.target.closest('.ramp .sw[data-hex]'); if (sw) swatchCard(sw); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('swcard')) $('swcard').hidden = true; });

// la planche de variantes : chaque famille choisit son éclat, à contraste identique
function variantBoard(steps) {
  const V = ['seed', 'vivid', 'max', 0.5];
  const builds = V.map(v => { const sp = specOf({ tuned: false }); sp.ramps = sp.ramps.map(r => (r.kind === 'neutral' ? r : { ...r, lightChroma: v })); return buildData(applyNaming(sp)); });
  const rows = state.ramps.filter(r => r.kind !== 'neutral').map(r => '<div class="board-row"><b>' + esc(r.label) + '</b>' + V.map((v, k) => {
    const d = builds[k], dr = d.ramps.find(x => x.name === r.name);
    if (!dr) return '<div></div>';
    const sc = Object.fromEntries(d.meta.steps.map((st, i) => [st, dr.colors[d.meta.coreMethod][i]]));
    const on = (r.lightChroma ?? (state.lightChroma ? 'vivid' : 'seed')) === v;
    return '<button class="board-cell' + (on ? ' on' : '') + '" data-variant="' + esc(r.name) + '|' + v + '">' + rampRow(sc, steps, { slim: true }) + '</button>';
  }).join('') + '</div>').join('');
  return '<details class="panel" id="board"' + (ui.boardOpen ? ' open' : '') + '><summary><b>' + t('boardT') + '</b> <span class="muted">' + t('boardHint') + '</span></summary>'
    + '<div class="board-row board-head"><span></span>' + t('boardCols').map(c => '<span class="label">' + c + '</span>').join('') + '</div>' + rows + '</details>';
}
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-variant]'); if (!c) return;
  ev.stopPropagation();
  const [name, v] = c.dataset.variant.split('|'), r = stateRamp(name);
  if (r) { r.lightChroma = v === '0.5' ? 0.5 : v; clearTuning(); save(); render(); }
}, true);
document.addEventListener('toggle', ev => { if (ev.target.id === 'board') { ui.boardOpen = ev.target.open; if (ev.target.open && !ev.target.querySelector('.board-cell')) render(); } }, true);

// le regroupement proposé d'un coup : relu, puis appliqué ensemble
function groupPanel(data) {
  const g = __lib.diagnose.proposeGrouping(data, state.ramps, { accepted: state.accepted.map(a => a.key), lang });
  if (g.steps.length < 2) return '';
  ui.group = g;
  return '<div class="panel" id="group"><span class="label">' + t('groupT') + '</span><ol>' + g.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol><div class="row"><button id="groupapply">' + t('groupApply', g.steps.length) + '</button></div></div>';
}
document.addEventListener('click', ev => {
  if (!ev.target.closest('#groupapply') || !ui.group) return;
  state.ramps = ui.group.ramps;
  ui.group.notes.forEach((n, i) => accept('group|' + i + '|' + n.length, n));
  clearTuning(); save(); render(); toast(t('done'));
});

// le barreau médian : proposé quand on part d'une palette, avec ce qu'il coûte face au défaut
document.addEventListener('change', ev => { const k = ev.target.closest('[data-keep]'); if (!k) return; const r = stateRamp(k.dataset.keep); if (r) { if (k.checked) r.method = 'anchored'; else delete r.method; clearTuning(); save(); render(); } });
document.addEventListener('click', ev => { const b = ev.target.closest('#vivid [data-v]'); if (b) { state.lightChroma = b.dataset.v === 'vivid' ? 'vivid' : null; clearTuning(); save(); render(); } });
function ladderPanel(spec, data) {
  if (!['grid', 'rank'].includes(state.naming)) return '';
  if (state.ladders) return '<div class="panel"><span class="label">' + t('ladderT') + '</span><p>' + t('ladderOn') + '</p><div class="row"><button id="ladderoff">' + t('ladderOff') + '</button></div></div>';
  const m = __lib.audit.medianLadder(spec, data);
  if (!m || !m.monotone) return '';
  return '<div class="panel"><span class="label">' + t('ladderT') + '</span><p>' + t('ladderText', num(m.maxGap, 2)) + '</p><div class="row"><button id="ladderon" data-l="' + esc(JSON.stringify(m.shadeLadder)) + '">' + t('ladderUse') + '</button></div></div>';
}
document.addEventListener('click', ev => {
  const on = ev.target.closest('#ladderon'), off = ev.target.closest('#ladderoff');
  if (on) { state.ladders = { shadeLadder: JSON.parse(on.dataset.l) }; clearTuning(); save(); render(); }
  if (off) { state.ladders = null; clearTuning(); save(); render(); }
});

function findings(data) {
  const { diagnose, applyAction, describe } = __lib.diagnose;
  return diagnose(data, state.ramps, { accepted: state.accepted.map(a => a.key) }).map(f => {
    const d = describe(f, data, lang);
    return { sev: f.sev, kind: d.kind, title: d.title, text: esc(d.text), swatches: f.swatches, weight: f.weight,
      acts: f.actions.map((a, i) => ({ label: d.actions[i], run: () => {
        const res = applyAction(state.ramps, f, a, data);
        state.ramps = res.ramps;
        if (res.accept) accept(res.accept.key, d.note);
        if (res.method) { if (state.method !== res.method) { state.method = res.method; clearTuning(); } state.step = 2; }
      } })) };
  });
}
// Les actions d'un constat sont de vrais boutons : un clic modifie le système, et le
// diagnostic se recalcule aussitôt. On les numérote au rendu pour les retrouver au clic.
let ACTS = [];
const stateRamp = name => state.ramps.find(r => r.name === name);
const isAccepted = key => state.accepted.some(a => a.key === key);
const accept = (key, note) => { if (!isAccepted(key)) state.accepted.push({ key, note }); };
const findingCard = f => `<div class="finding ${f.sev}"><span class="kind">${f.kind}</span><h3>${esc(f.title)}</h3><p>${f.text}</p>
  ${f.swatches ? '<div class="chips">' + f.swatches.map(h => '<span class="mono" style="font-size:12px"><span class="dot" style="background:' + h + '"></span>' + h + '</span>').join('') + '</div>' : ''}
  ${f.acts && f.acts.length ? '<div class="row">' + f.acts.map(a => '<button class="act-btn" data-act="' + (ACTS.push(a) - 1) + '">' + esc(a.label) + '</button>').join('') + '</div>' : ''}
  ${f.html || ''}</div>`;
function wireActs() {
  document.querySelectorAll('[data-act]').forEach(b => { b.onclick = () => { ACTS[Number(b.dataset.act)].run(); save(); render(); toast(t('done')); }; });
}

VIEWS.read = () => {
  ACTS = [];
  const { data, spec } = dataOf({ tuned: false });
  const steps = emitted(data, spec);
  let body = '';
  if (state.door === 'audit') {
    const list = findings(data);
    const fams = data.ramps.map(r => {
      const now = Object.fromEntries(data.meta.steps.map(s => [s, null]));
      const labels = {};
      data.anchorMap.filter(a => a.ramp === r.name && a.primary !== false).forEach(a => { now[a.placedStep] = a.hex; labels[a.placedStep] = a.role !== a.placedStep ? a.role + '→' + a.placedStep : a.role; });
      return '<div style="display:grid;gap:4px"><div class="ramp-lab"><b>' + esc(r.label) + '</b></div>' + rampRow(now, data.meta.steps, { slim: true, labels }) + '</div>';
    }).join('');
    body = '<div class="panel"><div class="ramp-lab"><span class="label">' + t('atRank') + '</span><span>' + t('atRankHint') + '</span></div>' + stepHead(data.meta.steps) + fams + '</div>'
      + (list.length ? list.map(findingCard).join('') : findingCard({ sev: 'ok', kind: t('fNone'), title: t('fNoneT'), text: t('fNoneWhy') }))
      + groupPanel(data) + ladderPanel(spec, data);
  } else {
    const r = data.ramps.find(x => x.kind === 'brand') || data.ramps[0];
    const a = data.anchorMap.find(x => x.ramp === r.name);
    const scale = scaleOf(data, r.name);
    const firstW = steps.find(s => scale[s] && contrast(scale[s], '#ffffff') >= 4.5);
    const at500 = a ? scaleOf(data, r.name)[a.placedStep] : null;
    const gap500 = a && at500 ? deltaE2000Hex(a.hex, at500) : 0;
    const dot = h => '<span class="dot" style="background:' + h + '"></span><code>' + h + '</code>';
    body = `<div class="panel"><span class="label">${t('gives')}</span>
        <div class="ramp-lab"><b>${esc(r.label)}</b><span>${esc(methodLabel(state.method))}</span></div>${rampRow(scale, steps, { marks: wb })}
        <div class="grid2">
          ${findingCard({ sev: firstW ? 'ok' : 'warn', kind: t('fWhiteK'), title: firstW ? t('fWhiteFrom', firstW) : t('fWhiteNever'), text: firstW ? t('fWhiteText', firstW) : '' })}
          ${a ? findingCard({ sev: a.naturalStep === '500' ? 'ok' : 'warn', kind: t('fExact'), title: a.naturalStep === '500' ? t('fExactOk') : t('fExactNo', a.naturalStep), text: gap500 > 0.5 ? t('fExactMoved', dot(a.hex), dot(at500), num(gap500), a.placedStep) : t('fExactSame') }) : ''}
        </div></div>`;
    const others = data.ramps.filter(x => x !== r);
    if (others.length) body += '<div class="panel"><span class="label">' + t('wholeSystem') + '</span>' + stepHead(steps)
      + others.map(o => '<div style="display:grid;gap:4px"><div class="ramp-lab"><b>' + esc(o.label) + '</b><span>' + t('kinds')[o.kind] + '</span></div>' + rampRow(scaleOf(data, o.name), steps, { slim: true, marks: wb }) + '</div>').join('') + '</div>';
    body += findings(data).filter(f => f.kind === t('fDup') || f.kind === t('fNear')).map(findingCard).join('');
  }
  if (state.accepted.length) body += '<p class="muted" style="font-size:13.5px">' + t('acceptedN', state.accepted.length) + ' <button class="ghost" id="unaccept">' + t('unaccept') + '</button></p>';
  // compléter le système, sur place : c'est ici que le manque se voit
  const needN = !hasKind('neutral'), needS = missingSystem().map(([n]) => t('sysLabels')[n].toLowerCase());
  if (needN || needS.length) {
    body += findingCard({ sev: 'warn', kind: t('fTodo'), title: t('fTodoT', needN, needS.length), text: t('fTodoWhy'),
      html: '<div class="row">' + (needN ? '<button class="primary" id="addneutral">' + t('addNeutralFull') + '</button>' : '') + (needS.length ? '<button' + (needN ? '' : ' class="primary"') + ' id="addsystem">' + t('addSystemFull', needS) + '</button>' : '') + '</div>' });
  }
  $('main').innerHTML = head(state.door === 'audit' ? t('readH') : t('createH', steps.length), t('rule', ruleWords(data.rules, lang).aa, ruleWords(data.rules, lang).ui)) + body + nextBtn();
  if ($('addneutral')) $('addneutral').onclick = () => { addNeutral(); save(); render(); toast(t('added')); };
  if ($('addsystem')) $('addsystem').onclick = () => { const names = missingSystem().map(([n]) => t('sysLabels')[n]); addSystem(); save(); render(); toast(t('addedSys', names)); };
  if ($('unaccept')) $('unaccept').onclick = () => { state.accepted = []; save(); render(); };
  wireActs();
};

// ================================================================ 3 · générer

VIEWS.generate = () => {
  const { data, spec } = dataOf({ tuned: false });
  const steps = emitted(data, spec);
  const audit = state.door === 'audit';
  // Ce que chaque méthode donnera à l'étape Vérifier, annoncé ici, au moment du choix : le
  // contrat du mode clair (le sombre dépend encore de l'étape 5). Mêmes contrôles que check.mjs.
  const cmp = Object.fromEntries(compareMethods(data, { lang }).map(r => [r.method, r]));
  const methods = Object.keys(cmp);
  const deOf = m => (cmp[m] ? cmp[m].deltaE : originGap(data, m));
  const cross = m => data.metrics[m].interchangeability?.light?.crossingPairs ?? 0;
  const contractFails = m => cmp[m].fails;
  const holds = m => cmp[m].holds;
  const holders = methods.filter(holds);
  const brandRamp = (data.ramps.find(r => r.kind === 'brand') || data.ramps[0]).name;
  const nTuned = Object.keys(state.tuned).length;

  // ---- 1. l'information : ce que chaque méthode donne sur ces couleurs
  const verdict = t('genVerdict', holders.length, methods.length, methodLabel('fusilier'), holds('fusilier'), num(deOf('fusilier')), audit)
    + (audit && data.metrics.anchored ? ' ' + t('genKeep', cross('anchored')) : '');
  const brief = methods.map(m => {
    const c = cross(m);
    return `<button class="brief${m === state.method ? ' on' : ''}" data-m="${m}" aria-pressed="${m === state.method}">
      <span class="bn"><b>${esc(methodLabel(m))}</b>${m === 'fusilier' ? '<span class="reco">' + t('byDefault') + '</span>' : ''}<small>${esc((I18N[lang].methods[m] || [, ''])[1])}</small></span>
      <span class="br">${rampRow(scaleOf(data, brandRamp, 'light', m), steps, { slim: true })}</span>
      <span class="bv ${holds(m) ? 'ok' : 'bad'}" title="${esc(contractFails(m).map(f => f.label + ' — ' + f.detail).join('\n'))}">${holds(m) ? '✓ ' + t('ruleHeld') : '✗ ' + esc(contractFails(m).map(plainCheck).slice(0, 2).join(' · ')) + (contractFails(m).length > 2 ? ' · +' + (contractFails(m).length - 2) : '')}</span>
      <span class="bd">ΔE ${num(deOf(m))}</span>
    </button>`;
  }).join('');

  // ---- 3. le détail, replié : toutes les méthodes sur un même nuancier
  if (!ui.cmpRamp || !data.ramps.some(r => r.name === ui.cmpRamp)) ui.cmpRamp = brandRamp;
  const H = t('cmpHead');
  const rows = methods.map(m => {
    const M = data.metrics[m];
    return `<div class="cmp-row${m === state.method ? ' on' : ''}" data-m="${m}">
      <div class="n"><b>${esc(methodLabel(m))}</b></div>
      <div class="r">${rampRow(scaleOf(data, ui.cmpRamp, 'light', m), steps, { slim: true })}</div>
      <div class="v ${M.violationCount ? 'bad' : 'ok'}">${M.violationCount}</div>
      <div class="v ${cross(m) ? 'bad' : 'ok'}">${cross(m)}</div>
      <div class="v">${num(deOf(m))}</div>
      <div><button data-pick="${m}" ${m === state.method ? 'disabled' : ''}>${m === state.method ? t('chosen') : t('choose')}</button></div>
    </div>`;
  }).join('');

  // ---- 2. le résultat de la décision : tout le système avec la méthode choisie
  const keepBox = r => (audit && !r.derived ? '<label class="row" style="gap:4px;font-size:12.5px"><input type="checkbox" data-keep="' + esc(r.name) + '"' + (stateRamp(r.name) && stateRamp(r.name).method === 'anchored' ? ' checked' : '') + '>' + t('keepRamp') + '</label>' : '');
  const system = data.ramps.map(r => '<div style="display:grid;gap:4px"><div class="ramp-lab"><b>' + esc(r.label) + '</b><span>' + t('kinds')[r.kind] + '</span>' + keepBox(r) + '</div>'
    + rampRow(scaleOf(data, r.name, 'light', state.method), steps, { slim: data.ramps.length > 4, marks: wb }) + '</div>').join('');

  $('main').innerHTML = head(t('genH', audit), t('genLead')) + `
    <div class="panel">
      <p style="font-size:16px">${verdict}</p>
      <div class="row"><p class="muted" style="font-size:13px;flex:1;min-width:260px">${t('briefLegend')}</p><button id="report">${t('report')}</button></div>
      <div class="briefs">${brief}</div>
    </div>
    ${nTuned ? '<p class="muted" style="font-size:13.5px">' + t('tunedWarn', nTuned) + '</p>' : ''}
    <div class="panel">
      <div class="ramp-lab"><h3>${t('sysWith')} ${esc(methodLabel(state.method))}</h3><span>${t('wbLegend')}</span></div>
      ${stepHead(steps)}${system}
      <div class="row" id="vivid"><span class="label">${t('vividT')}</span>
        <div class="tabs"><button data-v="seed" class="${state.lightChroma ? '' : 'on'}">${t('vividSeed')}</button><button data-v="vivid" class="${state.lightChroma ? 'on' : ''}">${t('vividOn')}</button></div></div>
      <p class="muted" style="font-size:13.5px">${t('vividText')}</p>
    </div>
    ${ui.boardOpen ? variantBoard(steps) : '<details class="panel" id="board"><summary><b>' + t('boardT') + '</b> <span class="muted">' + t('boardHint') + '</span></summary></details>'}
    <details class="panel" id="cmpdetails"${ui.cmpOpen ? ' open' : ''}>
      <summary><b>${t('cmpH')}</b> <span class="muted" style="font-size:14px">— ${t('cmpSummary')}</span></summary>
      <div class="row"><span class="label">${t('cmpRamp')}</span><select id="cmpramp">${data.ramps.map(r => '<option value="' + esc(r.name) + '"' + (r.name === ui.cmpRamp ? ' selected' : '') + '>' + esc(r.label) + '</option>').join('')}</select></div>
      <div class="cmp"><div class="cmp-row head"><div>${H[0]}</div><div>${H[1]}</div><div style="text-align:right">${H[2]}</div><div style="text-align:right">${H[3]}</div><div style="text-align:right">${H[4]}</div><div></div></div>${rows}</div>
    </details>
    ${nextBtn()}`;
  const pick = m => {
    if (m === state.method) return;
    if (nTuned && !confirm(t('confirmMethod'))) return render();
    state.method = m; clearTuning(); save(); render();
  };
  document.querySelectorAll('.brief, .cmp-row[data-m]').forEach(el => { el.onclick = () => pick(el.dataset.m); });
  $('cmpdetails').ontoggle = e => { ui.cmpOpen = e.target.open; };
  $('cmpramp').onchange = e => { ui.cmpRamp = e.target.value; render(); };
  $('report').onclick = () => openReport(data);
};

function clearTuning() {
  state.tuned = {};
  // nouvel identifiant : le régleur range ses réglages sous ce nom, on repart d'une page blanche
  state.sid = Math.random().toString(36).slice(2, 8);
}

/** L'artefact de comparaison historique, généré sur ces couleurs, dans un nouvel onglet. */
function reportHtml(data) {
  return REPORT_TPL.replace(/__TITLE__/g, () => esc(data.meta.title)).replace('/*DATA_INJECT*/{}', () => JSON.stringify(data).replace(/<\//g, '<\\/'));
}
function openReport(data) {
  const url = URL.createObjectURL(new Blob([reportHtml(data)], { type: 'text/html' }));
  window.open(url, '_blank');
}

// ================================================================ 4 · régler

/**
 * Le régleur historique, intégré tel quel : il travaille sur la base (méthode choisie, sans
 * réglages) et range ses réglages dans le navigateur. Le studio les relit par son export
 * « spec » et les rejoue dans le build — la même route que la ligne de commande.
 */
VIEWS.tune = () => {
  const { spec, data } = dataOf({ tuned: false });
  const td = { ...tunerDataFrom(spec, data, { gamut: false }), brand: 'hueladder-' + state.sid, embedded: true, lang };
  $('main').innerHTML = head(t('tuneH'), t('tuneLead')) + '<iframe id="tuner" title="' + t('tunerTitle') + '"></iframe>' + nextBtn();
  const frame = $('tuner');
  frame.srcdoc = TUNER_TPL
    .replace(/__TUNER_TITLE__/g, () => esc(t('tunerHead', state.brand)))
    .replace(/__ACCENT__/g, () => accentHex())
    .replace('/*TUNER_DATA*/{}', () => JSON.stringify(td).replace(/<\//g, '<\\/'));
  frame.onload = () => {
    const doc = frame.contentDocument;
    syncFrameTheme();
    const fit = () => { frame.style.height = Math.max(900, doc.documentElement.scrollHeight + 20) + 'px'; };
    new ResizeObserver(fit).observe(doc.body); fit();
  };
};
function syncFrameTheme() {
  const frame = $('tuner'); if (!frame || !frame.contentDocument?.body) return;
  frame.contentDocument.body.classList.toggle('dark', isDark());
}
function pullTuning() {
  const frame = $('tuner');
  const w = frame && frame.contentWindow;
  if (!w || typeof w.exportPayload !== 'function') return;
  const p = w.exportPayload('spec');
  state.tuned = Object.fromEntries(Object.entries(p.reglages || {}).map(([k, v]) => [k, v.tuned]));
  save();
}
window.addEventListener('message', e => { if (e.data && e.data.hueladder === 'tuned') pullTuning(); });

// ================================================================ 5 · mode sombre

/** Courbes de chroma d'un nuancier : clair, sombre (profil choisi), sombre (autre profil), plafond. */
function chromaChart(steps, series) {
  const W = 640, Hh = 190, pad = { l: 34, r: 10, t: 12, b: 26 };
  // l'échelle suit la rampe, pas le plafond : sur un neutre, le plafond écraserait tout
  const own = series.filter(s => !s.ceiling).flatMap(s => s.values.filter(v => v !== null));
  const max = Math.max(0.02, ...own) * 1.35;
  const x = i => pad.l + (i / Math.max(1, steps.length - 1)) * (W - pad.l - pad.r);
  const y = v => Hh - pad.b - (v / max) * (Hh - pad.t - pad.b);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4;
    g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/>'
      + '<text x="' + (pad.l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--mono)">' + v.toFixed(2) + '</text>';
  }
  steps.forEach((s, i) => { g += '<text x="' + x(i) + '" y="' + (Hh - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--mono)">' + s + '</text>'; });
  for (const s of series) {
    const pts = s.values.map((v, i) => (v === null ? null : x(i).toFixed(1) + ',' + y(Math.min(v, max)).toFixed(1))).filter(Boolean).join(' ');
    g += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>';
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(t('chartT')) + '">' + g + '</svg>';
}

function verdictHtml(v) {
  if (ui.darkLens === 'apca') {
    return v.apca.below ? '<span class="bv bad">✗ ' + t('apcaBelow', v.apca.below, -v.apca.worst) + '</span>' : '<span class="bv ok">✓ ' + t('apcaKept') + '</span>';
  }
  if (!v.wcagCount) return '<span class="bv ok">✓ ' + t('wcagKept') + '</span>';
  const W = v.wcag, parts = [];
  if (W.rule) parts.push(t('vRule', W.rule));
  if (W.thresh) parts.push(t('vThresh', W.thresh));
  if (W.cross) parts.push(t('vCross', W.cross));
  if (W.mono) parts.push(t('vMono', W.mono));
  if (W.oob) parts.push(t('vOob', W.oob));
  return '<span class="bv bad">✗ ' + parts.join(' · ') + '</span>';
}

/**
 * Le cran qu'un rôle prend dans un nuancier, choisi sur le mode clair par le seuil qu'il doit
 * tenir face au blanc : le même nom sert ensuite en sombre, c'est la promesse du système. Ne
 * dépend d'aucune nomenclature : « 600 » n'a pas le même sens partout, un seuil si.
 */
function roleSteps(data, ramp) {
  const L = ramp.colors[data.meta.coreMethod], S = data.meta.steps;
  const idx = S.map((_, i) => i).filter(i => L[i]);
  const first = min => S[idx.find(i => contrast(L[i], '#ffffff') >= min) ?? idx[idx.length - 1]];
  return { surface: S[idx[0]], border: first(1.5), input: first(3), soft: first(4.5), text: first(7) };
}

/** Une petite interface rendue avec une configuration sombre : ce que l'utilisateur verra. */
function darkMock(data, scales, bg) {
  const neutral = data.ramps.find(r => r.kind === 'neutral');
  const brand = data.ramps.find(r => r.kind === 'brand') || data.ramps[0];
  const err = data.ramps.find(r => /error|danger/.test(r.name));
  const at = (r, role) => r ? scales[r.name][data.meta.steps.indexOf(roleSteps(data, r)[role])] || null : null;
  const text = at(neutral, 'text') || '#ffffff', soft = at(neutral, 'soft') || text;
  const btn = at(brand, 'soft'), link = at(brand, 'soft');
  return `<div class="dmock" style="background:${bg};color:${text}">
    <b>${t('mTitle')}</b><span style="color:${soft}">${t('mockSoft')}</span>
    <span style="color:${link}">${t('mockLink')}</span>
    ${err ? `<span class="dalert" style="background:${at(err, 'surface')};color:${at(err, 'text')}">${t('mErr')}</span>` : ''}
    <span class="dbtn" style="background:${btn};color:${btn ? ink(btn) : text}">${t('mSave')}</span></div>`;
}

VIEWS.dark = () => {
  const d = state.dark;
  if (!d.enabled) {

    $('den').onchange = e => { d.enabled = e.target.checked; save(); render(); };
    return;
  }
  if (!ui.darkLens) ui.darkLens = 'wcag';
  const { data, spec } = finalOf();
  const steps = emitted(data, spec);
  const core = data.meta.coreMethod;
  const brand = data.ramps.find(r => r.kind === 'brand') || data.ramps[0];
  const idx = st => data.meta.steps.indexOf(st);
  const pick = arr => Object.fromEntries(steps.map(st => [st, arr[idx(st)]]));
  const probe = steps.includes(data.meta.seedStep) ? data.meta.seedStep : steps[Math.floor(steps.length / 2)];
  const cur = { method: d.method, bg: d.background, profile: d.profile, attenuate: d.attenuate };
  // une option = une configuration complète, montrée sur la marque et dans une interface
  const option = (key, attrs, cfg, title, desc, reco) => {
    const sc = darkScales(data, cfg);

  // ---- 1. le fond

  // ---- 2. la méthode
  // les méthodes qui tiennent le contrat sous la norme choisie restent visibles, avec celle qui est

  const mHolds = m => {

  };
  const mRow = m => option(m === d.method ? 'on' : '', 'data-dm="' + m + '"', { ...cur, method: m }, t('dm')[m][0], t('dm')[m][1], m === 'mirror-wcag');
  const shownM = __lib.dark.DARK_METHODS.filter(m => m === d.method || mHolds(m));
  const foldedM = __lib.dark.DARK_METHODS.filter(m => !shownM.includes(m));
  const mRows = shownM.map(mRow).join('') + (foldedM.length ? '<details class="more"' + (ui.moreDark ? ' open' : '') + ' id="moredark"><summary>' + t('otherMethods', foldedM.length) + '</summary><div class="opts">' + foldedM.map(mRow).join('') + '</div></details>' : '');

  // ---- 3. l'éclat
  const chromaShare = cfg => {
    const sc = darkScales(data, cfg), L = brand.colors[core], D = sc[brand.name];
    // même mesure que la source citée : la part du maximum que l'écran peut afficher à cette clarté
    const share = sel => {
      const r = data.meta.steps.map((st, i) => {
        if (!sel(i) || !L[i] || !D[i] || hexToOklch(L[i]).C <= 0.02) return null;
        const c = hexToOklch(D[i]), max = __lib.tune.maxChromaAtLuminance(relativeLuminance(D[i]), c.H);
        return max > 1e-3 ? Math.min(1, c.C / max) : null;
      }).filter(x => x !== null);
      return r.length ? Math.round((r.reduce((a, b) => a + b, 0) / r.length) * 100) : null;
    };
    const surf = i => contrast(L[i], '#ffffff') < 3;
    return t('chromaShare', share(i => !surf(i)), share(surf));

  const attAmount = d.attenuate || 0.2;
  const vKey = d.profile === 'bell' ? 'bell' : d.attenuate > 0 ? 'atten' : 'aligned';
  const vRows = [
    ['aligned', { ...cur, profile: 'aligned', attenuate: 0 }, t('aligned'), t('alignedHint'), true],
    ['bell', { ...cur, profile: 'bell', attenuate: 0 }, t('bell'), t('bellHint'), false],
    ['atten', { ...cur, profile: 'aligned', attenuate: attAmount }, t('atten'), t('attenHint') + ' (' + t('attenNow', Math.round(attAmount * 100)) + ')', false],
  ].map(([k, cfg, title, desc, reco]) => option(k === vKey ? 'on' : '', 'data-vv="' + k + '"', cfg, title, desc + ' <span class="mono">' + chromaShare(cfg) + '</span>', reco)).join('');

  // ---- le détail d'un nuancier, et tout le système
  if (!ui.darkRamp || !data.ramps.some(r => r.name === ui.darkRamp)) ui.darkRamp = brand.name;
  const R = data.ramps.find(r => r.name === ui.darkRamp);
  const RL = scaleOf(data, R.name), RD = scaleOf(data, R.name, 'dark');
  const cols = 'grid-template-columns:repeat(' + steps.length + ',minmax(0,1fr))';
  const ratios = (scale, bg) => '<div class="ratios" style="' + cols + '">' + steps.map(st => '<span>' + (scale[st] ? (ui.darkLens === 'apca' ? 'Lc ' + Math.round(Math.abs(apcaLc(scale[st], bg))) : num(contrast(scale[st], bg), 1)) : '') + '</span>').join('') + '</div>';
  const detail = R.darkDetail?.[core] || [];
  const C = h => (h ? hexToOklch(h).C : null);
  const chart = chromaChart(steps, [
    { values: steps.map(st => detail[idx(st)]?.maxChroma ?? null), color: 'var(--line)', width: 6, ceiling: true },
    { values: steps.map(st => C(RL[st])), color: 'var(--muted)', dash: '4 4' },
    { values: steps.map(st => C(RD[st])), color: 'var(--ink)', width: 2.5 },

  const allRows = data.ramps.map(r => `<div style="display:grid;gap:4px"><div class="ramp-lab"><b>${esc(r.label)}</b></div>
      <div style="background:${data.meta.lightBackground};padding:6px;border-radius:8px;border:1px solid var(--line)">${rampRow(scaleOf(data, r.name), steps, { slim: true })}</div>
      <div style="background:${d.background};padding:6px;border-radius:8px">${rampRow(scaleOf(data, r.name, 'dark'), steps, { slim: true })}</div></div>`).join('');
  const L = pick(brand.colors[core]), BD = pick(brand.darkColors[core]);

  $('main').innerHTML = head(t('darkH'), t('darkLead')) + `
    <div class="panel"><label class="row" style="cursor:pointer"><input type="checkbox" id="den" checked> <b>${t('darkOn')}</b></label>
      <span class="label">${t('knowH')}</span>
      <div class="how">
        <div>${L[probe] ? t('how1', probe, ratio(contrast(L[probe], '#ffffff'))) : ''}</div>
        <div>${BD[probe] ? t('how2', probe, ratio(contrast(BD[probe], d.background)), '<code>' + d.background + '</code>') : ''}</div>
        <div>${t('how3')}</div>
      </div>
      <div class="lens"><span class="label">${t('lensLabel')}</span>
        <div class="seg"><button data-lens="wcag" class="${ui.darkLens === 'wcag' ? 'on' : ''}">WCAG 2</button><button data-lens="apca" class="${ui.darkLens === 'apca' ? 'on' : ''}">APCA</button></div>
        <p class="muted" style="font-size:13.5px">${t('lensShort')}</p>
        <details><summary class="muted" style="font-size:13px">${t('lensMore')}</summary><p class="muted" style="font-size:13px;margin-top:6px">${t('lensWhy')}</p></details></div></div>

    <div class="panel">
      <div class="head" style="gap:6px"><span class="label">${t('dStep', 1)}</span><h3>${t('bgH')}</h3><p class="muted" style="font-size:14px">${t('bgWhy', ratio(contrastBudget(d.background)))}</p></div>
      <div class="opts">${bgRows}</div>
      <div class="row"><span class="label">${t('bgCustom')}</span><input type="color" id="dbg" value="${d.background}" aria-label="${t('bgAria')}"><input type="text" class="hex" id="dbghex" value="${d.background}" aria-label="${t('bgAria')}"></div>
    </div>

    <div class="panel">
      <div class="head" style="gap:6px"><span class="label">${t('dStep', 2)}</span><h3>${t('dmH')}</h3><p class="muted" style="font-size:14px">${t('dmWhy2')}</p></div>
      <div class="opts">${mRows}</div>
    </div>

    <div class="panel">
      <div class="head" style="gap:6px"><span class="label">${t('dStep', 3)}</span><h3>${t('vivid')}</h3><p class="muted" style="font-size:14px">${t('vividWhy')}</p></div>
      <div class="opts">${vRows}</div>
      ${vKey === 'atten' ? '<div class="row"><span class="label">' + t('attenAmount') + '</span><input type="range" id="atten" min="5" max="40" step="5" value="' + Math.round(d.attenuate * 100) + '" aria-label="' + t('atten') + '" style="width:220px;accent-color:var(--ink)"><b class="mono" id="attenv">−' + Math.round(d.attenuate * 100) + ' %</b></div>' : ''}
      <p class="muted" style="font-size:13px">${t('attenWhy')}</p>

    <div class="panel">
      <div class="row"><span class="label">${t('showRamp')}</span><select id="darkramp">${data.ramps.map(r => '<option value="' + esc(r.name) + '"' + (r.name === R.name ? ' selected' : '') + '>' + esc(r.label) + '</option>').join('')}</select></div>
      ${stepHead(steps)}
      <div class="pair"><div class="ramp-lab"><b>${t('lightRow')}</b><span>${t('onWhite')}</span></div>
        <div style="background:#ffffff;padding:6px;border-radius:8px;border:1px solid var(--line)">${rampRow(RL, steps)}</div>${ratios(RL, '#ffffff')}</div>
      <div class="pair"><div class="ramp-lab"><b>${t('darkRow')}</b><span>${t('onBg')} ${d.background}</span></div>
        <div style="background:${d.background};padding:6px;border-radius:8px">${rampRow(RD, steps)}</div>${ratios(RD, d.background)}</div>

// ================================================================ 6 · vérifier

VIEWS.verify = () => {
  const { data, spec } = finalOf();
  const steps = emitted(data, spec);
  const checks = contractChecks(data, '', { lang });
  // Un écart peut être voulu : il vient d'un choix fait en connaissance de cause (une autre
  // méthode, un réglage épinglé). On le nomme, et on peut l'assumer : il part dans le rapport.
  // une exception vaut pour ce qu'on a vu en l'acceptant : si le détail change, elle ne tient plus
  const assumed = new Set((state.assumed || []).map(a => a.label + '|' + a.detail));
  const isAccepted = c => assumed.has(c.label + '|' + c.detail);
  const fails = checks.filter(c => !c.pass && !isAccepted(c));
  const kept = checks.filter(c => !c.pass && isAccepted(c));
  const cause = c => c.area === 'dark' ? (state.dark.method !== 'mirror-wcag' ? t('causeDark', t('dm')[state.dark.method][0]) : '')
    : c.area === 'method' ? (state.method !== 'fusilier' ? t('causeMethod', methodLabel(state.method)) : '')
    : Object.keys(state.tuned).length ? t('causeTuning') : '';
  const opts = [['#ffffff', t('white')], ['#000000', t('black')]];
  for (const r of data.ramps) for (const s of steps) { const h = scaleOf(data, r.name)[s]; if (h) opts.push([h, r.label + ' ' + s]); }
  const pr = data.ramps.find(r => r.kind === 'neutral') || data.ramps[0], prs = roleSteps(data, pr);
  if (!ui.pairFg || !opts.some(o => o[0] === ui.pairFg)) ui.pairFg = scaleOf(data, pr.name)[prs.text] || '#000000';
  if (!ui.pairBg || !opts.some(o => o[0] === ui.pairBg)) ui.pairBg = scaleOf(data, pr.name)[prs.surface] || '#ffffff';
  const sel = (id, v) => '<select id="' + id + '">' + opts.map(o => '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + ' — ' + o[0] + '</option>').join('') + '</select>';
  const cr = contrast(ui.pairFg, ui.pairBg), lc = apcaLc(ui.pairFg, ui.pairBg);
  const b = (ok, txt) => '<span class="badge ' + (ok ? 'y' : 'n') + '">' + txt + '</span>';

  // quelques composants, rendus avec la palette, dans les deux modes
  const brand = data.ramps.find(r => r.kind === 'brand') || data.ramps[0];
  const neutral = data.ramps.find(r => r.kind === 'neutral');
  const mock = mode => {
    const S = (r, role) => r ? scaleOf(data, r.name, mode)[roleSteps(data, r)[role]] : null;
    const bg = mode === 'dark' ? data.meta.dark.background : '#ffffff';
    const text = S(neutral, 'text') || (mode === 'dark' ? '#ffffff' : '#000000');
    const soft = S(neutral, 'soft') || text;
    const line = S(neutral, 'input') || soft;
    const err = data.ramps.find(r => /error|danger/.test(r.name));
    const ok = data.ramps.find(r => /success/.test(r.name));
    const p = S(brand, 'soft');
    const alert = (r, msg) => `<div class="alert" style="background:${S(r, 'surface')};border-color:${S(r, 'border')};color:${S(r, 'text')}">${msg}</div>`;
    return `<div class="mock" style="background:${bg};color:${text}">
      <div style="font-weight:700;font-size:17px">${t('mTitle')}</div>
      <div style="color:${soft};font-size:13.5px">${t('mSoft', neutral ? esc(neutral.label) + ' ' + roleSteps(data, neutral).soft : t('mockNeutral'))}</div>
      <div class="field" style="border-color:${line};color:${text}">name@example.com</div>
      ${err ? alert(err, t('mErr')) : ''}${ok ? alert(ok, t('mOk')) : ''}
      <div class="row"><span class="btn" style="background:${p};color:${ink(p)}">${t('mSave')}</span>
        <span class="btn" style="border:1px solid ${S(brand, 'input')};color:${S(brand, 'soft')}">${t('mCancel')}</span></div></div>`;
  };

  $('main').innerHTML = head(t('verH'), t('verLead')) + `
    <div class="verdict ${fails.length ? 'bad' : kept.length ? 'warn' : 'ok'}" id="verdict">${fails.length ? t('verBad', fails.length) : kept.length ? t('verKept', !!data.meta.dark, kept.length) : t('verOk', !!data.meta.dark)}</div>
    <div class="panel"><div class="checks">${checks.map(c => {
      const isKept = !c.pass && isAccepted(c);
      const why = !c.pass ? cause(c) : '';
      return '<div class="check ' + (c.pass ? 'pass' : isKept ? 'kept' : 'fail') + '"><span class="i">' + (c.pass ? '✓' : isKept ? '≈' : '✗') + '</span><div>' + esc(plainCheck(c))
        + '<details class="tech"><summary>' + t('techDetail') + '</summary><small>' + esc(c.label) + ' — ' + esc(c.detail) + '</small></details>'
        + (why ? '<small class="cause">' + esc(why) + '</small>' : '')

          + (isKept ? '<button class="act-btn" data-unassume="' + esc(c.label) + '">' + t('unassume') + '</button>' : '<button class="act-btn" data-assume="' + esc(c.label) + '">' + t('assume') + '</button>') + '</div>')
        + '</div></div>';
    }).join('')}</div></div>
    <div class="panel"><span class="label">${t('pairH')}</span>
      <div class="row">${sel('pfg', ui.pairFg)}<span class="muted">${t('on')}</span>${sel('pbg', ui.pairBg)}</div>

        <div style="display:grid;gap:10px"><div class="badges">${b(cr >= 3, t('bUI'))}${b(cr >= 4.5, t('bAA'))}${b(cr >= 7, t('bAAA'))}</div>

      </div></div>
    <div class="panel"><span class="label">${t('inSitu')}</span><div class="grid2">${mock('light')}${data.meta.dark ? mock('dark') : ''}</div></div>
    ${nextBtn()}`;
  document.querySelectorAll('[data-fix]').forEach(b => { b.onclick = () => go(Number(b.dataset.fix)); });
  document.querySelectorAll('[data-assume]').forEach(b => { b.onclick = () => {
    const c = checks.find(x => x.label === b.dataset.assume);
    state.assumed = [...(state.assumed || []).filter(a => a.label !== c.label), { label: c.label, detail: c.detail, note: t('noteAssumed', c.label, c.detail, cause(c)) }];
    save(); render();

  $('pfg').onchange = e => { ui.pairFg = e.target.value; render(); };
  $('pbg').onchange = e => { ui.pairBg = e.target.value; render(); };
};

  const O = t('outs');
  return [
    ['dtcgL', O.dtcgL[0], spec.id + '-core-colors' + (dark ? '.light' : '') + '.tokens.json', JSON.stringify(light.tokens, null, 2), O.dtcgL[1]],
    ...(dark ? [['dtcgD', O.dtcgD[0], spec.id + '-core-colors.dark.tokens.json', JSON.stringify(dark.tokens, null, 2), O.dtcgD[1]]] : []),
    ['css', O.css[0], spec.id + '-colors.css', cssVariables(spec, data), O.css[1]],

  ];
}

}

// ---------------------------------------------------------------- auditer

const auditState = () => state.audit || (state.audit = { sources: [{ name: t('srcName', 1), origin: '', date: '', text: '' }], diff: false, run: false });
function runAudit() {
  const A = __lib.audit, S = auditState();
  const rd = s => A.readSource(s.text, { name: s.name || t('srcName', 1), origin: s.origin, date: s.date, lang, naming: state.naming, stepList: state.stepList });
  // une source déclarée « mode sombre d'une autre » ne s'audite pas seule : elle se lit contre sa palette claire
  const isDark = s => s.darkOf !== null && s.darkOf !== undefined && s.darkOf !== '' && S.sources[Number(s.darkOf)] && S.sources[Number(s.darkOf)].text.trim();
  const lights = S.sources.filter(s => s.text.trim() && !isDark(s));
  const read = lights.map(rd);
  const audits = read.map(r => A.auditSource(r, { lang }));
  const dark = S.sources.filter(s => s.text.trim() && isDark(s)).map(s => {
    const of = S.sources[Number(s.darkOf)], i = lights.indexOf(of);
    return i < 0 ? null : { of: read[i].name, index: i, ...A.auditDark(read[i], rd(s), { background: s.bg || '#121212', lang }) };
  }).filter(Boolean);
  return { read, audits, dark, cross: audits.length > 1 ? A.compareSources(audits) : null, diff: S.diff && read.length === 2 ? A.diffVersions(read[0], read[1]) : null };
}
function atRankBlock(data) {
  return stepHead(data.meta.steps) + data.ramps.filter(r => !r.derived).map(r => {
    const now = Object.fromEntries(data.meta.steps.map(s => [s, null])), labels = {};
    data.anchorMap.filter(a => a.ramp === r.name && a.primary !== false && a.placedStep).forEach(a => { now[a.placedStep] = a.hex; labels[a.placedStep] = a.role !== a.placedStep ? a.role + '→' + a.placedStep : a.role; });
    return '<div style="display:grid;gap:4px"><div class="ramp-lab"><b>' + esc(r.label) + '</b></div>' + rampRow(now, data.meta.steps, { slim: true, labels }) + '</div>';
  }).join('');
}
function decisionBlock(a) {
  const d = __lib.audit.decision(a);
  const L = m => methodLabel(m);
  const bands = Object.entries(d.bands).filter(([, v]) => v.length).map(([k, v]) => '<div><b>' + t('bands')[k][0] + '</b> <span class="muted">— ' + t('bands')[k][1] + '</span><div class="chips">'
    + v.map(i => '<span class="mono" style="font-size:12px">' + esc(i.label) + ' ' + num(i.meanDE) + '</span>').join('') + '</div></div>').join('');
  return '<div class="panel"><span class="label">' + t('decTitle') + '</span><p>' + (d.keep ? t('decKeep', L(d.core)) : t('decRegen', L(d.core), d.before.crossings ?? '—', d.after.crossings ?? '—')) + ' '
    + (d.fallback ? t('decFallback', L(d.fallback.method), num(d.fallback.deltaE)) : t('decNoFallback')) + '</p>' + bands + '</div>';
}
function crossBlock(c) {
  const st = s => '<span class="badge st-' + s + '">' + t('status')[s] + '</span>';
  const sw = h => h ? '<span class="dot" style="background:' + h + '" title="' + h + '"></span>' : '<span class="dot void"></span>';
  const fams = c.families.map(f => '<tr><td><b>' + esc(f.label) + '</b></td><td>' + st(f.status) + '</td>' + c.sources.map(s => '<td class="mono">' + f.cells.map(x => sw(x.values[s])).join('') + '</td>').join('') + '</tr>').join('');
  const tri = c.triage.map(r => '<tr><td>' + esc(r.name) + '</td><td>' + st(r.status) + '</td><td>' + r.coverage + '</td><td>' + r.steps + '</td><td>' + r.divergent + '</td><td>' + (r.meanDE === null ? '—' : num(r.meanDE)) + '</td><td>' + num(r.regenDE) + '</td></tr>').join('');
  return '<div class="panel"><span class="label">' + t('crossTitle') + '</span><p>' + t('crossTotals', c.totals.aligned, c.totals.divergent, c.totals.shared, c.totals.exclusive) + '</p>'
    + (c.sameNameDifferent.length ? '<p><b>' + t('sameNameT') + '</b> : ' + c.sameNameDifferent.map(s => esc(s.name) + ' (ΔE ' + num(s.meanDE) + ')').join(', ') + '</p>' : '')
    + (c.renames.length ? '<p><b>' + t('renamesT') + '</b> : ' + c.renames.map(r => esc(r.a.source + ' · ' + r.a.family + ' ≈ ' + r.b.source + ' · ' + r.b.family) + ' (ΔE ' + num(r.meanDE) + ')').join(', ') + '</p>' : '')
    + (!c.commonGrid ? '<p><b>' + t('gridsT') + '</b> : ' + c.grids.map(g => esc(g.source) + ' [' + g.steps.join(', ') + ']').join(' ; ') + '</p>' : '')
    + '<div class="scroll"><table class="tbl" id="crosstbl"><thead><tr><th></th><th></th>' + c.sources.map(s => '<th>' + esc(s) + '</th>').join('') + '</tr></thead><tbody>' + fams + '</tbody></table></div>'
    + '<span class="label">' + t('triageT') + '</span><div class="scroll"><table class="tbl" id="triage"><thead><tr>' + t('triageCols').map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' + tri + '</tbody></table></div></div>';
}
function diffBlock(d) {
  const list = (xs, f) => '<div class="chips">' + xs.slice(0, 60).map(f).join('') + (xs.length > 60 ? ' …' : '') + '</div>';
  return '<div class="panel" id="diff"><span class="label">' + t('diffTitle', esc(d.before), esc(d.after)) + '</span><p>' + t('diffLine', d.lost.length, d.added.length, d.changed.length, d.same, d.aliases.before, d.aliases.after) + '</p>'
    + (d.lost.length ? '<b>' + t('lostT') + '</b>' + list(d.lost, x => '<span class="mono" style="font-size:12px">' + esc(x.path) + '</span>') : '')
    + (d.changed.length ? '<b>' + t('changedT') + '</b>' + list(d.changed, x => '<span class="mono" style="font-size:12px">' + esc(x.path) + ' ' + (x.deltaE === null ? '' : 'ΔE ' + num(x.deltaE)) + '</span>') : '') + '</div>';
}
VIEWS.audit = () => {

    + '<label class="filebtn">' + t('orFile') + '<input type="file" data-f="file" accept=".json,.css,.scss,.js,.ts,.txt,.tokens" hidden></label></div>').join('');
  let body = '';
  if (S.run && S.sources.some(s => s.text.trim())) {
    try {
      const R = runAudit();

      const fc = f => findingCard({ sev: f.sev, kind: f.kind, title: f.title, text: esc(f.text), swatches: f.swatches });
      body = '<div class="panel"><span class="label">' + t('readFirst') + '</span>' + R.audits.map(a => {
        const why = Object.entries(a.dropped.reduce((m, d) => ((m[d.why] = (m[d.why] || 0) + 1), m), {})).map(([k, v]) => v + ' ' + (t('whyDrop')[k] || k)).join(', ');

      }).join('') + '</div>'
        + R.audits.map((a, i) => {
          const r = a.resemblance;
          return '<div class="panel" data-audit="' + i + '"><h3>' + esc(a.name) + '</h3>'
            + '<p>' + (r.closest ? t('closest', esc(methodLabel(r.closest.method)), num(r.closest.meanDE)) : '') + ' ' + (r.hsl.length ? (r.hslLike * 2 >= r.hsl.length ? t('hslYes', r.hslLike, r.hsl.length) : t('hslNo', r.hslLike, r.hsl.length)) : '') + '</p>'
            + (a.crossings !== null ? '<p>' + t('crossLine', a.crossings) + '</p>' : '')
            + (a.cvd && a.cvd.normal.min !== null ? '<p class="muted">' + esc(__lib.audit.cvdLine(a.cvd, lang)) + '</p>' : '')
            + (a.figma ? '<div class="panel" data-figma="' + i + '"><span class="label">Figma</span><p>' + t('figmaLine', a.figma) + '</p>' + (a.figma.hard.length ? '<div class="chips">' + a.figma.hard.slice(0, 8).map(h => '<span class="mono" style="font-size:12px"><span class="dot" style="background:' + h.hex + '"></span>' + h.hex + ' ×' + h.count + ' · ' + h.rank + '</span>').join('') + '</div>' : '') + (a.figma.lies.length ? '<p class="muted">' + t('figmaLies', a.figma.lies.length) + '</p>' : '') + '</div>' : '')
            + (a.pairs ? '<div class="panel" data-pairs="' + i + '"><span class="label">' + t('pairsT') + '</span><p>' + t('pairsLine', a.pairs.totals) + '</p>' + (a.pairs.rows.filter(r => r.status !== 'ok').length ? '<div class="scroll"><table class="tbl"><tbody>' + a.pairs.rows.filter(r => r.status !== 'ok').slice(0, 30).map(r => '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.state) + '</td><td><span class="dot" style="background:' + r.fg + '"></span><span class="dot" style="background:' + r.bg + '"></span></td><td>' + num(r.ratio, 2) + ':1</td><td>' + t('pairsV')[r.status] + '</td></tr>').join('') + '</tbody></table></div>' : '') + '</div>' : '')

              + '<ul class="checks">' + d.checks.map(c => '<li class="' + (c.info ? 'info' : c.pass ? 'y' : 'n') + '"><b>' + (c.info ? '·' : c.pass ? '✓' : '✗') + ' ' + esc(c.label) + '</b> — ' + esc(c.detail) + '</li>').join('') + '</ul><p class="muted">' + t('darkAuditFix') + '</p></div>').join('')

  });
  $('srcadd').onclick = () => { S.sources.push({ name: t('srcName', S.sources.length + 1), origin: '', date: '', text: '' }); save(); render(); };

// ---------------------------------------------------------------- comprendre

const mLab = (data, m) => (I18N[lang].methods && I18N[lang].methods[m] ? methodLabel(m) : (data.methods[m] && data.methods[m].label) || m);
// une série par teinte, pour un graphique : la valeur de chaque cran (ou de chaque intervalle)
function seriesOf(data, r, m, key) {
  const meta = data.meta.coreSteps.map(s => r.meta[m] && r.meta[m][data.meta.steps.indexOf(s)]);
  if (key === 'step') return meta.slice(1).map((b, k) => (meta[k] && b ? Math.max(meta[k].cvb, b.cvb) / Math.min(meta[k].cvb, b.cvb) : null));
  if (key === 'H') {
    if (r.kind === 'neutral') return [];
    const h0 = hexToOklch(r.seed).H;
    return meta.map(x => (x && x.oklch[1] >= 0.03 ? ((x.oklch[2] - h0 + 540) % 360) - 180 : null));
  }
  return meta.map(x => (!x ? null : key === 'cvb' ? x.cvb : key === 'L' ? x.oklch[0] : key === 'C' ? x.oklch[1] : x.apcaOnWhite));
}
// les mêmes axes pour toutes les méthodes : le domaine se calcule sur toutes à la fois
function chartDomain(data, methods, key) {
  if (key === 'cvb') return { lo: 1, hi: 21, log: true, ticks: [1, 3, 4.5, 7, 21] };
  if (key === 'L') return { lo: 0, hi: 1, ticks: [0, 0.25, 0.5, 0.75, 1] };
  if (key === 'apca') return { lo: 0, hi: 108, ticks: [0, 30, 45, 60, 75, 90, 106] };
  const vals = methods.flatMap(m => data.ramps.filter(r => !r.derived).flatMap(r => seriesOf(data, r, m, key))).filter(v => v !== null && Number.isFinite(v));
  if (key === 'C') { const hi = Math.max(0.1, ...vals) * 1.05; return { lo: 0, hi, ticks: [0, 0.1, 0.2, 0.3].filter(v => v <= hi) }; }
  if (key === 'H') { const a = Math.max(5, ...vals.map(Math.abs)) * 1.1; return { lo: -a, hi: a, ticks: [-a, 0, a].map(v => Math.round(v)) }; }
  const hi = Math.max(1.5, ...vals) * 1.05;
  return { lo: 1, hi, ticks: [1, 1.25, 1.5, 2, 2.5, 3].filter(v => v <= hi) };
}
function methodChart(data, m, key, dom) {
  const W = 260, H = 170, n = data.meta.coreSteps.length - (key === 'step' ? 1 : 0);
  const X = i => 30 + i * (W - 40) / Math.max(1, n - 1);
  const pos = v => (dom.log ? Math.log(v / dom.lo) / Math.log(dom.hi / dom.lo) : (v - dom.lo) / (dom.hi - dom.lo));
  const Y = v => H - 20 - Math.max(0, Math.min(1, pos(v))) * (H - 32);
  const tick = v => (Math.abs(v) >= 10 || Number.isInteger(v) ? String(Math.round(v)) : num(v, 2));
  let g = '';
  for (const c of dom.ticks) g += '<line x1="30" x2="' + (W - 10) + '" y1="' + Y(c) + '" y2="' + Y(c) + '" stroke="var(--line)"' + ((key === 'cvb' && c === 4.5) || (key === 'H' && c === 0) ? ' stroke-dasharray="3 3"' : '') + '/><text x="26" y="' + (Y(c) + 3) + '" text-anchor="end" font-size="9" fill="var(--muted)">' + tick(c) + '</text>';
  for (const r of data.ramps.filter(x => !x.derived)) {
    const pts = seriesOf(data, r, m, key).map((v, i) => (v === null || !Number.isFinite(v) ? null : X(i).toFixed(1) + ',' + Y(v).toFixed(1))).filter(Boolean);
    if (pts.length < 2) continue;
    const col = (r.colors[m] && r.colors[m][data.meta.seedIndex]) || r.seed;
    g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="1.6"' + (r.kind === 'neutral' ? ' stroke-dasharray="4 3"' : '') + '><title>' + esc(r.label) + '</title></polyline>';
  }
  return '<figure class="mini"><figcaption>' + esc(uLab(data, m)) + '</figcaption><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(uLab(data, m)) + '">' + g + '</svg></figure>';
}
// dans Comprendre, l'existant n'est jamais « fourni » qu'avec les couleurs de la personne
const uLab = (data, m) => (m === 'existing' ? t('mineExisting') : mLab(data, m));

  const mine = state.understand === 'mine' && state.ramps.length;
  const spec = mine ? specOf({ tuned: false }) : applyNaming({ ...__lib.explain.demoSpec(lang), naming: state.naming, stepList: state.stepList });
  return { mine, data: buildData(spec) };
}

function download(name, content, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ================================================================ en-tête et démarrage

function isDark() {
  const th = document.documentElement.dataset.theme;
  return th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
$('theme').onclick = () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('hueladder-theme', document.documentElement.dataset.theme); } catch (e) {}
  syncFrameTheme();
};
try { const th = localStorage.getItem('hueladder-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('lang').onclick = () => {
  if (STEP_KEYS[state.step] === 'tune') pullTuning();
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('hueladder-lang', lang); } catch (e) {}
  render();
};
$('brand').onchange = e => { state.brand = e.target.value.trim() || t('myBrand'); save(); render(); };
$('cransbtn').onclick = () => { ui.cransOpen = !ui.cransOpen; renderHeader(); };
$('share').onclick = async () => {
  if (STEP_KEYS[state.step] === 'tune') pullTuning();
  const url = location.href.split('#')[0] + '#s=' + encodeState(state);
  try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); } catch (e) { prompt(t('linkPrompt'), url); }
};
$('reset').onclick = () => {
  if (state.ramps.length && !confirm(t('confirmReset'))) return;
  state = fresh(); save(); render();
};

render();
</script>
</body>
</html>
