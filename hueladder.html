<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hueladder — studio d'échelles de couleur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f3f2ee; --paper: #fffefb; --sunk: #ebe9e3; --ink: #1c1b18; --muted: #69665e; --line: #dcd9d0;
    --accent: #2f5bd3; --on-accent: #ffffff;
    --ok: #11753d; --ok-soft: #e2f3e8; --warn: #9a5200; --warn-soft: #fbeedc; --bad: #b3261e; --bad-soft: #fbe6e3;
    --sans: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #131210; --paper: #1b1a17; --sunk: #0e0d0c; --ink: #ecebe5; --muted: #a29e94; --line: #33312c;
      --ok: #62cf8d; --ok-soft: #14301f; --warn: #f0a55c; --warn-soft: #362412; --bad: #ff8b7d; --bad-soft: #3a1714;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #131210; --paper: #1b1a17; --sunk: #0e0d0c; --ink: #ecebe5; --muted: #a29e94; --line: #33312c;
    --ok: #62cf8d; --ok-soft: #14301f; --warn: #f0a55c; --warn-soft: #362412; --bad: #ff8b7d; --bad-soft: #3a1714;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.55 var(--sans); }
  h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h2 { font-size: 26px; line-height: 1.2; font-weight: 700; }
  h3 { font-size: 16px; line-height: 1.3; font-weight: 600; }
  p { margin: 0; max-width: 68ch; }
  code, .mono { font-family: var(--mono); font-size: 0.86em; }
  .muted { color: var(--muted); }
  .label { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  a { color: var(--accent); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
  button:hover { border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.primary:hover { opacity: .88; }
  button.ghost { border-color: transparent; background: transparent; padding-inline: 8px; }
  button.ghost:hover { border-color: var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=text] { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 9px; font-size: 14px; }
  input[type=text].hex { font-family: var(--mono); width: 110px; }
  textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 12px; font: 13px/1.5 var(--mono); resize: vertical; }
  input[type=color] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }

  /* ---------- en-tête ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--ground); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .mark { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 21px; letter-spacing: -0.03em; }
  .mark svg { align-self: center; }
  .mark small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .brandname { border: 1px dashed transparent; background: transparent; font-weight: 600; font-size: 15px; padding: 4px 8px; border-radius: 6px; width: 180px; }
  .brandname:hover, .brandname:focus { border-color: var(--line); background: var(--paper); }
  .grow { flex: 1; }

  /* sélecteur de crans : une règle graduée, les crans actifs en encre */
  .crans { display: flex; align-items: center; gap: 10px; }
  .crans select { font-size: 13px; }
  #cransbtn { font-size: 13px; padding: 5px 10px; }
  @media (max-width: 1440px) { .ruler, .mark small { display: none; } }
  .cpanel { border-top: 1px solid var(--line); background: var(--paper); }
  .cpanel-in { max-width: 1320px; margin: 0 auto; padding: 16px 20px 20px; display: grid; gap: 14px; }
  .namings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .naming { text-align: left; display: grid; gap: 4px; align-content: start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
  .naming.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .naming small { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .naming .moves { font: 600 11.5px/1.2 var(--mono); } .naming .moves.ok { color: var(--ok); } .naming .moves.bad { color: var(--warn); }
  .modtag { font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 3px 6px; border-radius: 20px; background: var(--warn-soft); color: var(--warn); vertical-align: 1px; }
  .stepchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stepchip { display: inline-flex; align-items: center; gap: 4px; font: 500 13px/1 var(--mono); border: 1px solid var(--line); border-radius: 20px; padding: 3px 4px 3px 10px; background: var(--paper); }
  .stepchip button { border: 0; background: none; padding: 2px 6px; border-radius: 20px; font-size: 13px; line-height: 1; }
  .stepchip button:hover { background: var(--sunk); }
  .ruler { display: block; }

  /* ---------- structure ---------- */
  .shell { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; padding: 26px 20px 90px; }
  .rail { position: sticky; top: 76px; align-self: start; display: grid; gap: 0; }
  .rail button { all: unset; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px; padding: 9px 4px; border-left: 2px solid var(--line); position: relative; }
  .rail button::before { content: ""; position: absolute; left: -2px; top: 50%; width: 10px; height: 2px; background: var(--line); }
  .rail button .n { font: 500 12px/1 var(--mono); color: var(--muted); text-align: right; }
  .rail button .t { font-weight: 500; font-size: 14.5px; }
  .rail button .s { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -6px; }
  .rail button.on { border-left-color: var(--ink); }
  .rail button.on::before { background: var(--ink); width: 16px; }
  .rail button.on .t { font-weight: 700; }
  .rail button:disabled { opacity: .4; cursor: not-allowed; }
  .rail button.done .n { color: var(--ok); }
  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; gap: 18px; padding-inline: 16px; }
    .rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    .rail button { border-left: 0; border-bottom: 2px solid var(--line); grid-template-columns: auto auto; padding: 8px 10px; white-space: nowrap; }
    .rail button::before, .rail button .s { display: none; }
    .rail button.on { border-bottom-color: var(--ink); }
  }

  main { display: grid; gap: 22px; align-content: start; min-width: 0; }
  .head { display: grid; gap: 8px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .next { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- portes ---------- */
  .door { border: 1.5px solid var(--ink); }
  .door h3 { font-size: 20px; }
  .fidelity { font-size: 13.5px; border-left: 3px solid var(--ok); padding: 8px 12px; background: var(--ok-soft); border-radius: 0 8px 8px 0; }
  .fidelity.partial { border-color: var(--warn); background: var(--warn-soft); }
  .fidelity details { margin-top: 4px; }
  .fidelity ul { margin: 6px 0 0; padding-left: 18px; font: 12px/1.6 var(--mono); max-height: 160px; overflow: auto; }

  /* ---------- nuanciers ---------- */
  .fam { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--paper); }
  .fam-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fam-head input[type=text] { font-weight: 600; width: 180px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .anchor { display: grid; grid-template-rows: 44px auto; width: 74px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; background: var(--paper); padding: 0; }
  .anchor span:last-child { font: 11px/1.3 var(--mono); padding: 3px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .anchor.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seedmark { font: 500 10px/1 var(--mono); padding: 2px 4px; margin: 3px; border-radius: 3px; justify-self: start; align-self: start; }

  /* une rampe : les crans comme une règle de couleurs */
  .ramp { display: grid; gap: 2px; }
  .ramp .sw { box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .28); height: 54px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 5px; font: 500 10.5px/1.15 var(--mono); min-width: 0; overflow: hidden; }
  .ramp .sw small { font-size: 9.5px; opacity: .85; }
  .ramp .sw.x { box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); }
  .ramp .void { height: 54px; border-radius: 4px; border: 1px dashed var(--line); background: repeating-linear-gradient(45deg, transparent 0 5px, var(--sunk) 5px 6px); }
  .ramp.slim .sw, .ramp.slim .void { height: 30px; }
  .ramp.slim .sw small { display: none; }
  .ramp.mid .sw, .ramp.mid .void { height: 38px; } .ramp.mid .sw small { display: none; }
  /* options du mode sombre : chaque choix montré sur la marque et dans une interface */
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: minmax(190px, 1fr) minmax(0, 1.9fr) minmax(190px, 0.9fr); gap: 14px; align-items: center; text-align: left;
         border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
  .opt.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .opt .oi { display: grid; gap: 4px; align-content: start; justify-items: start; } .opt .oi b { font-size: 15px; }
  .opt .oi small { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .opt .bv { font: 600 12.5px/1.35 var(--mono); } .opt .bv.ok { color: var(--ok); } .opt .bv.bad { color: var(--bad); }
  .opt .or { padding: 6px; border-radius: 8px; }
  .dmock { border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; align-content: start; }
  .dmock b { font-size: 13.5px; } .dmock .dbtn { justify-self: start; padding: 4px 10px; border-radius: 6px; font-weight: 600; margin-top: 2px; }
  .dmock .dalert { padding: 3px 7px; border-radius: 5px; }
  @media (max-width: 900px) { .opt { grid-template-columns: 1fr; } }
  .lens { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; justify-self: start; }
  .seg button { border: 0; border-radius: 0; padding: 6px 14px; background: var(--paper); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .ramp-lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .ramp-lab b { color: var(--ink); font-weight: 600; }
  .stepnames { display: grid; gap: 2px; font: 10.5px/1 var(--mono); color: var(--muted); text-align: center; }
  @media (max-width: 640px) { .ramp .sw small { display: none; } }

  /* ---------- constats ---------- */
  .finding { border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 14px 16px; background: var(--paper); display: grid; gap: 8px; }
  .finding.bad { border-left-color: var(--bad); }
  .finding.ok { border-left-color: var(--ok); }
  .finding .kind { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
  .finding.bad .kind { color: var(--bad); } .finding.ok .kind { color: var(--ok); }
  .finding h3 { font-size: 16.5px; }
  .finding p { font-size: 14px; color: var(--muted); }
  .act-btn { font-size: 13px; padding: 6px 11px; }
  .dot { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; border: 1px solid rgba(128,128,128,.4); margin-right: 3px; }

  /* ---------- positions ---------- */
  .pos { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; background: var(--paper); display: grid; gap: 10px; cursor: pointer; text-align: left; }
  .pos.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .pos h3 { font-size: 18px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
  .kpi b { display: block; font: 600 20px/1.1 var(--mono); }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }

  /* ---------- régleur ---------- */
  #tuner { width: 100%; border: 0; border-radius: 12px; background: var(--ground); min-height: 900px; display: block; }

  /* ---------- contrôle ---------- */
  .verdict { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; font-weight: 600; font-size: 17px; }
  .verdict.ok { background: var(--ok-soft); color: var(--ok); } .verdict.bad { background: var(--bad-soft); color: var(--bad); }
  .checks { display: grid; gap: 0; }
  .check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .check:first-child { border-top: 0; }
  .check .i { font-weight: 700; } .check.pass .i { color: var(--ok); } .check.fail .i { color: var(--bad); } .check.kept .i { color: var(--warn); }
  details.more > summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 6px 0; }
  details.more .opts { margin-top: 8px; }
  details.tech summary { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 2px; }
  .check small.cause { color: var(--warn); font-family: var(--sans); font-size: 13px; }
  .verdict.warn { background: var(--warn-soft); color: var(--warn); }
  .check small { display: block; color: var(--muted); font: 12px/1.45 var(--mono); overflow-wrap: anywhere; }
  .tester { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .sample { border-radius: 10px; padding: 18px; min-height: 120px; display: grid; gap: 6px; align-content: center; border: 1px solid var(--line); }
  .sample .big { font-size: 26px; font-weight: 700; } .sample .small { font-size: 14px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font: 500 11.5px/1 var(--mono); padding: 4px 8px; border-radius: 20px; }
  .badge.y { background: var(--ok-soft); color: var(--ok); } .badge.n { background: var(--bad-soft); color: var(--bad); }
  .mock { border-radius: 12px; padding: 18px; display: grid; gap: 12px; border: 1px solid var(--line); }
  .mock .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .mock .alert { padding: 10px 12px; border-radius: 8px; font-size: 13.5px; border: 1px solid; }
  .mock .field { padding: 8px 10px; border-radius: 8px; font-size: 14px; border: 1px solid; }
  @media (max-width: 720px) { .tester { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } }

  /* ---------- livrer ---------- */
  .entries { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .entries button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .entries button.on { background: var(--ink); color: var(--ground); }
  .shell.solo { grid-template-columns: minmax(0, 1fr); max-width: 1120px; }
  .shell.solo .rail { display: none; }
  .home { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .home .door { grid-template-rows: auto auto 1fr auto; }
  .home .door .primary { justify-self: start; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .scroll { overflow-x: auto; }
  .tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl th { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tbl .dot { margin-right: 2px; }
  .dot.void { background: none; border: 1px dashed var(--line); }
  .st-aligned { background: var(--ok-soft); color: var(--ok); } .st-divergent { background: var(--bad-soft); color: var(--bad); }
  .st-shared { background: var(--warn-soft); color: var(--warn); } .st-exclusive { background: var(--sunk); color: var(--muted); }
  .minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .mini { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--ground); }
  .mini figcaption { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .mini svg { width: 100%; height: auto; display: block; }
  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13.5px; }
  .checks .y b { color: var(--ok); } .checks .n b { color: var(--bad); } .checks .info b { color: var(--muted); }
  .swcard { position: fixed; right: 18px; bottom: 18px; width: 260px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.15); z-index: 40; }
  .swcard[hidden] { display: none; }
  .board-row { display: grid; grid-template-columns: 120px repeat(4, minmax(0, 1fr)); gap: 8px; align-items: center; }
  .board-cell { all: unset; cursor: pointer; border: 2px solid transparent; border-radius: 8px; padding: 2px; }
  .board-cell.on { border-color: var(--ink); }
  .spreads { display: grid; gap: 6px; }
  .spread { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
  .spread .bar { position: relative; height: 10px; background: var(--sunk); border-radius: 5px; }
  .spread .bar i { position: absolute; top: 0; bottom: 0; background: var(--ink); border-radius: 5px; opacity: .8; }
  .spread .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ok); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  #out { min-height: 320px; }
  .filebtn { cursor: pointer; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
  .filebtn:hover { border-color: var(--ink); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.on { opacity: 1; }
  /* résumé des méthodes : la liste où l'on choisit */
  .briefs { display: grid; gap: 4px; }
  .brief { display: grid; grid-template-columns: minmax(180px, 1.2fr) minmax(0, 1.6fr) 150px 70px; gap: 14px; align-items: center; text-align: left;
           border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; background: var(--paper); }
  .brief.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .brief .bn b { font-size: 14px; } .brief .bn small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.35; }
  .brief .br .ramp .sw { height: 18px; padding: 0; } .brief .br .ramp .sw span, .brief .br .ramp .sw small { display: none; }
  .brief .bv { font: 600 12.5px/1.2 var(--mono); } .brief .bv.ok { color: var(--ok); } .brief .bv.bad { color: var(--bad); }
  .brief .bd { font: 500 12.5px/1 var(--mono); color: var(--muted); text-align: right; }
  @media (max-width: 760px) { .brief { grid-template-columns: 1fr 1fr; } .brief .bn, .brief .br { grid-column: 1 / -1; } }
  details.panel > summary { cursor: pointer; list-style: revert; }

/**
 * Seed synthétique, pour un nuancier qui n'a pas de couleur « par défaut » fournie
 * — typiquement une rampe neutre dont on ne connaît que l'encre et les fonds clairs.
 * On garde la teinte des couleurs existantes (moyenne circulaire pondérée par la chroma,
 * pour que les quasi-gris ne votent pas) et la chroma la plus marquée d'entre elles,
 * puis on vise la cible de contraste du step d'ancrage.
 */
function synthesizeSeed(anchors, ladders, seedIndex) {
  const cols = Object.values(anchors).filter(Boolean).map(hexToOklch);
  let x = 0, y = 0, maxC = 0;
  for (const c of cols) {
    const w = Math.max(c.C, 1e-4);
    x += Math.cos((c.H * Math.PI) / 180) * w;
    y += Math.sin((c.H * Math.PI) / 180) * w;
    maxC = Math.max(maxC, c.C);
  }
  const H = ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
  const target = Math.pow(21, ladders.shade[seedIndex] / 200);
  const L = bisectLightness(target, l => contrastVsBlack(oklchToHex(l, maxC, H)), { increasing: true });
  return oklchToHex(L, maxC, H);
}

function buildData(spec) {
  const steps = spec.steps;
  const n = steps.length;
  const seedIndex = steps.indexOf(spec.seedStep);
  if (seedIndex < 0) throw new Error(`seedStep "${spec.seedStep}" absent de steps`);

  const coreLadders = buildLadders(n, spec.ladders || {});
  // Les garanties de contraste se lisent sur les crans **réguliers** : les crans
  // supplémentaires, eux, sont hors grille par construction et ne participent pas à la règle.
  // Une nomenclature par contraste pose sa règle sur sa grille virtuelle (un rang = un grain de
  // nom), et situe chaque cran sur cette grille : l'écart de rangs y est un écart de noms.
  const rules = contrastRules(spec.ruleLadder || coreLadders.shade);
  if (spec.rankUnit) rules.grain = spec.rankUnit.grain;
  // la fonction ne survivrait pas à la sérialisation : on la déplie en table
  rules.rankTable = Array.from({ length: n - 1 }, (_, k) => ({ rank: k + 1, ratio: rules.ratioForRank(k + 1) }));
  delete rules.ratioForRank;

  /**
   * Crans supplémentaires — typiquement le blanc et le noir purs, plus un cran très clair
   * et un cran très sombre, dont une rampe neutre a besoin pour les surfaces d'interface.
   *
   * Ils s'ajoutent à l'échelle sans toucher aux crans réguliers : leur shade est extrapolée
   * de la droite qui relie les crans existants à leur nom, puis bornée — un cran nommé « 0 »
   * atteint shade 200 (blanc pur) et « 1000 » shade 0 (noir pur). Les nuanciers qui ne les
   * déclarent pas laissent simplement le rang vide, comme n'importe quelle méthode creuse.
   */
  const extraNames = (spec.extraSteps || []).map(String);
  const fit = (() => {
    // Les noms de crans ne sont pas régulièrement espacés (50→100 vaut 50, 100→200 vaut 100) :
    // une régression linéaire sur le nom donnerait n'importe quoi. On interpole donc par
    // morceaux entre crans voisins, en ancrant les deux bouts sur ce qu'ils signifient
    // nécessairement — 0 est le blanc pur (shade 200) et 1000 le noir pur (shade 0).
    const known = [
      { x: 0, y: 200 },
      ...steps.map((name, i) => ({ x: Number(name), y: coreLadders.shade[i] })),
      { x: 1000, y: 0 },
    ].sort((a, b) => a.x - b.x);
    return name => {
      const x = Number(name);
      const exact = known.find(k => k.x === x);
      if (exact) return exact.y;
      const hi = known.findIndex(k => k.x > x);
      if (hi <= 0) return known[0].y;
      const a = known[hi - 1], b = known[hi];
      return a.y + ((b.y - a.y) * (x - a.x)) / (b.x - a.x);
    };
  })();

  // fusion : tout est trié par shade décroissante, du plus clair au plus foncé
  const merged = [
    ...steps.map((name, i) => ({ name, shade: coreLadders.shade[i], core: true })),
    ...extraNames.map(name => ({ name, shade: fit(name), core: false })),
  ].sort((a, b) => b.shade - a.shade);

  const allSteps = merged.map(m => m.name);
  const isCore = merged.map(m => m.core);
  const nAll = allSteps.length;
  const coreIndex = merged.map((m, i) => (m.core ? i : -1)).filter(i => i >= 0);
  // rang de chaque position sur la grille régulière — null pour un cran hors grille
  const coreRank = merged.map((m, i) => (!m.core ? null
    : spec.rankPositions ? spec.rankPositions[steps.indexOf(m.name)] : coreIndex.indexOf(i)));

  // les échelles cibles de chaque méthode, ré-étalées sur l'échelle complète
  const ladders = buildLadders(nAll, { ...(spec.ladders || {}), shadeLadder: merged.map(m => m.shade) });
  for (const key of ['oklchL', 'tone', 'easingL', 'leonardo', 'apca']) {
    const src = coreLadders[key];
    if (!Array.isArray(src)) continue;
    // les crans réguliers gardent leur valeur exacte ; les extras sont interpolés
    const out = new Array(nAll);
    coreIndex.forEach((gi, k) => { out[gi] = src[k]; });
    for (let i = 0; i < nAll; i++) {
      if (out[i] !== undefined) continue;
      const before = coreIndex.filter(g => g < i).pop();
      const after = coreIndex.find(g => g > i);
      if (before === undefined) out[i] = src[0] + (src[0] - src[1]) * (coreIndex[0] - i);
      else if (after === undefined) out[i] = src[n - 1] + (src[n - 1] - src[n - 2]) * (i - coreIndex[n - 1]);
      else {
        const t = (i - before) / (after - before);
        out[i] = out[before] + (out[after] - out[before]) * t;
      }
    }
    ladders[key] = out;
  }
  ladders.shade = merged.map(m => m.shade);

  /**
   * Le mode sombre — opt-in par `spec.darkMode`.
   *
   * Le barreau de shades **est déjà** un barreau de luminance : shade s impose un contraste
   * `21^(s/200)` face au noir, donc un Y. Le mode sombre n'est alors pas une seconde palette
   * à dessiner, c'est le même barreau relu contre un autre fond — chaque cran garde son
   * contraste, donc son sens, et le seuil AA tombe au même endroit dans les deux modes.
   *
   * Ce barreau-ci sert de référence (budget, crans hors d'atteinte). Les couleurs sombres,
   * elles, sont dérivées plus bas de la luminance réellement obtenue en clair : c'est ce qui
   * garantit que chaque cran porte le même contraste dans les deux modes.
   */
  const darkCfg = spec.darkMode || null;
  const lightBackground = spec.lightBackground || '#ffffff';
  let dark = null;
  if (darkCfg) {
    const background = darkCfg.background;
    if (!/^#[0-9a-fA-F]{6}$/.test(background || '')) {
      throw new Error(`darkMode.background doit être un hex à 6 chiffres, reçu "${background}"`);
    }
    const lightY = ladders.shade.map(s => luminanceForContrastVsBlack(Math.pow(21, s / 200)));
    // le haut du barreau : en deux morceaux (`spreadTop: true`) et sous un plafond anti-halo
    // (`haloCap: 14`, ou `true` pour 14:1) — l'égalité reste exacte jusqu'au dernier seuil de texte
    const top = darkCfg.spreadTop || darkCfg.haloCap ? { split: 7, cap: darkCfg.haloCap === true ? 14 : Number(darkCfg.haloCap) || null } : null;
    const darkY = top ? spreadTop(darkLadderFromLight(lightY, background), background, top) : darkLadderFromLight(lightY, background);
    const budget = contrastBudget(background);

    // Le profil de chroma est posé sur l'échelle complète : c'est une courbe lisse, la
    // rééchantillonner sur nAll plutôt que sur la seule grille régulière ne change pas sa
    // forme, et les crans hors grille tombent aux extrémités, là où la cloche est basse.
    const raw = darkCfg.chromaProfile;
    // le profil se lit à la position de chaque cran sur la grille régulière : un cran garde
    // ainsi la même valeur, donc la même couleur sombre, d'un jeu de crans à l'autre
    const vividness = raw === undefined || raw === null ? 0
      : raw === 'bell' ? profileOnLadder(ladders.shade, n, BELL_CHROMA)
      : Array.isArray(raw) ? profileOnLadder(ladders.shade, n, raw)
      : Number(raw);

    dark = {
      background, top,
      backgroundY: Math.round(relativeLuminance(background) * 1e6) / 1e6,
      contrastBudget: Math.round(budget * 1e4) / 1e4,
      gamutCeiling: darkCfg.gamutCeiling ?? 0.96,
      chromaProfile: Array.isArray(vividness) ? vividness.map(v => Math.round(v * 1000) / 1000) : vividness,
      profileName: raw === 'bell' ? 'bell' : Array.isArray(raw) ? 'custom'
        : raw === undefined || raw === null ? (darkCfg.desaturate > 0 ? 'desaturated' : 'aligned') : 'constant',
      // la méthode de dérivation (lib/dark.mjs) ; le miroir WCAG est la seule qui transporte la règle
      method: darkCfg.method || 'mirror-wcag',
      // part de chroma retirée en sombre — 0 : le sombre garde l'éclat du clair. Par défaut, sur
      // les seuls crans de surface : les systèmes mesurés ne désaturent pas accents et textes
      desaturate: Math.max(0, Math.min(0.9, Number(darkCfg.desaturate) || 0)),
      desaturateScope: darkCfg.desaturateScope === 'all' ? 'all' : 'surfaces',
      ladder: darkY,
      // Un cran dont la cible dépasse Y = 1 est hors d'atteinte sur ce fond : le fond est
      // trop clair pour porter ce contraste. C'est structurel, on le nomme au lieu de le
      // laisser sortir en blanc sans explication.
      outOfBudget: allSteps.filter((_, i) => isCore[i] && darkY[i] > 1),
      vividness,
      pins: darkCfg.pins || {},
    };
  }

  const tunedBase = spec.tunedBase || 'fusilier';
  // `lightChroma: "vivid"` (ou une fraction de 0 à 1) : la re-saturation en clair, appliquée à la méthode de base
  const vivid = spec.lightChroma === 'vivid' ? 1 : typeof spec.lightChroma === 'number' ? Math.max(0, Math.min(1, spec.lightChroma)) : 0;
  const methods = methodCatalog({ ...spec, steps: allSteps }, ladders, rules, tunedBase);
  // l'exemple ne fournit aucune couleur : ses couleurs de départ ne font pas un « existant »
  if (spec.demo) delete methods.existing;
  const methodOrder = METHOD_DISPLAY_ORDER.filter(m => methods[m]);
  const coreMethod = spec.coreMethod || 'fusilier';
  // la méthode qui reçoit l'éclat vif : celle du core, ou celle sous les réglages
  const vividBase = coreMethod === 'tuned' ? tunedBase : ['existing', 'anchored'].includes(coreMethod) ? null : coreMethod;
  const vividBell = profileOnLadder(ladders.shade, n, BELL_CHROMA);

  // Déclinaisons de teinte : opt-in par la spec. Générées avec la méthode core, sauf si
  // celle-ci a besoin de couleurs existantes — une déclinaison n'en a par construction aucune.
  const hueCfg = spec.hueVariants || {};
  const hueOffsets = hueCfg.offsets || [];
  const hueSpace = hueCfg.space === 'oklch' ? 'oklch' : 'hsl';
  const variantMethod = ['existing', 'anchored'].includes(coreMethod) ? 'fusilier' : coreMethod;

  /**
   * Quels nuanciers méritent des déclinaisons.
   *
   * Rarement tous : une couleur système ne peut pas tourner de 30° sans cesser de vouloir
   * dire ce qu'elle dit (un rouge d'erreur doit rester rouge), et une couleur de marque
   * n'est pas négociable. La question a du sens pour les lignes produit, où la teinte est
   * un choix et où le voisinage indique la place disponible.
   *
   * `appliesTo` liste les nuanciers concernés ; en son absence, tous le sont. Un nuancier
   * peut trancher lui-même avec `hueVariants: true | false`.
   */
  const wantsVariants = rspec => {
    if (!hueOffsets.length) return false;
    if (typeof rspec.hueVariants === 'boolean') return rspec.hueVariants;
    if (Array.isArray(hueCfg.appliesTo)) return hueCfg.appliesTo.includes(rspec.name);
    return true;
  };

  // ---- nuanciers
  const defaultRole = spec.defaultRole || 'default';
  const seedIndexAll = allSteps.indexOf(spec.seedStep);

  function buildRamp(rspec) {
    const anchors = rspec.anchors || {};
    if (!Object.values(anchors).filter(Boolean).length && !rspec.seed) {
      throw new Error(`nuancier "${rspec.name}" : aucune couleur fournie`);
    }

    // Un nuancier sans couleur « par défaut » reste légitime (rampe neutre : on connaît
    // l'encre et les fonds, pas le milieu). On en fabrique une, en le signalant.
    const seedProvided = !!anchors[defaultRole] || !!rspec.seed;
    const seed = rspec.seed || (anchors[defaultRole] || synthesizeSeed(anchors, ladders, seedIndexAll));

    // Les ancres ne se placent que sur les crans que ce nuancier utilise réellement.
    const usesExtra = rspec.extraSteps === true;
    const activeIdx = ladders.shade.map((_, i) => i).filter(i => isCore[i] || usesExtra);
    const activeShades = activeIdx.map(i => ladders.shade[i]);
    const pinnedLocal = (anchors[defaultRole] && spec.pinDefault !== false)
      ? { pinned: { [defaultRole]: activeIdx.indexOf(seedIndexAll) } } : {};
    const local = placeAnchors(anchors, activeShades, pinnedLocal);
    // …puis on remappe vers les rangs de l'échelle complète
    const anchorPlacement = {
      ...local,
      placements: local.placements.map(p => ({
        ...p,
        index: activeIdx[p.index],
        // le rang « mérité » se remappe lui aussi vers l'échelle complète
        naturalIndex: activeIdx[Math.max(0, Math.min(activeIdx.length - 1, Math.round(p.naturalIndex)))],
      })),
      crowding: (local.crowding || []).map(c => ({ ...c, index: activeIdx[c.index] })),
    };

    const ctx = {
      seed, anchors, steps: allSteps, n: nAll, seedIndex: seedIndexAll, ladders,
      tuned: rspec.tuned || null,
      tunedBase,
      isNeutral: rspec.kind === 'neutral',
      anchorPlacement,
      scales: {},
      meta: {},
    };
    for (const m of METHOD_COMPUTE_ORDER) {
      if (!methods[m]) continue;
      ctx.scales[m] = METHOD_IMPL[m](ctx);
      // éclat vif en clair : la méthode de base garde sa luminance (donc tous ses contrastes)
      // et prend, en cloche, une part du chemin qui reste jusqu'à la chroma maximale tenable.
      // Jamais sous la chroma qu'elle avait, jamais au-delà de 96 % du gamut ; le neutre n'y touche pas.
      // une famille peut choisir son éclat (la planche de variantes) : « seed », « vivid »,
      // « max » (le plafond à chaque cran, sans cloche) ou une fraction du chemin
      const rc = rspec.lightChroma;
      const amount = rc === 'seed' ? 0 : rc === 'vivid' ? 1 : rc === 'max' ? 'max' : typeof rc === 'number' ? Math.max(0, Math.min(1, rc)) : vivid;
      if (m === vividBase && amount && rspec.kind !== 'neutral') ctx.scales[m] = ctx.scales[m].map((hex, i) => {
        if (!hex) return hex;
        const Y = relativeLuminance(hex), { C, H } = hexToOklch(hex);
        const ceiling = maxChromaAtLuminance(Y, H) * GAMUT_CEILING;
        if (C >= ceiling) return hex;
        return solveAtLuminance(Y, C + (ceiling - C) * (amount === 'max' ? 1 : (vividBell[i] || 0) * amount), H).hex;
      });
    }

    // Le panachage : un nuancier peut garder une autre méthode que le système (`method:
    // "anchored"` garde la marque telle qu'elle est, ses couleurs exactement, le reste comblé).
    // Le contrat juge ensuite le système mixte, tel qu'il sera livré : ce que la marque gardée
    // coûte en franchissements se lit au lieu de se deviner.
    if (rspec.method && rspec.method !== coreMethod && ctx.scales[rspec.method] && !SPARSE_METHODS.has(rspec.method)) {
      ctx.scales[coreMethod] = ctx.scales[rspec.method].slice();
    }

    // Un nuancier n'utilise les crans supplémentaires que s'il les demande : ailleurs le rang
    // reste vide, exactement comme un trou de méthode creuse.
    // Le blanc et le noir purs ne se génèrent pas : ils n'ont ni teinte ni saturation à
    // préserver, ce sont les bornes de l'échelle. Toute méthode les rend à l'identique.
    const mask = scale => scale.map((hex, i) => {
      if (!isCore[i] && !usesExtra) return null;
      if (ladders.shade[i] >= 199.99) return '#ffffff';
      if (ladders.shade[i] <= 0.01) return '#000000';
      return hex;
    });

    const colors = {}, meta = {}, matrix = {};
    for (const m of methodOrder) {
      ctx.scales[m] = mask(ctx.scales[m]);
      colors[m] = ctx.scales[m];
      meta[m] = ctx.scales[m].map(swatchMeta);
      matrix[m] = contrastMatrix(ctx.scales[m]);
    }

    // ---- mode sombre : la même rampe relue contre le fond sombre
    const darkColors = {}, darkMeta = {}, darkDetail = {};
    if (dark) {
      // Le neutre reste le neutre : il porte les fonds et les encres, une variante « vive »
      // n'y a aucun sens et le rendrait teinté. Un nuancier peut trancher lui-même.
      const vividness = rspec.darkChroma !== undefined ? rspec.darkChroma
        : (rspec.kind === 'neutral' ? 0 : dark.vividness);
      const pins = dark.pins[rspec.name] || {};

      const tokenMethod = methodOrder.includes(coreMethod) ? coreMethod : methodOrder[0];
      for (const m of methodOrder) {
        // Le barreau sombre est déduit de la luminance **réellement obtenue** en clair, et
        // non de la cible commune. La nuance est décisive : ce qui est promis, c'est qu'un
        // cran porte le même contraste dans les deux modes. Dériver de la cible produirait un
        // mode sombre impeccable au-dessus d'un mode clair approximatif — la parité serait
        // rompue sans que rien ne le signale, et c'est précisément le cas d'une méthode qui
        // privilégie les couleurs de marque (`anchored`) sur la régularité.
        const solved = deriveDark(colors[m], {
          method: dark.method, background: dark.background, top: dark.top,
          vividness, gamutCeiling: dark.gamutCeiling, desaturate: dark.desaturate, scope: dark.desaturateScope,
          rule: { ranks: coreRank, ui: rules.rankForUI, aa: rules.rankForAA, aaa: rules.rankForAAA },
        });
        darkColors[m] = solved.map((d, i) => {
          if (colors[m][i] === null) return null;
          // Les bornes du mode sombre sont les bornes du mode clair, échangées : le cran qui
          // valait le blanc pur devient le fond lui-même (contraste 1:1 des deux côtés), et
          // celui qui valait le noir pur devient le blanc pur.
          if (ladders.shade[i] >= 199.99) return dark.background;
          if (ladders.shade[i] <= 0.01) return '#ffffff';
          if (pins[allSteps[i]]) return pins[allSteps[i]];
          return d ? d.hex : null;
        });
        darkMeta[m] = darkColors[m].map(swatchMeta);
        // Le détail — écrêtage, gain d'éclat, hors budget — n'est conservé que pour la
        // méthode qui part en tokens : c'est la seule dont on aura à justifier les valeurs.
        if (m === tokenMethod) {
          darkDetail[m] = solved.map((d, i) => (d && colors[m][i] ? {
            step: allSteps[i], hex: darkColors[m][i],
            clamped: d.clamped, outOfBudget: d.outOfBudget,
            chromaGain: d.chromaGain, maxChroma: d.maxChroma,
            // L'écart absolu, en plus du rapport : sur un quasi-gris (C ≈ 0,005) le rapport
            // s'affole pour un écart d'arrondi hex parfaitement invisible. C'est l'absolu
            // qui dit s'il s'est réellement passé quelque chose.
            chromaDelta: Math.round((d.chroma - d.lightChroma) * 10000) / 10000,
            lightChroma: d.lightChroma,
            pinned: !!pins[allSteps[i]],
          } : null));
        }
      }
    }

    return {
      darkColors: dark ? darkColors : null,
      darkMeta: dark ? darkMeta : null,
      darkDetail: dark ? darkDetail : null,
      darkChroma: dark ? (rspec.darkChroma !== undefined ? rspec.darkChroma
        : (rspec.kind === 'neutral' ? 0 : dark.profileName)) : null,
      hue: Math.round(hexToOklch(seed).H * 10) / 10,
      chroma: Math.round(hexToOklch(seed).C * 1000) / 1000,
      derived: !!rspec.derived,
      derivedFrom: rspec.derivedFrom || null,
      hueOffset: rspec.hueOffset ?? null,
      chromaLoss: rspec.chromaLoss ?? null,
      chromaDelta: rspec.chromaDelta ?? null,
      lightnessDelta: rspec.lightnessDelta ?? null,
      hslHue: rspec.hslHue ?? null,
      perceivedRotation: rspec.perceivedRotation ?? null,
      hueSpace: rspec.hueSpace ?? null,
      name: rspec.name,
      label: rspec.label || rspec.name,
      kind: rspec.kind || 'product',
      // les usages que sert cette famille (chemins fonctionnels) : ce qui permet de fusionner sans perdre d'usage
      primitives: Array.isArray(rspec.primitives) ? rspec.primitives : [],
      methodOverride: rspec.method && rspec.method !== coreMethod && !SPARSE_METHODS.has(rspec.method) ? rspec.method : null,
      source: rspec.source || '',
      note: rspec.note || '',
      anchors,
      seed,
      seedProvided,
      seedIndex: seedIndexAll,
      steps: allSteps,
      usesExtra,
      colors,
      meta,
      matrix,
      anchorPlacement: {
        placements: anchorPlacement.placements.map(p => {
          const nat = Math.max(0, Math.min(nAll - 1, Math.round(p.naturalIndex)));
          return {
            role: p.role, hex: p.hex, index: p.index, step: allSteps[p.index],
            shade: Math.round(p.shade * 10) / 10,
            naturalIndex: Math.round(p.naturalIndex * 100) / 100,
            naturalStep: allSteps[nat],
            // écart entre le rang que la couleur mérite et celui qu'elle occupe :
            // c'est la mesure de « ce step est-il correctement nommé »
            rankGap: p.index - nat,
            moved: !!p.moved, pinned: !!p.pinned,
            crowded: !!p.crowded, primary: p.primary !== false,
          };
        }),
      },
      crowding: anchorPlacement.crowding || [],
      consistency: anchorConsistency(anchors),
      tailwindFamily: ctx.meta.tailwindFamily || null,
      tailwindDeltaE: ctx.meta.tailwindDeltaE ?? null,
      tailwindHueShift: ctx.meta.tailwindHueShift ?? null,
    };
  }

  /**
   * Nuanciers, avec les déclinaisons de teinte insérées de part et d'autre de leur parent :
   * Coral −30° · Coral · Coral +30°.
   *
   * Ce sont des nuanciers à part entière (toutes les méthodes, matrices comprises), mais
   * marqués `derived` : ce sont des hypothèses, pas des couleurs de la marque. Ils sont donc
   * exclus des métriques comparatives, qui répondent à « quelle méthode retenir pour les
   * couleurs réelles » — les y inclure reviendrait à compter plusieurs fois la même
   * propriété structurelle et à diluer le signal.
   */
  const ramps = [];
  for (const rspec of spec.ramps) {
    const base = buildRamp(rspec);
    const before = [], after = [];
    for (const offset of (wantsVariants(rspec) ? hueOffsets : [])) {
      const v = hueVariantSeed(base.seed, offset, hueSpace);
      const sign = offset > 0 ? '+' : '−';
      const derived = buildRamp({
        ...rspec,
        name: `${rspec.name}-${offset > 0 ? 'p' : 'm'}${Math.abs(offset)}`,
        label: `${rspec.label || rspec.name} ${sign}${Math.abs(offset)}°`,
        anchors: {},                 // une déclinaison n'a aucune couleur déjà arbitrée
        seed: v.hex,
        derived: true,
        derivedFrom: rspec.name,
        hueOffset: offset,
        chromaLoss: v.chromaLoss,
        chromaDelta: v.chromaDelta,
        perceivedRotation: v.perceivedRotation,
        hueSpace,
        lightnessDelta: v.lightnessDelta,
        hslHue: v.hslHue,
        source: '',
        note: spec.lang === 'en' ? (hueSpace === 'hsl'
          ? `Variant of “${rspec.label || rspec.name}”: hue rotated by ${sign}${Math.abs(offset)}° on the `
            + `HSL wheel — the one colour pickers use — HSL saturation and lightness unchanged (H ${v.hslHue}° in HSL). `
            + `Since HSL is not perceptual, these ${Math.abs(offset)}° actually amount to `
            + `${Math.abs(v.perceivedRotation)}° of perceived hue (×${(Math.abs(v.perceivedRotation) / Math.abs(offset)).toFixed(2)}).`
          : `Variant of “${rspec.label || rspec.name}”: hue rotated by ${sign}${Math.abs(offset)}° on the `
            + `OKLCH wheel, lightness and saturation kept (H ${v.hue}°)`
            + (v.chromaLoss > 0.005 ? `. The sRGB gamut cannot hold this saturation at this hue: chroma reduced by ${v.chromaLoss}.` : '.'))
        : hueSpace === 'hsl'
          ? `Déclinaison de « ${rspec.label || rspec.name} » : teinte tournée de ${sign}${Math.abs(offset)}° sur la roue `
            + `HSL — celle des sélecteurs de couleur — saturation et luminosité HSL inchangées (H ${v.hslHue}° en HSL). `
            + `HSL n'étant pas perceptuel, ces ${Math.abs(offset)}° valent en réalité `
            + `${Math.abs(v.perceivedRotation)}° de teinte perçue (×${(Math.abs(v.perceivedRotation) / Math.abs(offset)).toFixed(2)}).`
          : `Déclinaison de « ${rspec.label || rspec.name} » : teinte tournée de ${sign}${Math.abs(offset)}° sur la roue `
            + `OKLCH, luminosité et saturation conservées (H ${v.hue}°)`
            + (v.chromaLoss > 0.005 ? `. Le gamut sRGB ne tient pas cette saturation à cette teinte : chroma réduite de ${v.chromaLoss}.` : '.'),
      });
      (offset < 0 ? before : after).push({ offset, ramp: derived });
    }
    before.sort((a, b) => a.offset - b.offset);
    after.sort((a, b) => a.offset - b.offset);
    ramps.push(...before.map(x => x.ramp), base, ...after.map(x => x.ramp));
  }

  /** Les couleurs réellement arbitrées par la marque — la base de toute métrique. */
  const realRamps = ramps.filter(r => !r.derived);

  // ---- correspondance des couleurs existantes, méthode par méthode
  const anchorMap = [];
  for (const r of realRamps) {
    for (const [role, hex] of Object.entries(r.anchors)) {
      if (!hex) continue;
      const placed = r.anchorPlacement.placements.find(p => p.role === role);
      const perMethod = {};
      for (const m of methodOrder) {
        if (m === 'existing') continue;
        const { index, deltaE } = nearestInScale(hex, r.colors[m]);
        perMethod[m] = { step: r.steps[index], index, deltaE, hex: r.colors[m][index] };
      }
      // Un nuancier peut fournir plus de couleurs que l'échelle n'a de crans : la dernière
      // arrivée reste alors sans rang. Ce n'est pas une anomalie à masquer, c'est
      // l'information « votre palette est plus dense que l'échelle à cet endroit ».
      if (!placed) {
        anchorMap.push({
          ramp: r.name, rampLabel: r.label, kind: r.kind, role, hex,
          shade: Math.round(shadeOf(hex) * 10) / 10,
          placedStep: null, placedIndex: null, naturalStep: null, naturalIndex: null,
          rankGap: null, moved: false, pinned: false, unplaced: true,
          cvw: Math.round(contrastVsWhite(hex) * 100) / 100,
          cvb: Math.round(contrastVsBlack(hex) * 100) / 100,
          perMethod,
        });
        continue;
      }
      anchorMap.push({
        ramp: r.name, rampLabel: r.label, kind: r.kind, role, hex,
        shade: placed.shade,
        placedStep: placed.step, placedIndex: placed.index,
        naturalStep: placed.naturalStep, naturalIndex: placed.naturalIndex, rankGap: placed.rankGap,
        moved: placed.moved, pinned: placed.pinned, unplaced: false,
        cvw: Math.round(contrastVsWhite(hex) * 100) / 100,
        cvb: Math.round(contrastVsBlack(hex) * 100) / 100,
        perMethod,
      });
    }
  }

  const metrics = {};

    for (const r of a.spec.ramps) {
      if (!fam.has(r.name)) fam.set(r.name, { name: r.name, label: r.label || r.name, kind: r.kind, by: {} });
      fam.get(r.name).by[a.name] = r.anchors || {};
    }
  }
  const families = [...fam.values()].map(f => {
    const srcs = names.filter(n => f.by[n]);
    const steps = [...new Set(srcs.flatMap(s => Object.keys(f.by[s])))].sort(byStep);
    const cells = steps.map(st => {
      const vals = srcs.filter(s => f.by[s][st]).map(s => [s, f.by[s][st]]);
      if (vals.length < 2) return { step: st, status: 'exclusive', values: Object.fromEntries(vals) };
      let maxDE = 0;
      for (let i = 0; i < vals.length; i++) for (let j = i + 1; j < vals.length; j++) maxDE = Math.max(maxDE, deltaE2000Hex(vals[i][1], vals[j][1]));
      return { step: st, status: maxDE < aligned ? 'aligned' : 'divergent', maxDE: round(maxDE), values: Object.fromEntries(vals) };
    });
    const shared = cells.filter(c => c.status !== 'exclusive');
    const divergent = cells.filter(c => c.status === 'divergent').length;
    const status = srcs.length === 1 ? 'exclusive' : divergent ? 'divergent' : srcs.length === names.length ? 'aligned' : 'shared';
    return { name: f.name, label: f.label, kind: f.kind, sources: srcs, steps: steps.length, divergent,
      meanDE: shared.length ? round(mean(shared.map(c => c.maxDE))) : null, status, cells };
  });

  // un même nom pour deux couleurs : le piège qui coûte le plus quand on passe d'une marque à l'autre
  const sameNameDifferent = families.filter(f => f.status === 'divergent' && f.meanDE >= sameName)
    .map(f => ({ name: f.name, meanDE: f.meanDE, sources: f.sources }));

  // deux noms pour une couleur : chaque famille propre à une source, contre celles propres à l'autre
  const renames = [];
  for (let i = 0; i < audits.length; i++) {
    for (let j = i + 1; j < audits.length; j++) {
      const A = audits[i], B = audits[j];
      const onlyA = A.spec.ramps.filter(r => !B.spec.ramps.some(x => x.name === r.name));
      const onlyB = B.spec.ramps.filter(r => !A.spec.ramps.some(x => x.name === r.name));
      for (const ra of onlyA) {
        for (const rb of onlyB) {
          const common = Object.keys(ra.anchors || {}).filter(st => rb.anchors?.[st]);
          if (common.length < 2) continue;
          const de = round(mean(common.map(st => deltaE2000Hex(ra.anchors[st], rb.anchors[st]))));
          if (de < rename) renames.push({ a: { source: A.name, family: ra.name }, b: { source: B.name, family: rb.name }, meanDE: de, steps: common.length });
        }
      }
    }
  }
  renames.sort((x, y) => x.meanDE - y.meanDE);

  // les grilles : quels crans chaque source utilise, et les familles trop courtes pour être des rampes
  const numeric = s => /^\d+$/.test(s);
  const grids = audits.map(a => ({
    source: a.name,
    steps: [...new Set(a.spec.ramps.flatMap(r => Object.keys(r.anchors || {}).filter(numeric)))].sort(byStep),
    partial: a.spec.ramps.filter(r => Object.keys(r.anchors || {}).length < 3).map(r => r.name),
  }));
  const commonGrid = grids.every(g => g.steps.join() === grids[0].steps.join());

  // le triage : par où commencer — les divergences d'abord, puis ce que la régénération bougerait
  const toCore = {};
  for (const a of audits) {
    const core = a.data.meta.coreMethod, per = {};
    for (const x of a.data.anchorMap) { const pm = x.perMethod[core]; if (pm && pm.hex) (per[x.ramp] = per[x.ramp] || []).push(pm.deltaE); }
    toCore[a.name] = Object.fromEntries(Object.entries(per).map(([k, v]) => [k, round(mean(v))]));
  }
  const triage = families.map(f => ({
    name: f.name, status: f.status, coverage: f.sources.length + '/' + names.length, steps: f.steps, divergent: f.divergent, meanDE: f.meanDE,
    regenDE: round(Math.max(...f.sources.map(s => toCore[s]?.[f.name] ?? 0))),
  })).sort((x, y) => (y.divergent - x.divergent) || ((y.meanDE ?? -1) - (x.meanDE ?? -1)) || (y.regenDE - x.regenDE));

  const count = st => families.filter(f => f.status === st).length;
  return { sources: names, families, totals: { aligned: count('aligned'), shared: count('shared'), divergent: count('divergent'), exclusive: count('exclusive') },
    sameNameDifferent, renames, grids, commonGrid, triage };
}

/**
 * Deux versions d'une même palette (avant, après) : les chemins perdus — ce qu'un code qui
 * s'appuyait sur l'ancienne version ne trouvera plus —, les ajouts, les valeurs qui changent,
 * et la dette d'alias de chaque côté.
 */
function diffVersions(before, after) {
  const lost = [], added = [], changed = [];
  let same = 0;
  for (const [p, v] of before.paths) {
    if (!after.paths.has(p)) { lost.push({ path: p, value: v }); continue; }
    const w = after.paths.get(p), hv = normHex(v)?.hex, hw = normHex(w)?.hex;
    if (hv && hw) {
      const de = deltaE2000Hex(hv, hw);
      if (de >= 0.5) changed.push({ path: p, from: hv, to: hw, deltaE: round(de) }); else same++;
    } else if (v !== w) changed.push({ path: p, from: v, to: w, deltaE: null });
    else same++;
  }
  for (const [p, v] of after.paths) if (!before.paths.has(p)) added.push({ path: p, value: v });
  return { before: before.name, after: after.name, lost, added, changed, same, aliases: { before: before.aliases.length, after: after.aliases.length } };
}

// ---------------------------------------------------------------- la décision

/**
 * Ce qu'un décideur a besoin de lire : garder ou régénérer, avec quelle méthode, la méthode de
 * repli, ce que la régénération bougerait famille par famille (même ΔE que la migration), et
 * ce qui ne dépend pas de la méthode.
 *
 * Bandes d'impact (ΔE2000 moyen d'une famille) : sous 7 un lifting quasi invisible, de 7 à 15
 * un changement perceptible, au-delà un changement visible, à présenter avant de basculer.
 */
function decision(audit) {
  const data = audit.data, core = data.meta.coreMethod;
  const ex = data.metrics.existing || {}, co = data.metrics[core] || {};
  const rows = audit.methods;
  const chosen = rows.find(r => r.method === core) || null;
  const fallback = rows.filter(r => r.holds && r.method !== core).sort((a, b) => a.deltaE - b.deltaE)[0] || null;
  const per = {};
  for (const a of data.anchorMap) { const pm = a.perMethod[core]; if (pm && pm.hex) (per[a.ramp] = per[a.ramp] || []).push(pm.deltaE); }
  const impact = Object.entries(per).map(([ramp, ds]) => ({ ramp, label: data.ramps.find(r => r.name === ramp)?.label || ramp, meanDE: round(mean(ds)) }))
    .sort((x, y) => x.meanDE - y.meanDE);
  const bands = {
    invisible: impact.filter(i => i.meanDE < 7),
    perceptible: impact.filter(i => i.meanDE >= 7 && i.meanDE < 15),
    visible: impact.filter(i => i.meanDE >= 15),
  };
  const before = { crossings: ex.interchangeability?.light?.crossingPairs ?? null, violations: ex.violationCount ?? null };
  const after = { crossings: co.interchangeability?.light?.crossingPairs ?? null, violations: co.violationCount ?? null };
  // garder l'existant se défend s'il ne franchit déjà aucun seuil
  const keep = before.crossings === 0;
  return { core, label: data.methods[core]?.label || core, keep, chosen, fallback, before, after, impact, bands,
    findings: audit.findings.length, structural: audit.findings.filter(f => ['far', 'pair', 'crowd'].includes(f.type)).length };
}

// ---------------------------------------------------------------- en mots

const T = lang => (fr, en) => (lang === 'en' ? en : fr);
const n = (x, lang, d = 1) => (x === null || x === undefined ? '—' : (Math.round(x * 10 ** d) / 10 ** d).toLocaleString(lang === 'en' ? 'en-US' : 'fr-FR'));

/** La distinguabilité en une phrase : sous 5 (OKLab × 100), deux aplats se confondent. */
function cvdLine(c, lang = 'fr') {
  const t = T(lang), V = { normal: t('vision normale', 'normal vision'), protan: t('protanopie', 'protanopia'), deutan: t('deutéranopie', 'deuteranopia'), tritan: t('tritanopie', 'tritanopia') };
  return t('Distinguabilité au cran d\'ancrage (OKLab × 100, sous 5 deux aplats se confondent) : ', 'Distinguishability at the anchor step (OKLab × 100, under 5 two fills merge): ')
    + Object.entries(c).map(([v, x]) => `${V[v]} ${n(x.min, lang)}${x.pair ? ' (' + x.pair.join(' ↔ ') + ')' : ''}`).join(' · ') + '.';
}

/** Le rapport d'audit en Markdown : une source ou plusieurs, et le diff si on compare deux versions. */
function auditMarkdown(result, { lang = 'fr' } = {}) {
  const t = T(lang), L = [];
  const { audits, cross, diff, dark } = result;
  L.push(`# ${t('Audit des couleurs', 'Colour audit')}`, '');
  L.push(`## ${t('À lire avant les chiffres', 'Read before the numbers')}`, '');
  for (const a of audits) {
    const dropped = a.dropped.length ? t(`, ${a.dropped.length} écartée(s) : `, `, ${a.dropped.length} left out: `) + Object.entries(a.dropped.reduce((m, d) => ((m[d.why] = (m[d.why] || 0) + 1), m), {})).map(([k, v]) => `${v} ${k}`).join(', ') : '';
    L.push(`- **${a.name}**${a.origin ? ' — ' + a.origin : ''}${a.date ? ' (' + a.date + ')' : ''} : ${a.read ?? '—'} ${t('couleurs lues', 'colours read')}${a.seen ? t(' sur ', ' of ') + a.seen : ''}${dropped}, ${a.rampCount} ${t('nuanciers', 'ramps')}.`);
  }
  for (const a of audits) {
    L.push('', `## ${a.name}`, '');
    const r = a.resemblance;
    if (r.closest) L.push(t(`Méthode la plus proche : **${r.closest.label}** (écart moyen ΔE ${n(r.closest.meanDE, lang)}).`, `Closest method: **${r.closest.label}** (mean gap ΔE ${n(r.closest.meanDE, lang)}).`)
      + (!r.hsl.length ? '' : r.hslLike * 2 >= r.hsl.length
        ? t(` ${r.hslLike} nuancier(s) sur ${r.hsl.length} gardent teinte et saturation HSL constantes : la palette a été faite en ne faisant varier que la clarté HSL.`, ` ${r.hslLike} of ${r.hsl.length} ramp(s) keep HSL hue and saturation constant: the palette was made by varying HSL lightness only.`)
        : t(` Ce n'est pas une palette HSL : ${r.hslLike} nuancier(s) sur ${r.hsl.length} seulement gardent teinte et saturation constantes.`, ` Not an HSL palette: only ${r.hslLike} of ${r.hsl.length} ramp(s) keep hue and saturation constant.`)), '');
    if (a.crossings !== null) L.push(t(`Franchissements de seuil à cran égal : **${a.crossings}** (une règle écrite une fois pour toutes les teintes tient à zéro).`, `Threshold crossings at equal step: **${a.crossings}** (a rule written once for every hue holds at zero).`), '');
    if (a.checks) L.push(...a.checks.map(c => `- ${c.pass ? '✓' : '✗'} ${c.label} — ${c.detail}`), '');
    if (a.cvd && a.cvd.normal.min !== null) L.push(cvdLine(a.cvd, lang), '');
    if (a.ladder && a.ladder.monotone) L.push(t(`Barreau médian (la médiane des luminances fournies, cran par cran) : à ${n(a.ladder.maxGap, lang, 2)} shade au plus du barreau par défaut.`, `Median ladder (the median of the provided luminances, step by step): at most ${n(a.ladder.maxGap, lang, 2)} shade from the default ladder.`), '');
    if (a.pairs) L.push(pairsMarkdown(a.pairs, { lang }));
    if (a.figma) L.push(figmaMarkdown(a.figma, { lang }));
    if (!a.findings.length) L.push(t('Aucun constat.', 'No finding.'));
    a.findings.forEach((f, i) => L.push(`${i + 1}. **${f.kind}** — ${f.title} ${f.text}`));
  }
  if (cross) {
    L.push('', `## ${t('Les sources face à face', 'Sources side by side')}`, '');
    L.push(t(`${cross.totals.aligned} famille(s) alignées, ${cross.totals.divergent} divergentes, ${cross.totals.shared} partagées par une partie des sources, ${cross.totals.exclusive} exclusives.`,
      `${cross.totals.aligned} family(ies) aligned, ${cross.totals.divergent} divergent, ${cross.totals.shared} shared by some sources, ${cross.totals.exclusive} exclusive.`), '');
    if (cross.sameNameDifferent.length) L.push(`**${t('Même nom, couleur différente', 'Same name, different colour')}** : ` + cross.sameNameDifferent.map(s => `${s.name} (ΔE ${n(s.meanDE, lang)})`).join(', '), '');
    if (cross.renames.length) L.push(`**${t('Sans doute la même famille sous deux noms', 'Probably the same family under two names')}** : ` + cross.renames.map(r => `${r.a.source}·${r.a.family} ≈ ${r.b.source}·${r.b.family} (ΔE ${n(r.meanDE, lang)})`).join(', '), '');
    if (!cross.commonGrid) L.push(`**${t('Grilles de crans différentes', 'Different step grids')}** : ` + cross.grids.map(g => `${g.source} [${g.steps.join(', ')}]`).join(' ; '), '');
    L.push(`### ${t('Triage', 'Triage')}`, '', `| ${t('Famille', 'Family')} | ${t('Statut', 'Status')} | ${t('Couverture', 'Coverage')} | ${t('Crans', 'Steps')} | ${t('Divergents', 'Divergent')} | ΔE ${t('entre sources', 'between sources')} | ΔE ${t('si régénérée', 'if regenerated')} |`, '|---|---|---|---|---|---|---|');
    for (const r of cross.triage) L.push(`| ${r.name} | ${r.status} | ${r.coverage} | ${r.steps} | ${r.divergent} | ${n(r.meanDE, lang)} | ${n(r.regenDE, lang)} |`);
  }
  for (const d of dark || []) {
    L.push('', `## ${t('Mode sombre déclaré', 'Declared dark mode')} : ${d.of} (${t('fond', 'background')} ${d.background})`, '');
    L.push(t(`${d.pinned} valeur(s) sombres relues sur la palette claire.`, `${d.pinned} dark value(s) read onto the light palette.`) + (d.note ? ' ' + d.note + '.' : ''), '');
    L.push(...d.checks.map(c => `- ${c.info ? '·' : c.pass ? '✓' : '✗'} ${c.label} — ${c.detail}`));
  }
  if (diff) {
    L.push('', `## ${t('Deux versions', 'Two versions')} : ${diff.before} → ${diff.after}`, '');
    L.push(t(`${diff.lost.length} chemin(s) perdu(s), ${diff.added.length} ajouté(s), ${diff.changed.length} valeur(s) changée(s), ${diff.same} inchangé(s). Alias : ${diff.aliases.before} → ${diff.aliases.after}.`,
      `${diff.lost.length} path(s) lost, ${diff.added.length} added, ${diff.changed.length} value(s) changed, ${diff.same} unchanged. Aliases: ${diff.aliases.before} → ${diff.aliases.after}.`));
    if (diff.lost.length) L.push('', `**${t('Perdus', 'Lost')}** : ` + diff.lost.slice(0, 40).map(x => '`' + x.path + '`').join(', ') + (diff.lost.length > 40 ? ' …' : ''));
    if (diff.changed.length) L.push('', `**${t('Changés', 'Changed')}** : ` + diff.changed.slice(0, 40).map(x => '`' + x.path + '` ' + (x.deltaE === null ? '' : 'ΔE ' + n(x.deltaE, lang))).join(', ') + (diff.changed.length > 40 ? ' …' : ''));
  }
  return L.join('\n') + '\n';
}

/** La décision pour une spec qu'on recrée à partir d'une palette (Créer, depuis l'existant). */
function decisionFor(data, ramps, { lang = 'fr', accepted = [] } = {}) {
  const findings = diagnose(data, ramps, { accepted }).map(f => ({ ...f, ...describe(f, data, lang) }));
  return decision({ data, findings, methods: compareMethods(data, { lang }).map(({ fails, ...r }) => ({ ...r, fails: fails.length })) });
}

/** La page de décision en Markdown : se lit en trois minutes. */
function decisionMarkdown(d, { lang = 'fr', brand = '' } = {}) {
  const t = T(lang);
  const band = (k, title, text) => (d.bands[k].length ? [`### ${title} — ${d.bands[k].length}`, text, d.bands[k].map(i => `${i.label} ${n(i.meanDE, lang)}`).join(' · '), ''] : []);
  const L = [`# ${brand ? brand + ' — ' : ''}${t('garder ou régénérer ?', 'keep or regenerate?')}`, '',
    `## ${t('Verdict', 'Verdict')}`, '',
    d.keep
      ? t(`La palette actuelle ne franchit aucun seuil à cran égal : la garder se défend. Régénérer avec ${d.label} apporterait la règle écrite dans le nom.`,
        `The current palette crosses no threshold at equal step: keeping it is defensible. Regenerating with ${d.label} would bring the rule written in the name.`)
      : t(`Régénérer avec **${d.label}** : ${d.before.crossings ?? '—'} franchissement(s) de seuil aujourd'hui, ${d.after.crossings ?? '—'} après.`,
        `Regenerate with **${d.label}**: ${d.before.crossings ?? '—'} threshold crossing(s) today, ${d.after.crossings ?? '—'} after.`),
    d.fallback ? t(`Méthode de repli : ${d.fallback.label} (tient aussi le contrat, écart moyen ΔE ${n(d.fallback.deltaE, lang)}).`, `Fallback method: ${d.fallback.label} (also holds the contract, mean gap ΔE ${n(d.fallback.deltaE, lang)}).`)
      : t('Aucune autre méthode ne tient le contrat : pas de repli sans renoncer à la règle.', 'No other method holds the contract: no fallback without giving up the rule.'),
    '', `## ${t('Ce que ça bouge, famille par famille', 'What it moves, family by family')}`, '',
    ...band('invisible', t('Lifting quasi invisible', 'Near-invisible lift'), t('ΔE moyen sous 7 : bascule sans risque pour la perception de la marque.', 'Mean ΔE under 7: switch with no risk to brand perception.')),
    ...band('perceptible', t('Changement perceptible', 'Noticeable change'), t('ΔE de 7 à 15 : visible à l\'œil averti, le prix normal de la garantie.', 'ΔE 7 to 15: visible to a trained eye, the normal price of the guarantee.')),
    ...band('visible', t('Changement visible', 'Visible change'), t('ΔE au-delà de 15 : à montrer explicitement avant de basculer, pas à traiter en catimini.', 'ΔE above 15: show it explicitly before switching, never slip it in.')),
    `## ${t('Ce qui ne dépend pas de la méthode', 'What does not depend on the method')}`, '',
    t(`${d.findings} constat(s) au diagnostic, dont ${d.structural} de structure (couleurs hors famille, familles en doublon, doublons de rang) : ils restent à trancher quelle que soit la méthode.`,
      `${d.findings} finding(s), ${d.structural} of them structural (colours outside their family, duplicate families, rank collisions): they remain to be decided whatever the method.`),
    ''];
  return L.join('\n');
}

// ---------------------------------------------------------------- vérifier des fichiers livrés

/**
 * Le contrat vérifié sur des couleurs livrées, pas sur la sortie du moteur : ce qu'un fichier
 * de tokens promet vraiment une fois retouché, exporté, recopié. Trois garanties :
 * - la monotonie (la luminance décroît avec le numéro du cran en clair, croît en sombre) ;
 * - les seuils au même cran : à chaque cran, toutes les familles passent ou échouent ensemble
 *   les seuils 3, 4,5 et 7 sur le fond ;
 * - la règle du nom : le plus petit écart de rangs à partir duquel toutes les paires, toutes
 *   familles confondues, tiennent 3, 4,5 et 7.
 * Le contraste est recalculé ici, indépendamment du moteur qui a produit les couleurs.
 */
const lum = hex => {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
};
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function verifyRamps(ramps, { mode = 'light', background = mode === 'dark' ? '#121212' : '#ffffff', lang = 'fr', expect = null } = {}) {
  const t = T(lang), out = [];
  const numeric = s => /^\d+$/.test(s);
  const fams = ramps.map(r => ({ name: r.name, kind: r.kind, steps: Object.keys(r.anchors || {}).filter(numeric).sort(byStep).map(s => [s, r.anchors[s]]) }))
    .filter(f => f.steps.length >= 2);

  // monotonie
  const bad = [];
  for (const f of fams) for (let i = 1; i < f.steps.length; i++) {
    const a = lum(f.steps[i - 1][1]), b = lum(f.steps[i][1]);
    if (mode === 'dark' ? b <= a : b >= a) bad.push(`${f.name}/${f.steps[i - 1][0]}→${f.steps[i][0]}`);
  }
  out.push({ key: 'mono', pass: !bad.length, label: t(`monotonie ${mode === 'dark' ? 'sombre' : 'clair'}`, `${mode} monotonicity`),
    detail: bad.length ? t(`ordre inversé : ${bad.slice(0, 6).join(', ')}`, `order inverted: ${bad.slice(0, 6).join(', ')}`) : t(`${fams.length} familles en ordre`, `${fams.length} families in order`) });

  // seuils au même cran
  const steps = [...new Set(fams.flatMap(f => f.steps.map(s => s[0])))].sort(byStep);
  const split = [];
  for (const st of steps) {
    // le neutre compris : remplacer une teinte par le neutre est la substitution la plus courante
    const vals = fams.map(f => [f.name, f.steps.find(s => s[0] === st)?.[1]]).filter(x => x[1]).map(([n, h]) => [n, ratio(h, background)]);
    if (vals.length < 2) continue;
    for (const th of [3, 4.5, 7]) {
      const pass = vals.filter(v => v[1] >= th), fail = vals.filter(v => v[1] < th);
      if (pass.length && fail.length) split.push(`${st} @${th}:1 (${fail.map(f => f[0]).slice(0, 3).join(', ')})`);
    }
  }
  out.push({ key: 'same', pass: !split.length, label: t('seuils au même cran', 'thresholds at the same step'),
    detail: split.length ? t(`une partie des familles seulement : ${split.slice(0, 5).join(' ; ')}`, `only some families: ${split.slice(0, 5).join('; ')}`) : t(`sur ${background}, chaque seuil tombe au même cran pour toutes les familles`, `on ${background}, each threshold falls at the same step for every family`) });

  // la règle du nom, paire par paire, rangs pris dans la grille commune : les crans portés par
  // la majorité des familles. Les crans hors grille (0, 25, 975… sur le seul neutre) n'ont pas de rang.
  const grid = steps.filter(s => fams.filter(f => f.steps.some(x => x[0] === s)).length * 2 > fams.length);
  const extra = steps.filter(s => !grid.includes(s));
  const rank = Object.fromEntries(grid.map((s, i) => [s, i]));
  const flat = fams.flatMap(f => f.steps.filter(([s]) => s in rank).map(([s, h]) => ({ r: rank[s], h })));
  const safe = th => {
    let worst = 0;
    for (let i = 0; i < flat.length; i++) for (let j = i + 1; j < flat.length; j++) {
      const d = Math.abs(flat[i].r - flat[j].r);
      if (d && ratio(flat[i].h, flat[j].h) < th) worst = Math.max(worst, d);
    }
    return worst + 1;
  };
  const [ui, aa, aaa] = [3, 4.5, 7].map(safe);
  // sans règle attendue (`expect`, en rangs pour l'AA), la règle se constate sans se juger
  out.push({ key: 'rule', pass: expect ? aa <= expect : true, info: !expect, label: t('règle du nom', 'naming rule'),

// ---------------------------------------------------------------- ce que chaque méthode donne

/** Les couleurs réelles d'une méthode, cran par cran, avec leur luminance et leur rang. */
function swatches(data, m) {
  const out = [];
  for (const r of data.ramps) {
    if (r.derived || !r.colors[m]) continue;
    r.colors[m].forEach((hex, i) => { if (hex && data.meta.isCore[i]) out.push({ ramp: r.label || r.name, step: data.meta.steps[i], i, rank: data.meta.rankOf[i], Y: relativeLuminance(hex) }); });
  }
  return out;
}

/**
 * Le plus petit écart de crans qui garantit un seuil pour **toutes** les paires, toutes teintes
 * confondues : la règle que chaque méthode offre, mesurée sur elle-même.
 */
function safeGaps(sw) {
  const minAt = [];
  for (let a = 0; a < sw.length; a++) for (let b = a + 1; b < sw.length; b++) {
    const g = Math.abs(sw[a].rank - sw[b].rank);
    if (!g) continue;
    const c = contrastY(sw[a].Y, sw[b].Y);
    if (minAt[g] === undefined || c < minAt[g]) minAt[g] = c;
  }
  const safe = th => { let d = null; for (let g = minAt.length - 1; g >= 1; g--) { if (minAt[g] === undefined) continue; if (minAt[g] < th) break; d = g; } return d; };
  return { 3: safe(3), 4.5: safe(4.5), 7: safe(7) };
}

/** Le contraste entre deux crans voisins, du plus serré au plus large. */
function intervals(sw) {
  let min = null, max = null;
  for (let k = 1; k < sw.length; k++) {
    const a = sw[k - 1], b = sw[k];
    if (a.ramp !== b.ramp || b.rank - a.rank !== 1) continue;
    const c = contrastY(a.Y, b.Y);
    if (!min || c < min.ratio) min = { ratio: c, ramp: a.ramp, a: a.step, b: b.step };
    if (!max || c > max.ratio) max = { ratio: c, ramp: a.ramp, a: a.step, b: b.step };
  }
  return { min, max };
}

const ROWS = new WeakMap();
/** Une méthode, mesurée : ce qu'elle donne, sans jugement. */
function methodRow(data, m) {
  if (!ROWS.has(data)) ROWS.set(data, {});
  const cache = ROWS.get(data);
  if (cache[m]) return cache[m];
  const x = data.metrics[m], sw = swatches(data, m), iv = intervals(sw);
  return (cache[m] = {
    method: m, label: data.methods[m].label, family: familyOf(m), sparse: !!x.sparse,
    pairsAA: x.pairsAA, pairsAAA: x.pairsAAA, total: x.totalPairs,
    crossings: x.interchangeability?.light?.crossingPairs ?? null, spread: x.meanSpread,
    safe: safeGaps(sw), intervalMin: iv.min, intervalMax: iv.max,
    drift: x.drift ? x.drift.meanDE : null, kept: x.gamut ? x.gamut.meanKept : null,
  });
}

/** Les méthodes comparées. L'existant n'y entre que si des couleurs ont été fournies, au-delà d'une par teinte. */
function methodTable(data) {
  const supplied = (data.anchorMap || []).length > data.meta.rampCount;
  return data.methodOrder.filter(m => data.metrics[m] && !['tuned', 'anchored'].includes(m) && (m !== 'existing' || supplied)).map(m => methodRow(data, m));
}

/** Sur combien de teintes une paire tient son seuil, avec une méthode, et les couleurs en jeu. */
function pairScore(data, m, fg, bg, threshold) {
  const pick = (r, tok) => (tok === 'W' ? '#ffffff' : tok === 'B' ? '#000000' : r.colors[m][data.meta.steps.indexOf(tok)]);
  const cells = data.ramps.filter(r => !r.derived && r.colors[m]).map(r => {
    const a = pick(r, fg), b = pick(r, bg);
    return a && b ? { ramp: r.label || r.name, fg: a, bg: b, ratio: contrastY(relativeLuminance(a), relativeLuminance(b)) } : null;
  }).filter(Boolean);
  const rs = cells.map(c => c.ratio);
  return { cells, pass: rs.filter(x => x >= threshold).length, applicable: rs.length, min: rs.length ? Math.min(...rs) : null, max: rs.length ? Math.max(...rs) : null };
}
