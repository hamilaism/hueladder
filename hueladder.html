n', 'proposal') + '<\/span><code>' + s.hex + '<\/code><\/div>'\n    + (ref ? '<div class=\"row\"><span><span class=\"sq\" style=\"background:' + ref.hex + '\"><\/span>' + T('aujourd\\'hui', 'today') + '<\/span><code>' + ref.hex + '<\/code><\/div>'\n           + '<div class=\"row\"><span>' + T('écart perceptif', 'perceptual gap') + '<\/span><b style=\"color:' + (dE > 8 ? 'var(--bad)' : dE > 4 ? 'var(--warn)' : 'var(--ok)') + '\">ΔE ' + dE.toFixed(1) + '<\/b><\/div>'\n           : '<div style=\"color:var(--muted)\">' + T('aucune couleur à ce rang aujourd\\'hui', 'no colour at this rank today') + '<\/div>')\n    + '<hr>'\n    + '<div class=\"row\"><span>' + T('contraste sur noir', 'contrast on black') + '<\/span><b>' + fmt2(c.vsBlack) + ':1<\/b><\/div>'\n    + '<div class=\"row\"><span>' + T('contraste sur blanc', 'contrast on white') + '<\/span><b>' + fmt2(c.vsWhite) + ':1<\/b><\/div>'\n    + '<div style=\"color:var(--ok);font-size:11px\">' + T('verrouillés — ils ne bougent pas', 'locked — they do not move') + '<\/div>'\n    + '<hr>'\n    + '<div class=\"row\"><span>' + T('teinte', 'hue') + '<\/span><b>' + (s.hue ?? 0).toFixed(1) + '°<\/b><\/div>'\n    + '<div class=\"row\"><span>' + T('éclat', 'vividness') + '<\/span><b>' + Math.round((s.fraction ?? 1) * 100) + ' %<\/b><\/div>'\n    + (Math.abs(s.perceivedShift ?? 0) > 0.02\n        ? '<div class=\"warnline\">' + T('⚠ ce cran <b>paraît<\/b> plus ' + ((s.perceivedShift > 0) ? 'clair' : 'sombre') + ' que ses homologues d\\'autres nuanciers, malgré un contraste identique.', '⚠ this step <b>looks<\/b> ' + ((s.perceivedShift > 0) ? 'lighter' : 'darker') + ' than its peers in other ramps, despite identical contrast.') + '<\/div>' : '')\n    + '<hr>'\n    + '<div><input type=\"text\" id=\"hex\" value=\"' + s.hex + '\"><\/div>'\n    + '<div style=\"margin-top:7px;display:flex;gap:6px;flex-wrap:wrap\">'\n    + (pinned ? '<button id=\"unpin\">' + T('libérer', 'release') + '<\/button>' : '<button id=\"pin\">' + T('figer cette valeur', 'pin this value') + '<\/button>')\n    + (ref && !pinned ? '<button id=\"useref\">' + T('reprendre celle d\\'aujourd\\'hui', 'use today\\'s') + '<\/button>' : '')\n    + '<button id=\"rst\">' + T('réinitialiser', 'reset') + '<\/button><\/div>'\n    + (pinned ? '<div class=\"warnline\">' + T('Valeur figée : le contraste de ce cran n\\'est plus garanti.', 'Pinned value: this step\\'s contrast is no longer guaranteed.') + '<\/div>' : '')\n    + '<\/div>';\n\n  // --- barre d'écart de teinte, sur les déclinaisons uniquement ---\n  const bar = document.getElementById('offsetbar');\n  if (r.derived) {\n    bar.style.display = '';\n    const off = offsetOf(current);\n    const sl = document.getElementById('off-slider');\n    sl.value = off;\n    document.getElementById('off-val').textContent = (off > 0 ? '+' : '') + off + '°';\n    // ce que l'écart HSL vaut réellement en teinte perçue, et de quoi il se rapproche\n    const parent = rampOf(r.derivedFrom);\n    const perceived = Math.round(((hexToOklch(seedOf(current)).H - hexToOklch(parent.seed).H + 540) % 360 - 180) * 10) / 10;\n    const mine = hexToOklch(seedOf(current)).H;\n    let near = null;\n    for (const o of DATA.ramps) {\n      if (o.derived || o.name === r.derivedFrom) continue;\n      const dd = Math.abs(((mine - hexToOklch(o.seed).H + 540) % 360) - 180);\n      if (near === null || dd < near.d) near = { d: dd, label: o.label };\n    }\n    const dParent = Math.abs(perceived);\n    document.getElementById('off-hint').innerHTML =\n      'soit <b>' + (perceived > 0 ? '+' : '') + perceived + '°<\/b> de teinte perçue'\n      + (dParent < 12 ? ' <span style=\"color:var(--bad)\">— trop proche de ' + esc(parent.label) + '<\/span>' : '')\n      + (near && near.d < 12 ? ' <span style=\"color:var(--bad)\">— à ' + Math.round(near.d) + '° de ' + esc(near.label) + '<\/span>'\n         : near ? ' · voisin le plus proche : ' + esc(near.label) + ' à ' + Math.round(near.d) + '°' : '');\n    sl.oninput = () => {\n      tuningOf(current).hueOffset = +sl.value;\n      persist(current); renderAll();\n    };\n    document.getElementById('off-reset').onclick = () => {\n      tuningOf(current).hueOffset = null; persist(current); renderAll();\n    };\n  } else bar.style.display = 'none';\n\n  const el = id => document.getElementById(id);\n  el('hex').onchange = () => {\n    const v = el('hex').value.trim().replace(/^#?/, '#').toLowerCase();\n    if (/^#[0-9a-f]{6}$/.test(v)) { t.pins[selected] = v; persist(current); }\n    renderAll();\n  };\n  if (el('pin')) el('pin').onclick = () => { t.pins[selected] = s.hex; persist(current); renderAll(); };\n  if (el('unpin')) el('unpin').onclick = () => { delete t.pins[selected]; persist(current); renderAll(); };\n  if (el('useref')) el('useref').onclick = () => { t.pins[selected] = ref.hex; persist(current); renderAll(); };\n  el('rst').onclick = () => {\n    t.hueShift[selected] = 0; t.chromaFraction[selected] = null; delete t.pins[selected];\n    persist(current); renderAll();\n  };\n}\n\n// ---------- contrôle ----------\nfunction renderVerify() {\n  const tuned = computed(), v = verifyTuning(tuned);\n  const lock = document.getElementById('lock');\n  lock.className = 'pill' + (v.pinned.length ? ' broken' : '');\n  lock.textContent = v.pinned.length\n    ? '⚠ ' + v.pinned.length + T(' valeur' + (v.pinned.length > 1 ? 's figées' : ' figée'), ' pinned value' + (v.pinned.length > 1 ? 's' : ''))\n    : T('🔒 contraste verrouillé', '🔒 contrast locked');\n\n  document.getElementById('ctrl-why').innerHTML = v.pinned.length\n    ? '<b style=\"color:var(--bad)\">' + v.pinned.length + T(' cran' + (v.pinned.length > 1 ? 's ont' : ' a') + ' une valeur figée<\/b> : leur contraste est celui de la couleur, plus celui du barreau. ', ' step' + (v.pinned.length > 1 ? 's have' : ' has') + ' a pinned value<\/b>: their contrast is the colour\\'s, no longer the ladder\\'s. ')\n      + v.pinned.map(p => '<code>' + STEPS[p.index] + '<\/code> ' + fmt2(p.vsBlack) + T(':1 au lieu de ', ':1 instead of ') + fmt2(p.expectedVsBlack) + ':1').join(' · ')\n    : T('Tous les contrastes tiennent leur cible à <b>', 'Every contrast holds its target within <b>') + (v.maxRelativeDeviation * 100).toFixed(2) + T(' %<\/b> près. Ce résidu est celui de la grille hex — aucune couleur sRGB ne ferait mieux. Rien à corriger.', '%<\/b>. This residue comes from the hex grid — no sRGB colour would do better. Nothing to fix.');\n\n  let h = '<table><tr><th>' + T('Cran', 'Step') + '<\/th><th>' + T('Proposition<\/th><th>vs noir<\/th><th>vs blanc<\/th><th>cible<\/th><th>écart<\/th><th>clarté perçue', 'Proposal<\/th><th>vs black<\/th><th>vs white<\/th><th>target<\/th><th>gap<\/th><th>perceived lightness') + '<\/th><\/tr>';\n  tuned.forEach((t, i) => {\n    if (!t) return;\n    const got = luminanceToContrasts(t.y), want = luminanceToContrasts(t.targetY);\n    const rel = Math.max(Math.abs(got.vsBlack - want.vsBlack) / want.vsBlack, Math.abs(got.vsWhite - want.vsWhite) / want.vsWhite);\n    h += '<tr><td>' + STEPS[i] + (t.pinned ? ' 📌' : '') + '<\/td>'\n      + '<td><span class=\"sq\" style=\"background:' + t.hex + '\"><\/span><code>' + t.hex + '<\/code><\/td>'\n      + '<td class=\"num\">' + fmt2(got.vsBlack) + '<\/td><td class=\"num\">' + fmt2(got.vsWhite) + '<\/td>'\n      + '<td class=\"num\">' + fmt2(want.vsBlack) + ' / ' + fmt2(want.vsWhite) + '<\/td>'\n      + '<td class=\"num\" style=\"color:' + (t.pinned ? 'var(--bad)' : rel > 0.01 ? 'var(--warn)' : 'var(--ok)') + '\">' + (rel * 100).toFixed(2) + ' %<\/td>'\n      + '<td class=\"num\">' + ((t.perceivedShift ?? 0) >= 0 ? '+' : '') + (t.perceivedShift ?? 0).toFixed(3) + '<\/td><\/tr>';\n  });\n  document.getElementById('verify').innerHTML = h + '<\/table>';\n}\n\n// ---------- le système complet ----------\nlet sysSort = (() => { try { return localStorage.getItem('sort-' + DATA.brand) || 'spec'; } catch (e) { return 'spec'; } })();\n// Masquer une rampe est un outil de comparaison à part entière : le neutre, plus long et\n// visuellement dominant, écrase la lecture des teintes dès qu'on veut les comparer entre elles.\nconst hidden = new Set((() => {\n  try { return JSON.parse(localStorage.getItem('hide-' + DATA.brand)) || []; } catch (e) { return []; }\n})());\nconst persistHidden = () => { try { localStorage.setItem('hide-' + DATA.brand, JSON.stringify([...hidden])); } catch (e) {} };\n\n/** L'ordre d'affichage de la palette complète. */\nfunction sortedRamps() {\n  const list = DATA.ramps.slice();\n  if (sysSort === 'name') {\n    return list.sort((a, b) => a.label.localeCompare(b.label, 'fr'));\n  }\n  if (sysSort === 'hue') {\n    // les quasi-gris n'ont pas de teinte exploitable : ils vont à la fin\n    const key = r => {\n      const c = hexToOklch(seedOf(r.name));\n      return c.C < 0.04 ? 1e6 + c.L : c.H;\n    };\n    return list.sort((a, b) => key(a) - key(b));\n  }\n  return list;   // ordre de la spécification, déclinaisons contre leur parent\n}\n\nfunction renderSystem() {\n  const det = document.getElementById('sys-details');\n  if (!det.open) { document.getElementById('system').innerHTML = ''; return; }\n  const shown = sortedRamps().filter(r => !hidden.has(r.name));\n  const scales = new Map(shown.map(r => [r.name, finalScale(r.name)]));\n\n  // Une colonne que plus aucune rampe visible n'utilise n'a pas lieu d'occuper la grille :\n  // masquer le neutre doit resserrer l'affichage sur les crans réellement comparés.\n  const usedCols = STEPS.map((_, i) => shown.some(r => scales.get(r.name)[i]));\n  const idx = usedCols.map((u, i) => (u ? i : -1)).filter(i => i >= 0);\n\n  const cols = 'grid-template-columns:120px repeat(' + Math.max(1, idx.length) + ',1fr)';\n  let h = '<div class=\"sys-row\" style=\"' + cols + '\"><div><\/div>'\n    + idx.map(i => '<div class=\"sys-head\">' + STEPS[i] + '<\/div>').join('') + '<\/div>';\n  for (const r of shown) {\n    const scale = scales.get(r.name);\n    h += '<div class=\"sys-row' + (r.name === current ? ' cur' : '') + '\" style=\"' + cols + '\">'\n      + '<div class=\"sys-lab\" title=\"' + esc(r.label) + '\">'\n        + (r.derived && sysSort === 'spec' ? '↳ ' : '') + esc(r.label) + '<\/div>'\n      + idx.map(i => scale[i]\n          ? '<div class=\"sys-cell\" data-r=\"' + r.name + '\" data-i=\"' + i + '\" style=\"background:' + scale[i]\n            + '\" title=\"' + esc(r.label) + ' ' + STEPS[i] + ' — ' + scale[i] + '\"><\/div>'\n          : '<div class=\"sys-void\"><\/div>').join('')\n      + '<\/div>';\n  }\n  if (!shown.length) h = '<p class=\"why\">' + T('Tout est masqué.', 'Everything is hidden.') + '<\/p>';\n  document.getElementById('system').innerHTML = h;\n\n  // les bascules\n  document.getElementById('sys-toggles').innerHTML = sortedRamps().map(r =>\n    '<span class=\"tog' + (hidden.has(r.name) ? ' off' : '') + '\" data-t=\"' + r.name + '\">'\n    + '<span class=\"dot2\" style=\"background:' + seedOf(r.name) + '\"><\/span>'\n    + (r.derived ? '↳ ' : '') + esc(r.label) + '<\/span>').join('');\n  document.querySelectorAll('#sys-toggles .tog').forEach(el => {\n    el.onclick = () => {\n      const nm = el.dataset.t;\n      if (hidden.has(nm)) hidden.delete(nm); else hidden.add(nm);\n      persistHidden(); renderSystem();\n    };\n  });\n  document.getElementById('sys-all').onclick = () => { hidden.clear(); persistHidden(); renderSystem(); };\n  document.getElementById('sys-real').onclick = () => {\n    hidden.clear();\n    DATA.ramps.filter(r => r.derived).forEach(r => hidden.add(r.name));\n    persistHidden(); renderSystem();\n  };\n  document.querySelectorAll('#system .sys-cell').forEach(c => {\n    c.onclick = () => { current = c.dataset.r; selected = +c.dataset.i; sel.value = current; renderAll(); };\n  });\n\n  const ss = document.getElementById('sys-sort');\n  ss.value = sysSort;\n  ss.onchange = () => {\n    sysSort = ss.value;\n    try { localStorage.setItem('sort-' + DATA.brand, sysSort); } catch (e) {}\n    renderSystem();\n  };\n  const nHid = hidden.size;\n  document.getElementById('sys-hint').textContent =\n    (sysSort === 'hue' ? T('du rouge au violet — les quasi-gris en fin de liste', 'red to violet — near-greys last')\n     : sysSort === 'name' ? T('alphabétique', 'alphabetical') : T('chaque déclinaison sous son parent', 'each variant under its parent'))\n    + (nHid ? '  ·  ' + nHid + T(' masqué' + (nHid > 1 ? 's' : ''), ' hidden') : '');\n}\n\n// ---------- aperçu ----------\nfunction renderPreview() {\n  const t = computed();\n  const present = t.map((x, i) => (x ? i : -1)).filter(i => i >= 0);\n  // on raisonne en position parmi les crans présents, pour rester juste quelle que soit la rampe\n  const at = f => t[present[Math.max(0, Math.min(present.length - 1, Math.round(f * (present.length - 1))))]].hex;\n  const hex = i => at(i / (N - 1));\n  const on = h => (relativeLuminance(h) < 0.179 ? '#fff' : '#111');\n  document.getElementById('preview').innerHTML =\n    '<div class=\"prev\" style=\"background:' + hex(0) + ';color:' + hex(N - 2) + '\">'\n      + '<div style=\"font-weight:600;margin-bottom:4px\">' + T('Surface teintée', 'Tinted surface') + '<\/div>'\n      + '<div style=\"font-size:12px\">' + T('Texte courant sur le cran le plus clair.', 'Body text on the lightest step.') + '<\/div>'\n      + '<div style=\"margin-top:9px\"><span class=\"btn\" style=\"background:' + hex(5) + ';color:' + on(hex(5)) + '\">' + T('Bouton', 'Button') + '<\/span><\/div><\/div>'\n    + '<div class=\"prev\" style=\"background:#fff;color:#111;border:1px solid var(--line)\">'\n      + '<span class=\"btn\" style=\"background:' + hex(5) + ';color:' + on(hex(5)) + '\">' + T('Action', 'Action') + '<\/span> '\n      + '<span class=\"chip\" style=\"border-color:' + hex(3) + ';color:' + hex(N - 2) + '\">' + T('badge', 'badge') + '<\/span>'\n      + '<div style=\"margin-top:8px;font-size:12px;color:' + hex(N - 2) + '\">' + T('Texte sur fond blanc', 'Text on white') + '<\/div>'\n      + '<div style=\"margin-top:6px;height:2px;background:' + hex(4) + '\"><\/div><\/div>'\n    + '<div class=\"prev\" style=\"background:' + hex(N - 1) + ';color:' + hex(1) + '\">'\n      + '<div style=\"font-weight:600;margin-bottom:4px\">' + T('Surface foncée', 'Dark surface') + '<\/div>'\n      + '<div style=\"font-size:12px\">' + T('Texte clair sur le cran le plus foncé de la rampe claire.', 'Light text on the darkest step of the light ramp.') + '<\/div>'\n      + '<div style=\"margin-top:9px\"><span class=\"btn\" style=\"background:' + hex(2) + ';color:' + on(hex(2)) + '\">' + T('Bouton', 'Button') + '<\/span><\/div><\/div>';\n}\n\n// ---------- export ----------\n\n/** Ce qui compose le système livré : les nuanciers réels, plus les déclinaisons adoptées. */\nfunction deliveredRamps() {\n  return DATA.ramps.filter(r => !r.derived || adoptedSet.has(r.name));\n}\n\n/** Le nom sous lequel une déclinaison adoptée entre dans le système. */\nfunction deliveredName(r) {\n  if (!r.derived) return r.name;\n  return r.derivedFrom + (offsetOf(r.name) > 0 ? '-plus' : '-moins');\n}\n\nfunction exportPayload(fmt) {\n  const ramps = deliveredRamps();\n\n  if (fmt === 'palette') {\n    // Le résultat, sans détour : toutes les couleurs telles qu'elles seront utilisées.\n    const out = { marque: DATA.brand, steps: STEPS, base: DATA.baseMethod, nuanciers: {} };\n    for (const r of ramps) {\n      const scale = finalScale(r.name);\n      out.nuanciers[deliveredName(r)] = Object.fromEntries(\n        STEPS.map((s, i) => [s, scale[i]]).filter(([, v]) => v));\n    }\n    return out;\n  }\n\n  if (fmt === 'dtcg') {\n    const color = {};\n    for (const r of ramps) {\n      const scale = finalScale(r.name);\n      const g = { $description: r.label };\n      STEPS.forEach((s, i) => { if (scale[i]) g[s] = { $type: 'color', $value: scale[i] }; });\n      color[deliveredName(r)] = g;\n    }\n    return { core: { color } };\n  }\n\n  // format « spec » : de quoi faire régénérer exactement le même résultat par le build\n  const reglages = {}, nouveaux = [];\n  for (const r of DATA.ramps) {\n    const t = store[r.name];\n    if (!t) continue;\n    const touched = t.hueShift.some(v => v !== 0) || t.chromaFraction.some(v => v !== null) || Object.keys(t.pins).length;\n    const movedOffset = r.derived && t.hueOffset !== null && t.hueOffset !== undefined && t.hueOffset !== r.hueOffset;\n    if (!touched && !movedOffset && !adoptedSet.has(r.name)) continue;\n    const tuned = applyTuning(baseOf(r.name), r.ladder, t);\n    const scale = Object.fromEntries(STEPS.map((s, i) => [s, tuned[i] ? tuned[i].hex : null]).filter(([, v]) => v));\n    const from = { method: DATA.baseMethod, lockedY: true, pinned: Object.keys(t.pins).map(i => STEPS[i]) };\n    if (r.derived) {\n      if (!adoptedSet.has(r.name)) continue;\n      const parent = rampOf(r.derivedFrom);\n      nouveaux.push({\n        name: deliveredName(r), label: r.label, kind: r.kind || 'product',\n        note: 'Déclinaison HSL ' + (offsetOf(r.name) > 0 ? '+' : '−') + Math.abs(offsetOf(r.name))\n          + '° de « ' + parent.label + ' », adoptée comme couleur à part entière.',\n        anchors: { default: seedOf(r.name) }, tuned: scale, tunedFrom: from,\n      });\n    } else if (touched) {\n      reglages[r.name] = { tuned: scale, tunedFrom: from };\n    }\n  }\n  const p = {};\n  if (Object.keys(reglages).length) p.reglages = reglages;\n  if (nouveaux.length) p.nouveauxNuanciers = nouveaux;\n  return Object.keys(p).length ? p : { _: 'Aucun réglage manuel : le build reproduit déjà ce résultat tel quel.' };\n}\n\nfunction renderExport() {\n  const fmt = document.getElementById('export-fmt').value;\n  const payload = exportPayload(fmt);\n  const text = JSON.stringify(payload, null, 2);\n  document.getElementById('export-json').value = text;\n  document.getElementById('export-size').textContent =\n    Math.round(text.length / 1024 * 10) / 10 + ' Ko';\n\n  const ramps = deliveredRamps();\n  const nAdopted = ramps.filter(r => r.derived).length;\n  const nTuned = DATA.ramps.filter(r => {\n    const t = store[r.name];\n    return t && (t.hueShift.some(v => v !== 0) || t.chromaFraction.some(v => v !== null) || Object.keys(t.pins).length);\n  }).length;\n\n  document.getElementById('export-why').innerHTML =\n    '<b>' + ramps.length + ' nuanciers<\/b> — ' + (ramps.length - nAdopted) + ' réels'\n    + (nAdopted ? ' et ' + nAdopted + ' déclinaison' + (nAdopted > 1 ? 's adoptées' : ' adoptée') : '')\n    + (nTuned ? ', dont <b>' + nTuned + ' réglé' + (nTuned > 1 ? 's' : '') + ' à la main<\/b>' : ', aucun réglage manuel')\n    + '. Les déclinaisons non adoptées restent des hypothèses et ne sont pas livrées.';\n\n  document.getElementById('export-note').textContent =\n    fmt === 'palette' ? 'toutes les couleurs finales, prêtes à consommer'\n    : fmt === 'dtcg' ? 'à importer via figma_import_tokens (format dtcg)'\n    : 'pour que node build.mjs régénère exactement ce résultat';\n}\n\nfunction renderAll() {\n  const r = rampOf(current);\n  const ab = document.getElementById('btn-adopt');\n  ab.style.display = r.derived ? '' : 'none';\n  if (r.derived) {\n    const on = adoptedSet.has(current);\n    ab.textContent = on ? '✓ adoptée — retirer' : 'adopter cette couleur';\n    ab.className = on ? 'primary' : '';\n  }\n  renderCompare(); renderPad(); renderVerify(); renderSystem(); renderPreview(); renderExport();\n}\n\nconst sel = document.getElementById('ramp-select');\nsel.innerHTML = DATA.ramps.map(r =>\n  '<option value=\"' + r.name + '\">' + (r.derived ? '\\u00a0\\u00a0\\u21b3 ' : '') + esc(r.label) + '<\/option>').join('');\nsel.onchange = () => { current = sel.value; selected = DATA.seedIndex; renderAll(); };\ndocument.getElementById('btn-adopt').onclick = () => {\n  if (adoptedSet.has(current)) adoptedSet.delete(current); else adoptedSet.add(current);\n  persistAdopted(); renderAll();\n};\ndocument.getElementById('btn-reset').onclick = () => {\n  if (!confirm(T('Réinitialiser tous les réglages de ce nuancier ?', 'Reset all tuning of this ramp?'))) return;\n  store[current] = blank(); persist(current); renderAll();\n};\ndocument.getElementById('btn-export').onclick = () => {\n  renderExport();\n  document.getElementById('export-card').scrollIntoView({ behavior: 'smooth', block: 'start' });\n};\ndocument.getElementById('export-fmt').onchange = renderExport;\ndocument.getElementById('btn-dl').onclick = () => {\n  const fmt = document.getElementById('export-fmt').value;\n  const name = DATA.id + '-' + (fmt === 'dtcg' ? 'tokens' : fmt === 'spec' ? 'spec-patch' : 'palette') + '.json';\n  const blob = new Blob([document.getElementById('export-json').value], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = name; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\ndocument.getElementById('btn-copy').onclick = async () => {\n  const ta = document.getElementById('export-json');\n  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); }\n  const b = document.getElementById('btn-copy');\n  b.textContent = 'copié ✓'; setTimeout(() => (b.textContent = 'copier'), 1400);\n};\ndocument.addEventListener('keydown', e => {\n  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;\n  if (e.key === 'ArrowLeft' && selected > 0) { selected--; renderAll(); }\n  if (e.key === 'ArrowRight' && selected < N - 1) { selected++; renderAll(); }\n});\n\ndocument.getElementById('sys-details').addEventListener('toggle', renderSystem);\n\nrenderAll();\n<\/script>\n<\/body>\n<\/html>\n";
const REPORT_TPL = "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>__TITLE__<\/title>\n<style>\n  :root {\n    --bg: #f5f5f5; --fg: #1a1a1a; --card: #ffffff; --line: #e0e0e0; --muted: #6b6b6b;\n    --ok: #126812; --warn: #ad4e00; --bad: #a81f0b; --accent: #d81f06;\n  }\n  body.dark { --bg: #141414; --fg: #ececec; --card: #1f1f1f; --line: #3a3a3a; --muted: #9a9a9a; }\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }\n  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px; }\n  h1 { font-size: 22px; margin: 0 0 4px; }\n  h2 { font-size: 17px; margin: 36px 0 12px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }\n  h3 { font-size: 14px; margin: 18px 0 8px; }\n  .sub { color: var(--muted); margin: 0 0 16px; }\n  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }\n  .mtoggles { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }\n  .mtog { font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; }\n  .mtog input { vertical-align: -2px; }\n  .mtoggles button { font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }\n  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }\n  .card h3 { margin: 0 0 6px; }\n  .card p { margin: 0; color: var(--muted); font-size: 13px; }\n  .card.is-core { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }\n  .card .tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 4px; }\n  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }\n  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }\n  th { background: color-mix(in srgb, var(--card) 85%, var(--fg) 15%); font-weight: 600; }\n  td.num { font-variant-numeric: tabular-nums; }\n  .best { font-weight: 700; color: var(--ok); }\n  .worst { color: var(--bad); }\n  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }\n  .pill.aaa { background: #126812; color: #fff; } .pill.aa { background: #2d8f2d; color: #fff; }\n  .pill.ui { background: #e06806; color: #fff; } .pill.fail { background: #aaa; color: #fff; }\n  .kindpill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #fff; }\n  .kindpill.brand { background: #d81f06; } .kindpill.product { background: #444; }\n  .kindpill.system { background: #0067f0; } .kindpill.neutral { background: #6b6b6b; }\n  /* rampes */\n  .ramp { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }\n  .ramp-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }\n  .ramp-head b { font-size: 15px; }\n  .ramp-head .seed { font-size: 12px; color: var(--muted); }\n  .ramp-head button { margin-left: auto; }\n  .ramp-src { font-size: 11px; color: var(--muted); margin: 0 0 10px; }\n  .mrow { display: grid; grid-template-columns: 152px 1fr; gap: 8px; align-items: center; margin-bottom: 5px; }\n  .mrow.is-core { background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 6px; padding: 4px; margin: 3px -4px 7px; }\n  .mname { font-size: 12px; color: var(--muted); }\n  .mrow.is-core .mname { color: var(--accent); font-weight: 700; }\n  .sw-strip { display: grid; gap: 3px; }\n  .sw { position: relative; height: 56px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 5px; border: 1px solid rgba(0,0,0,.08); }\n  .sw .st { font-size: 10px; font-weight: 700; }\n  .sw .hx { font-size: 9px; opacity: .85; font-family: ui-monospace, monospace; }\n  .sw .marks { position: absolute; top: 4px; right: 5px; font-size: 8px; letter-spacing: 1px; }\n  .sw.sel-bg { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }\n  .sw.sel-fg { outline: 3px dashed var(--accent); outline-offset: 1px; z-index: 2; }\n  .sw.anchored-at { box-shadow: 0 0 0 2px var(--fg); z-index: 1; }\n  .sw-none { height: 56px; border-radius: 4px; border: 1px dashed var(--line); background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--line) 5px, var(--line) 6px); opacity: .55; }\n  .anchor-rail { display: grid; gap: 3px; margin-top: 2px; }\n  .anchor-rail span { font-size: 9px; font-weight: 700; color: var(--accent); text-align: center; min-height: 12px; }\n  /* déclinaisons de teinte : décalées et en retrait, pour qu'on ne les confonde jamais\n     avec une couleur réellement arbitrée par la marque */\n  .ramp.is-derived { margin-left: 28px; border-style: dashed; background: color-mix(in srgb, var(--card) 94%, var(--fg) 6%); }\n  .kindpill.derivedpill { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }\n  .hue-loss { color: var(--warn); }\n  .hue-map td { vertical-align: middle; }\n  .hue-cell { display: flex; align-items: center; gap: 7px; }\n  .hue-chip { width: 34px; height: 26px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); flex: none; }\n  .hue-cell.is-ref .hue-chip { box-shadow: 0 0 0 2px var(--fg); }\n  .hp-ruler { position: relative; height: 54px; margin: 6px 0 18px; }\n  .hp-ruler .bar { position: absolute; left: 0; right: 0; top: 20px; height: 10px; border-radius: 5px; opacity: .5;\n    background: linear-gradient(90deg, oklch(.7 .15 0), oklch(.7 .15 60), oklch(.7 .15 120), oklch(.7 .15 180), oklch(.7 .15 240), oklch(.7 .15 300), oklch(.7 .15 360)); }\n  .hp-ruler .pin { position: absolute; top: 13px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px rgba(0,0,0,.2); }\n  .hp-ruler .tick { position: absolute; top: 38px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }\n  .hp-band h3 { font-size: 14px; margin: 16px 0 6px; } .hp-band h3 span { font-weight: 400; font-size: 12px; color: var(--muted); }\n  .hp-scroll { overflow-x: auto; }\n  .hp-row { display: grid; grid-template-columns: 180px repeat(var(--n), minmax(34px, 1fr)); gap: 3px; align-items: center; margin-bottom: 3px; min-width: 560px; }\n  .hp-row .lbl { font-size: 13px; font-weight: 600; } .hp-row .lbl small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }\n  .hp-row .c { height: 34px; border-radius: 4px; border: 1px solid rgba(0,0,0,.08); }\n  .hp-row .c.none { background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--line) 5px, var(--line) 6px); opacity: .5; border-style: dashed; }\n  .hp-row .c.seed { outline: 2px solid var(--fg); outline-offset: 1px; }\n  .hp-row.head .c { height: auto; border: 0; font-size: 11px; color: var(--muted); text-align: center; }\n  .hp-switch button { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; cursor: pointer; }\n  .hp-switch button[aria-pressed=\"true\"] { background: var(--fg); color: var(--card); }\n  .hp-pair { display: inline-flex; gap: 2px; vertical-align: middle; } .hp-pair i { width: 12px; height: 18px; border-radius: 2px; display: inline-block; }\n  .matrices { display: none; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 10px; }\n  .matrices.open { display: grid; }\n  .mx { font-size: 10px; }\n  .mx table { font-size: 10px; }\n  .mx th, .mx td { padding: 2px 4px; text-align: center; border: 1px solid var(--line); }\n  .mx td.aaa { background: #12681233; } .mx td.aa { background: #2d8f2d22; }\n  .mx td.ui { background: #e0680622; } .mx td.no { color: var(--muted); }\n  /* testeur */\n  .tester { position: sticky; top: 42px; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr 400px; gap: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }\n  .spec-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 4px; }\n  .spec-sample { border-radius: 5px; padding: 5px 8px; border: 1px solid var(--line); min-height: 20px; display: flex; align-items: center; gap: 8px; }\n  .chip { display: inline-block; padding: 0 5px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-left: 3px; }\n  .chip.ok { background: #2d8f2d; color: #fff; } .chip.ko { background: #aaa; color: #fff; }\n  .ipt { border-radius: 4px; padding: 2px 8px; font-size: 12px; }\n  .apca-line { font-size: 11px; color: var(--muted); margin-top: 5px; border-top: 1px dashed var(--line); padding-top: 5px; }\n  .tester select, .ramp button, .tester button, .bgbtns button { font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }\n  .tester .col label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }\n  .verdict { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }\n  .ratio { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }\n  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }\n  .bgbtns { position: fixed; bottom: 16px; right: 16px; display: flex; gap: 6px; z-index: 30; }\n  .chart-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 6px; }\n  .chart { width: 100%; height: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }\n  .chart polyline:hover, .chart circle:hover { opacity: 1; stroke-width: 3; }\n  .note { background: color-mix(in srgb, var(--card) 92%, var(--accent) 8%); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: 13px; margin: 10px 0; }\n  details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; }\n  code { font-family: ui-monospace, monospace; font-size: 12px; background: color-mix(in srgb, var(--card) 80%, var(--fg) 20%); padding: 1px 5px; border-radius: 4px; }\n  .viol { font-size: 12px; font-family: ui-monospace, monospace; color: var(--muted); }\n  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid rgba(0,0,0,.18); }\n  td.score-best { font-weight: 700; color: var(--ok); } td.score-bad { color: var(--bad); font-weight: 700; }\n  .caveat { border-left: 4px solid var(--warn, #9a5200); padding: 8px 12px; background: rgba(154,82,0,.08); border-radius: 6px; }\n<\/style>\n<style id=\"mvis\"><\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <h1>__TITLE__<\/h1>\n  <p class=\"sub\" id=\"subtitle\"><\/p>\n  <div class=\"mtoggles\" id=\"mtoggles\"><\/div>\n\n  <h2 data-en=\"The methods compared\">Les méthodes comparées<\/h2>\n  <div class=\"cards\" id=\"method-cards\"><\/div>\n\n  <h2 data-en=\"Summary — accessibility performance\">Synthèse — performance a11y<\/h2>\n  <div id=\"summary\"><\/div>\n  <div class=\"note\" id=\"verdict-note\"><\/div>\n\n  <h2 data-en=\"Charts — reading the methods\">Visualisations — lire les méthodes<\/h2>\n  <p class=\"sub\" data-en=\"One panel per method, same scales for comparison. Each line/point is a ramp, drawn in its own anchor colour (dotted grey = neutral ramp). Hover to identify the ramp.\">Un panneau par méthode, échelles identiques pour comparer. Chaque ligne/point = un nuancier, tracé dans sa propre couleur d'ancrage (gris pointillé = nuancier neutre). Survole pour identifier le nuancier.<\/p>\n  <div id=\"charts\"><\/div>\n\n  <h2 data-en=\"Pair tester\">Testeur de paires<\/h2>\n  <p class=\"sub\" data-en=\"Pick a background and a text colour below, or click the ramp swatches (1<sup>st<\/sup> click = background, 2<sup>nd<\/sup> click = text).\">Sélectionne un fond et un texte ci-dessous, ou clique sur les swatches des nuanciers (1<sup>er<\/sup> clic = fond, 2<sup>e<\/sup> clic = texte).<\/p>\n  <div class=\"tester\" id=\"tester\"><\/div>\n\n  <h2 id=\"anchors-title\" data-en=\"The colours already chosen — where do they land?\">Les couleurs déjà choisies — où tombent-elles ?<\/h2>\n  <p class=\"sub\" id=\"anchors-sub\"><\/p>\n  <div id=\"anchors\"><\/div>\n\n  <h2 data-en=\"Conventional usages\">Usages conventionnels<\/h2>\n  <p class=\"sub\" data-en=\"Each row is a classic usage pattern (typical semantic roles in a design system), evaluated on every ramp with its own WCAG threshold. A cell = number of ramps where the pair passes. Hover a cell to see the failing ramps and their ratio.\">Chaque ligne est un pattern d'usage classique (rôles sémantiques typiques d'un DS), évalué sur tous les nuanciers avec son seuil WCAG propre. Une cellule = nombre de nuanciers où la paire passe. Survole une cellule pour voir les nuanciers en échec et leur ratio.<\/p>\n  <div id=\"usages\"><\/div>\n\n  <h2 id=\"hue-title\" data-en=\"Hue neighbourhood — what if we turned the wheel?\">Voisinage de teinte — et si on tournait la roue ?<\/h2>\n  <p class=\"sub\" id=\"hue-sub\"><\/p>\n  <div id=\"huemap\"><\/div>\n\n  <h2 data-en=\"Ramps — side by side\">Nuanciers — rendu côte à côte<\/h2>\n  <p class=\"sub\" data-en=\"Markers on each swatch: <b>W<\/b> = white text passes AA (≥ 4.5) on this colour · <b>B<\/b> = black text passes AA. The dark outline and the label under the ramp mark the rank where a starting colour lands. “matrices” button: step × step contrast.\">Marqueurs sur chaque swatch : <b>W<\/b> = texte blanc AA (≥ 4.5) sur cette couleur · <b>B<\/b> = texte noir AA. Le liseré sombre et l'étiquette sous la rampe repèrent le rang où tombe une couleur de départ. Bouton « matrices » : contrastes step × step.<\/p>\n  <div id=\"ramps\"><\/div>\n\n  <h2 data-en=\"Cross-hue interchangeability\">Interchangeabilité cross-teintes<\/h2>\n  <p class=\"sub\" data-en=\"The formal test first: across <b>all<\/b> pairs of chromatic ramps at equal rank, how many do not give the same answer to “does it pass 3 / 4.5 / 7”. It is the figure that tells whether one hue can be swapped for another at the same step without re-checking: a single crossing forces an exception to be documented for that hue. The contrast spread, on the other hand, is <b>never<\/b> zero: the hex grid is discrete, and the best achievable across 20 families is around 0.04 points. The next table gives the detail step by step.\">Le test formel d'abord : sur <b>toutes<\/b> les paires de nuanciers chromatiques à rang égal, combien ne donnent pas la même réponse à « est-ce que ça passe 3 / 4.5 / 7 ». C'est le chiffre qui dit si l'on peut échanger une teinte contre une autre au même cran sans revérifier : un seul franchissement oblige à documenter une exception pour cette teinte. L'écart de contraste, lui, ne vaut <b>jamais<\/b> zéro : la grille hex est discrète, le meilleur atteignable sur 20 familles est de l'ordre de 0,04 point. Le tableau suivant en donne le détail cran par cran.<\/p>\n  <div id=\"spread\"><\/div>\n\n  <h2 data-en=\"Appendix\">Annexe<\/h2>\n  <div id=\"annex\"><\/div>\n<\/div>\n\n<div class=\"bgbtns\">\n  <button data-en=\"☀️ Light background\" onclick=\"document.body.classList.remove('dark')\">☀️ Fond clair<\/button>\n  <button data-en=\"🌙 Dark background\" onclick=\"document.body.classList.add('dark')\">🌙 Fond sombre<\/button>\n<\/div>\n\n<script>\nconst DATA = /*DATA_INJECT*/{};\n\n// Langue du rapport : portée par les données (spec.lang), français par défaut.\nconst LANG = DATA.meta.lang === 'en' ? 'en' : 'fr';\nconst T = (fr, en) => (LANG === 'en' ? en : fr);\n// La règle dans l'unité de la nomenclature : des rangs, ou un écart de noms quand le nom encode le contraste.\nconst RG = k => (DATA.rules.grain ? T('Δ nom ≥ ', 'Δ name ≥ ') + k * DATA.rules.grain : T('Δrang ≥ ', 'Δrank ≥ ') + k);\nconst RN = k => (DATA.rules.grain ? String(k * DATA.rules.grain) : String(k));\ndocument.documentElement.lang = LANG;\n// le texte statique de la page porte sa version anglaise dans data-en\nif (LANG === 'en') document.querySelectorAll('[data-en]').forEach(el => { el.innerHTML = el.dataset.en; });\n\n/* APCA 0.0.98G-4g — code injecté depuis lib/apca.mjs (validé contre les vecteurs apca-w3),\n   pour que le testeur de paires calcule exactement la même chose que la génération. */\n/**\n * APCA 0.0.98G-4g — Accessible Perceptual Contrast Algorithm (WCAG 3 draft).\n *\n * Port of the `apca-w3` reference implementation (constants of the 0.0.98G-4g\n * lookup, \"G\" series, 4g exponents). Pure JS, no dependencies.\n *\n * The returned value is `Lc` (lightness contrast), signed:\n *   - positive  => dark text on a light background (BoW, \"black on white\")\n *   - negative  => light text on a dark background (WoB, \"white on black\")\n * The magnitude is what matters for readability thresholds; the sign only\n * carries the polarity, which APCA weights asymmetrically.\n *\n * Reference: https://github.com/Myndex/apca-w3 (SAPC/APCA, Andrew Somers)\n */\n\n/* ---------------------------------------------------------------------- *\n * 0.0.98G-4g constants\n * ---------------------------------------------------------------------- */\n\n// sRGB transfer curve + luminance coefficients (APCA uses a simple 2.4 power\n// curve, NOT the piecewise IEC 61966-2-1 curve used by WCAG 2).\nconst MAIN_TRC = 2.4;\nconst S_RCO = 0.2126729;\nconst S_GCO = 0.7151522;\nconst S_BCO = 0.0721750;\n\n// Power-curve exponents per polarity.\nconst NORM_BG = 0.56; // background, dark text on light bg\nconst NORM_TXT = 0.57; // text,       dark text on light bg\nconst REV_TXT = 0.62; // text,       light text on dark bg\nconst REV_BG = 0.65; // background, light text on dark bg\n\n// Soft clamp for very dark colours (flare / near-black perceptual compression).\nconst BLK_THRS = 0.022;\nconst BLK_CLMP = 1.414;\n\n// Output scaling and the low-contrast dead zone.\nconst SCALE_BOW = 1.14;\nconst SCALE_WOB = 1.14;\nconst LO_BOW_OFFSET = 0.027;\nconst LO_WOB_OFFSET = 0.027;\nconst LO_CLIP = 0.1;\nconst DELTA_Y_MIN = 0.0005;\n\n// Valid luminance domain (allows a little headroom above 1.0 for HDR-ish input).\nconst Y_CLAMP_MIN = 0.0;\nconst Y_CLAMP_MAX = 1.1;\n\n/* ---------------------------------------------------------------------- *\n * Colour parsing\n * ---------------------------------------------------------------------- */\n\nconst HEX_RE = /^#?([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;\n\n/**\n * Parse '#rrggbb' (also accepts '#rgb', '#rgba', '#rrggbbaa' — alpha ignored,\n * APCA requires already-composited opaque colours) into [r, g, b] 0..255.\n *\n * @param {string} hex\n * @returns {[number, number, number]}\n */\nfunction parseHex(hex) {\n  if (typeof hex !== 'string') {\n    throw new TypeError(`apca: expected a hex colour string, got ${typeof hex}`);\n  }\n  const m = HEX_RE.exec(hex.trim());\n  if (!m) throw new TypeError(`apca: invalid hex colour '${hex}'`);\n\n  let h = m[1];\n  if (h.length === 3 || h.length === 4) {\n    h = h\n      .slice(0, 3)\n      .split('')\n      .map((c) => c + c)\n      .join('');\n  } else {\n    h = h.slice(0, 6);\n  }\n  const n = parseInt(h, 16);\n  return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];\n}\n\n/**\n * sRGB (0..255 per channel) -> APCA screen luminance Y.\n *\n * @param {[number, number, number]|number[]} rgb\n * @returns {number} Y, nominally 0..1\n */\nfunction sRGBtoY(rgb) {\n  const simpleExp = (chan) => Math.pow(chan / 255.0, MAIN_TRC);\n  return S_RCO * simpleExp(rgb[0]) + S_GCO * simpleExp(rgb[1]) + S_BCO * simpleExp(rgb[2]);\n}\n\n/* ---------------------------------------------------------------------- *\n * Core contrast\n * ---------------------------------------------------------------------- */\n\n/**\n * APCA contrast from two screen luminances. This is the 0.0.98G-4g core:\n * soft black clamp, deltaYmin guard, polarity branch, low-contrast clip.\n *\n * @param {number} txtY luminance of the text colour\n * @param {number} bgY  luminance of the background colour\n * @returns {number} Lc, signed, roughly -108..+106 for sRGB\n */\nfunction APCAcontrast(txtY, bgY) {\n  // Sanity: NaN or out-of-gamut luminance yields 0 (per reference).\n  if (\n    !Number.isFinite(txtY) ||\n    !Number.isFinite(bgY) ||\n    Math.min(txtY, bgY) < Y_CLAMP_MIN ||\n    Math.max(txtY, bgY) > Y_CLAMP_MAX\n  ) {\n    return 0.0;\n  }\n\n  // Soft clamp near black (applies to whichever colour is below the threshold).\n  const txt = txtY > BLK_THRS ? txtY : txtY + Math.pow(BLK_THRS - txtY, BLK_CLMP);\n  const bg = bgY > BLK_THRS ? bgY : bgY + Math.pow(BLK_THRS - bgY, BLK_CLMP);\n\n  // Luminances too close to distinguish: hard zero, avoids float noise.\n  if (Math.abs(bg - txt) < DELTA_Y_MIN) return 0.0;\n\n  let sapc = 0.0;\n  let outputContrast = 0.0;\n\n  if (bg > txt) {\n    // BoW: dark text on a light background -> positive Lc.\n    sapc = (Math.pow(bg, NORM_BG) - Math.pow(txt, NORM_TXT)) * SCALE_BOW;\n    // Below the clip the result is not merely small, it is meaningless: zero it.\n    outputContrast = sapc < LO_CLIP ? 0.0 : sapc - LO_BOW_OFFSET;\n  } else {\n    // WoB: light text on a dark background -> negative Lc.\n    sapc = (Math.pow(bg, REV_BG) - Math.pow(txt, REV_TXT)) * SCALE_WOB;\n    outputContrast = sapc > -LO_CLIP ? 0.0 : sapc + LO_WOB_OFFSET;\n  }\n\n  return outputContrast * 100;\n}\n\n/**\n * APCA Lc for a text/background hex pair.\n *\n * @param {string} textHex '#rrggbb' of the text (foreground)\n * @param {string} bgHex   '#rrggbb' of the background\n * @returns {number} signed Lc (positive = dark text on light bg)\n */\nfunction apcaLc(textHex, bgHex) {\n  const lc = APCAcontrast(sRGBtoY(parseHex(textHex)), sRGBtoY(parseHex(bgHex)));\n  // Normalise -0 to 0 so `=== 0` and `Object.is` both behave.\n  return lc === 0 ? 0 : lc;\n}\n\n/* ---------------------------------------------------------------------- *\n * Human-readable bands (French)\n * ---------------------------------------------------------------------- */\n\n/** Band thresholds, descending; first match wins. @type {[number, string][]} */\nconst BANDS = [\n  [90, 'corps de texte optimal (jusqu’à 14 px)'],\n  [75, 'minimum corps de texte (>= 16 px, ou 12 px bold)'],\n  [60, 'minimum texte fluide (>= 24 px, ou 16 px semi-bold)'],\n  [45, 'titres larges (>= 36 px, ou >= 24 px bold)'],\n  [30, 'texte non essentiel / placeholders'],\n  [15, 'éléments non textuels discernables uniquement'],\n];\n\nconst BAND_INSUFFICIENT = 'insuffisant pour tout usage';\n\n/**\n * Short French description of what a given Lc is usable for.\n * The sign is ignored: only |Lc| drives the band.\n *\n * @param {number} lc signed or absolute Lc\n * @returns {string}\n */\nfunction apcaBand(lc) {\n  const abs = Math.abs(Number(lc));\n  if (!Number.isFinite(abs)) return BAND_INSUFFICIENT;\n  for (const [threshold, label] of BANDS) {\n    if (abs >= threshold) return label;\n  }\n  return BAND_INSUFFICIENT;\n}\n\n/** Smallest usable font size per band. @type {[number, string][]} */\nconst MIN_FONT_SIZES = [\n  [90, '14 px'],\n  [75, '16 px'],\n  [60, '24 px'],\n  [45, '36 px'],\n];\n\n/**\n * Smallest font size usable for readable body/fluid text at this Lc.\n * Returns null below Lc 45, where no size is considered readable text.\n *\n * @param {number} lc signed or absolute Lc\n * @returns {string|null} e.g. '16 px'\n */\nfunction apcaMinFontSize(lc) {\n  const abs = Math.abs(Number(lc));\n  if (!Number.isFinite(abs)) return null;\n  for (const [threshold, size] of MIN_FONT_SIZES) {\n    if (abs >= threshold) return size;\n  }\n  return null;\n}\n\n\nconst METHODS = DATA.methodOrder;\nconst ML = m => DATA.methods[m].label;\nconst MS = m => DATA.methods[m].short || DATA.methods[m].label;\nconst CORE = DATA.meta.coreMethod;\nconst STEPS = DATA.meta.steps;\nconst NSTEP = STEPS.length;\nconst ROLES = DATA.anchorRoles || {};\nconst roleShort = r => (ROLES[r] && ROLES[r].short) || r;\nconst roleLabel = r => (ROLES[r] && ROLES[r].label) || r;\n\nconst esc = s => String(s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\nconst fmt = x => (Math.floor(x * 100) / 100).toFixed(2);\nconst nf = x => (x === null || x === undefined ? '—' : x.toLocaleString(T('fr-FR', 'en-US')));\n\n// ---------- contraste (identique à lib/color.mjs) ----------\nfunction lum(hex) {\n  const v = hex.replace('#', '');\n  const [r, g, b] = [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) / 255)\n    .map(c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));\n  return 0.2126729 * r + 0.7151522 * g + 0.0721750 * b;\n}\nfunction ratio(h1, h2) {\n  const a = lum(h1) + 0.05, b = lum(h2) + 0.05;\n  return a > b ? a / b : b / a;\n}\n// 0.179 = point d'équi-contraste WCAG : en dessous le blanc gagne, au-dessus le noir.\nconst readableOn = hex => (lum(hex) < 0.179 ? '#ffffff' : '#000000');\n\nfunction pillFor(r) {\n  if (r >= 7) return '<span class=\"pill aaa\">AAA ' + fmt(r) + '<\/span>';\n  if (r >= 4.5) return '<span class=\"pill aa\">AA ' + fmt(r) + '<\/span>';\n  if (r >= 3) return '<span class=\"pill ui\">UI-only ' + fmt(r) + '<\/span>';\n  return '<span class=\"pill fail\">' + T('échec', 'fail') + ' ' + fmt(r) + '<\/span>';\n}\n\n// ---------- en-tête ----------\ndocument.getElementById('subtitle').innerHTML = DATA.meta.subtitle\n  + ' <br><b>' + DATA.meta.rampCount + T(' nuanciers', ' ramps') + '<\/b> × <b>' + METHODS.length + T(' méthodes', ' methods') + '<\/b> × <b>' + NSTEP + ' steps<\/b> ('\n  + STEPS.join(', ') + ') · ' + T('ancrage sur le step', 'anchored at step') + ' <code>' + DATA.meta.seedStep + '<\/code> · '\n  + DATA.meta.anchorCount + (DATA.meta.demo ? T(' couleurs de départ synthétiques, une par nuancier.', ' synthetic starting colours, one per ramp.')\n    : T(' couleurs déjà choisies, reprises telles quelles.', ' already chosen colours, taken as they are.'));\nif (DATA.meta.caveat) document.getElementById('subtitle').insertAdjacentHTML('beforebegin', '<p class=\"caveat\"><b>' + T('À lire avant les chiffres', 'Read before the numbers') + '<\/b> — ' + esc(DATA.meta.caveat) + '<\/p>');\n\n// ---------- toggles ----------\nwindow.refreshTester = null;\n(function renderToggles() {\n  const el = document.getElementById('mtoggles');\n  let saved = null;\n  try { saved = JSON.parse(localStorage.getItem('mvis-' + DATA.meta.brand) || 'null'); } catch (e) {}\n  const vis = Array.isArray(saved) && saved.filter(m => METHODS.includes(m)).length ? saved : METHODS.slice();\n  el.innerHTML = '<b style=\"font-size:12px\">' + T('Méthodes affichées :', 'Methods shown:') + '<\/b>' + METHODS.map(m =>\n    '<label class=\"mtog\"><input type=\"checkbox\" data-m=\"' + m + '\"' + (vis.includes(m) ? ' checked' : '') + '> ' + esc(ML(m)) + '<\/label>').join('')\n    + '<button id=\"mtog-all\">' + T('toutes', 'all') + '<\/button><button id=\"mtog-core\">' + (METHODS.includes('existing') ? T('existant + ', 'existing + ') : '') + esc(MS(CORE)) + '<\/button>';\n  function apply() {\n    let checked = METHODS.filter(m => el.querySelector('input[data-m=\"' + m + '\"]').checked);\n    if (!checked.length) { el.querySelectorAll('input').forEach(i => (i.checked = true)); checked = METHODS.slice(); }\n    try { localStorage.setItem('mvis-' + DATA.meta.brand, JSON.stringify(checked)); } catch (e) {}\n    document.getElementById('mvis').textContent = METHODS.filter(m => !checked.includes(m))\n      .map(m => '[data-method=\"' + m + '\"]{display:none !important}').join('');\n    if (window.refreshTester) window.refreshTester();\n  }\n  el.addEventListener('change', apply);\n  document.getElementById('mtog-all').onclick = () => { el.querySelectorAll('input').forEach(i => (i.checked = true)); apply(); };\n  document.getElementById('mtog-core').onclick = () => {\n    el.querySelectorAll('input').forEach(i => (i.checked = ['existing', CORE].includes(i.dataset.m))); apply();\n  };\n  apply();\n  window.visibleMethods = () => METHODS.filter(m => el.querySelector('input[data-m=\"' + m + '\"]').checked);\n})();\n\n// ---------- cartes méthodes ----------\ndocument.getElementById('method-cards').innerHTML = METHODS.map(m =>\n  '<div class=\"card' + (m === CORE ? ' is-core' : '') + '\" data-method=\"' + m + '\">'\n  + (m === CORE ? '<span class=\"tag\">' + T('méthode retenue pour le core', 'method chosen for the core') + '<\/span>' : '')\n  + '<h3>' + esc(ML(m)) + '<\/h3><p>' + DATA.methods[m].desc + '<\/p><\/div>').join('');\n\n// ---------- synthèse ----------\n(function renderSummary() {\n  const M = DATA.metrics;\n  const complete = METHODS.filter(m => !M[m].sparse);\n  // chaque ligne : libellé, rendu, sens, valeur, et ce qu'on dit de la meilleure. Aucune ligne ne\n  // juge une méthode à la règle d'une autre : l'écart sûr est mesuré sur chaque méthode elle-même.\n  const rows = [\n    [T('Paires accessibles AA (≥ 4.5) — tous nuanciers confondus', 'AA-accessible pairs (≥ 4.5) — all ramps combined'),\n      m => nf(M[m].pairsAA) + ' / ' + nf(M[m].totalPairs) + ' (' + M[m].pctAA + T(' %)', '%)'), 'max', m => M[m].pairsAA, T('le plus de paires AA', 'most AA pairs')],\n    [T('Écart de crans qui garantit AA partout (le plus petit qui vaut pour toutes les paires, toutes teintes)', 'Step gap that guarantees AA everywhere (the smallest that holds for every pair, every hue)'),\n      m => (M[m].safeRank === null ? T('aucun', 'none') : 'Δ ≥ ' + RN(M[m].safeRank)), 'min', m => M[m].safeRank ?? 9999, T('le plus petit écart sûr', 'smallest safe gap')],\n    [T('Écart de contraste entre teintes à cran égal (moyenne)', 'Contrast spread between hues at equal step (mean)'),\n      m => M[m].meanSpread, 'min', m => M[m].meanSpread, T('le moins d\\'écart entre teintes', 'least spread between hues')],\n    [T('Couleurs utilisables en texte AA sur blanc', 'Colours usable as AA text on white'),\n      m => M[m].onWhite + ' / ' + M[m].colorCount, 'max', m => M[m].onWhite / M[m].colorCount, T('le plus de textes AA sur blanc', 'most AA text colours on white')],\n    [T('Couleurs utilisables en texte AA sur noir', 'Colours usable as AA text on black'),\n      m => M[m].onBlack + ' / ' + M[m].colorCount, 'max', m => M[m].onBlack / M[m].colorCount, T('le plus de textes AA sur noir', 'most AA text colours on black')],\n    [T('Asymétrie clair / sombre', 'Light / dark asymmetry') + ' <span style=\"color:var(--muted);font-size:11px\">' + T('(écart entre les deux lignes ci-dessus ; il vient de la répartition des crans)', '(gap between the two rows above; it comes from how the steps are spread)') + '<\/span>',\n      m => Math.abs(M[m].onWhite - M[m].onBlack) + T(' couleurs', Math.abs(M[m].onWhite - M[m].onBlack) === 1 ? ' colour' : ' colours'), 'min', m => Math.abs(M[m].onWhite - M[m].onBlack) / M[m].colorCount, T('le plus équilibré entre clair et sombre', 'most balanced between light and dark')],\n    [T('Écart à la couleur de départ au ' + DATA.meta.seedStep + ' (ΔE2000 moyen)', 'Distance from the starting colour at ' + DATA.meta.seedStep + ' (mean ΔE2000)'),\n      m => (M[m].drift ? M[m].drift.meanDE : m === 'existing' ? T('— (référence)', '— (reference)') : '—'), 'min', m => (M[m].drift ? M[m].drift.meanDE : Infinity), T('la couleur de départ la mieux gardée', 'starting colour best kept')],\n    [T('Fidélité à <b>toutes<\/b> les couleurs de départ (ΔE2000 moyen au cran le plus proche)', 'Fidelity to <b>all<\/b> the starting colours (mean ΔE2000 at the nearest step)'),\n      m => M[m].meanFidelity, 'min', m => M[m].meanFidelity, T('la plus fidèle aux couleurs de départ', 'most faithful to the starting colours')],\n  ];\n  const winners = [];\n  let h = '<table><tr><th>' + T('Métrique', 'Metric') + '<\/th>' + METHODS.map(m => '<th data-method=\"' + m + '\">' + esc(ML(m)) + '<\/th>').join('') + '<\/tr>';\n  for (const [label, render, best, val, what] of rows) {\n    // l'existant est creux : ses totaux ne sont pas comparables, il ne concourt pas\n    const vals = complete.map(val);\n    const target = best === 'max' ? Math.max(...vals) : Math.min(...vals);\n    if (Number.isFinite(target)) winners.push([what, complete.filter(m => val(m) === target)]);\n    h += '<tr><td>' + label + '<\/td>' + METHODS.map(m =>\n      '<td data-method=\"' + m + '\" class=\"num' + (!M[m].sparse && val(m) === target ? ' best' : '') + '\">' + render(m) + '<\/td>').join('') + '<\/tr>';\n  }\n  h += '<\/table>' + (M.existing ? '<p class=\"hint\">' + T('L\\'existant est une méthode <b>creuse<\/b> — il ne couvre que '\n    + M.existing.colorCount + ' couleurs sur les ' + DATA.meta.colorCount + ' d\\'une échelle complète. '\n    + 'Ses totaux sont affichés pour information mais ne concourent pas au meilleur score, faute d\\'être comparables.',\n    'The existing set is a <b>sparse<\/b> method — it only covers '\n    + M.existing.colorCount + ' colours out of the ' + DATA.meta.colorCount + ' of a complete scale. '\n    + 'Its totals are shown for information but do not compete for the best score, since they are not comparable.') + '<\/p>' : '');\n  document.getElementById('summary').innerHTML = h;\n\n  // pas de gagnant : la meilleure de chaque ligne, et c'est au lecteur de dire quelle ligne compte\n  const list = '<ul>' + winners.map(([what, ms]) => '<li>' + what + T(' : ', ': ') + ms.map(m => '<code>' + esc(MS(m)) + '<\/code>').join(', ') + '<\/li>').join('') + '<\/ul>';\n  const core = DATA.meta.demo ? T('la méthode que Hueladder propose par défaut', 'the method Hueladder offers by default') : T('la méthode retenue pour le core de cette palette', 'the method chosen for this palette\\'s core');\n  document.getElementById('verdict-note').innerHTML = T(\n    '<b>Lecture.<\/b> Aucune méthode n\\'a la meilleure valeur sur toutes les lignes : chacune répond à un critère. La meilleure de chaque ligne, en gras dans le tableau :'\n    + list + 'Choisis d\\'abord le critère qui compte pour toi, puis regarde ce que la méthode qui y répond paie sur les autres lignes ; '\n    + 'le guide de choix du studio (Comprendre) et <code>hueladder explain<\/code> partent de ces critères. <code>' + esc(MS(CORE)) + '<\/code> est ' + core + ' : un choix, pas un classement.',\n    '<b>How to read this.<\/b> No method has the best value on every row: each one answers a criterion. The best of each row, in bold in the table:'\n    + list + 'Pick the criterion that matters to you first, then look at what the method that answers it pays on the other rows; '\n    + 'the studio\\'s choice guide (Understand) and <code>hueladder explain<\/code> start from these criteria. <code>' + esc(MS(CORE)) + '<\/code> is ' + core + ': a choice, not a ranking.');\n})();\n\n// ---------- visualisations ----------\n(function renderCharts() {\n  const CHROM = DATA.ramps.filter(r => r.kind !== 'neutral');\n  const PL = 44, PR = 26, PT = 14, PB = 26, W = 400, H = 240;\n  const plotR = W - PR, plotB = H - PB;\n  const sx = i => PL + (i / (NSTEP - 1)) * (plotR - PL);\n\n  function svgPanel(title, body, yTicks, opts) {\n    let s = '<div><div class=\"mname\" style=\"margin:0 0 4px 4px\">' + esc(title) + '<\/div>'\n      + '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" class=\"chart\">'\n      + '<rect x=\"' + PL + '\" y=\"' + PT + '\" width=\"' + (plotR - PL) + '\" height=\"' + (plotB - PT) + '\" fill=\"none\" stroke=\"var(--line)\"/>';\n    STEPS.forEach((st, i) => {\n      if (i % 2 !== 0 && i !== NSTEP - 1) return;\n      s += '<text x=\"' + sx(i) + '\" y=\"' + (plotB + 14) + '\" font-size=\"9\" text-anchor=\"middle\" fill=\"var(--muted)\">' + st + '<\/text>';\n    });\n    for (const t of yTicks) {\n      s += '<line x1=\"' + PL + '\" y1=\"' + t.y + '\" x2=\"' + plotR + '\" y2=\"' + t.y + '\" stroke=\"var(--line)\" stroke-dasharray=\"2,3\"/>'\n        + '<text x=\"' + (PL - 4) + '\" y=\"' + (t.y + 3) + '\" font-size=\"9\" text-anchor=\"end\" fill=\"var(--muted)\">' + t.label + '<\/text>';\n    }\n    if (opts && opts.rightTicks) for (const t of opts.rightTicks) {\n      s += '<text x=\"' + (plotR + 3) + '\" y=\"' + (t.y + 3) + '\" font-size=\"8\" fill=\"var(--muted)\">' + t.label + '<\/text>';\n    }\n    if (opts && opts.refs) for (const rl of opts.refs) {\n      s += '<line x1=\"' + PL + '\" y1=\"' + rl.y + '\" x2=\"' + plotR + '\" y2=\"' + rl.y + '\" stroke=\"' + rl.color + '\" stroke-width=\"1.2\" stroke-dasharray=\"6,3\"/>'\n        + (rl.label ? '<text x=\"' + (PL + 4) + '\" y=\"' + (rl.y - 3) + '\" font-size=\"9\" fill=\"' + rl.color + '\">' + rl.label + '<\/text>' : '');\n    }\n    return s + body + '<\/svg><\/div>';\n  }\n\n  const strokeOf = (r, m) => (r.kind === 'neutral' ? 'var(--muted)' : (r.meta[m][r.seedIndex] ? r.colors[m][r.seedIndex] : r.seed));\n\n  function lineBody(m, getVal, sy, chromOnly) {\n    let s = '';\n    for (const r of (chromOnly ? CHROM : DATA.ramps)) {\n      // une méthode creuse produit des segments : on coupe la polyline sur les trous\n      const runs = [];\n      let cur = [];\n      for (let i = 0; i < NSTEP; i++) {\n        const v = getVal(r, m, i);\n        if (v === null || v === undefined) { if (cur.length) runs.push(cur); cur = []; continue; }\n        cur.push(sx(i) + ',' + sy(v));\n      }\n      if (cur.length) runs.push(cur);\n      for (const pts of runs) {\n        if (pts.length < 2) {\n          const [cx, cy] = pts[0].split(',');\n          s += '<circle cx=\"' + cx + '\" cy=\"' + cy + ' ep'),\n    T('La « forme » de chaque méthode. OKLCH à luminosité fixe : toutes les rampes exactement superposées, par construction. '\n    + '<code>' + esc(MS('fusilier')) + '<\/code> : presque superposées, avec un léger éventail — à contraste égal, chaque teinte demande un L un peu différent — '\n    + 'et une courbe logarithmique, plus serrée dans les clairs, comme la perception du contraste. '\n    + 'Quand les courbes divergent, c\\'est qu\\'à rang égal chaque teinte a sa propre luminosité : le contraste d\\'un même cran varie alors d\\'une teinte à l\\'autre.',\n    'The “shape” of each method. OKLCH at fixed lightness: all ramps exactly superimposed, by construction. '\n    + '<code>' + esc(MS('fusilier')) + '<\/code>: almost superimposed, with a slight fan — at equal contrast, each hue needs a slightly different L — '\n    + 'and a logarithmic curve, tighter in the lights, like the perception of contrast. '\n    + 'When the curves diverge, each hue has its own lightness at equal rank: the contrast of a given step then varies from one hue to another.'),\n    m => svgPanel(ML(m), lineBody(m, (r, mm, i) => mv(r, mm, i, s => s.oklch[0]), sy01), ticks01));\n\n  h += chartGroup(T('2 · Contraste vs noir, échelle logarithmique — la signature de chaque méthode', '2 · Contrast vs black, logarithmic scale — the signature of each method'),\n    T('Le graphique qui montre ce qu\\'un écart de crans garantit. En échelle log du contraste face au noir, deux couleurs sont AA si elles sont distantes '\n    + 'd\\'au moins la moitié de la hauteur totale (4.58² ≈ 21). <code>' + esc(MS('fusilier')) + '<\/code> : une droite unique, toutes teintes confondues — '\n    + 'la distance verticale se lit directement dans les noms de steps (axe de droite : shades 0–200). Un faisceau dispersé signifie au contraire '\n    + 'que la distance entre deux steps dépend de la teinte : un même écart de crans ne garantit pas le même contraste partout, et chaque paire se vérifie teinte par teinte.',\ pé<\/b> est celui que son nom lui donne aujourd\\'hui. '\n    + 'Quand les deux divergent, le nom ment sur la couleur. Les colonnes suivantes donnent le step perceptuellement le plus proche dans chaque '\n    + 'échelle générée, avec l\\'écart ΔE2000 : sous ~2 c\\'est invisible à l\\'œil nu, au-delà de ~5 c\\'est une autre couleur.',\n    'Each of the ' + DATA.meta.anchorCount + ' colours already chosen, and the step it would land on in each method. '\n    + 'The <b>earned rank<\/b> depends on no method: it is derived solely from the colour\\'s contrast against black '\n    + '(shade = 200 · ln(contrast)/ln 21), that is, from its actual lightness. The <b>held rank<\/b> is the one its name gives it today. '\n    + 'When the two differ, the name misrepresents the colour. The following columns give the perceptually closest step in each '\n    + 'generated scale, with the ΔE2000 gap: below ~2 it is invisible to the naked eye, beyond ~5 it is a different colour.');\n\n  const gaps = DATA.anchorMap.filter(a => Math.abs(a.rankGap) >= 2);\n\n  let h = '';\n  if (gaps.length) {\n    h += '<div class=\"note\"><b>⚠ ' + gaps.length + T(' couleur' + (gaps.length > 1 ? 's' : '') + ' porte' + (gaps.length > 1 ? 'nt' : '')\n      + ' un nom qui ne correspond pas à sa clarté.', ' colour' + (gaps.length > 1 ? 's carry names that do' : ' carries a name that does')\n      + ' not match its lightness.') + '<\/b><br>'\n      + gaps.map(a => '<code>' + esc(a.rampLabel) + ' / ' + esc(roleLabel(a.role)) + '<\/code> ' + a.hex\n        + T(' est nommée <b>', ' is named <b>') + a.placedStep + T('<\/b> mais sa clarté en fait un <b>', '<\/b> but its lightness makes it a <b>') + a.naturalStep + '<\/b> '\n        + T('(contraste ' + a.cvb + ':1 face au noir, seulement ' + a.cvw + ':1 face au blanc',\n          '(contrast ' + a.cvb + ':1 against black, only ' + a.cvw + ':1 against white')\n        + (a.cvw < 3 ? T(' — <b>du texte blanc dessus échoue<\/b>', ' — <b>white text on it fails<\/b>') : '') + ').').join('<br>')\n      + T('<br><br>C\\'est le diagnostic le plus actionnable de cette page : ces couleurs sont utilisables, mais pas sous ce nom-là. '\n      + 'Soit on les renomme au rang qu\\'elles méritent, soit on les remplace par la valeur générée au rang qu\\'elles occupent.',\n        '<br><br>This is the most actionable finding on this page: these colours are usable, just not under that name. '\n      + 'Either rename them to the rank they earn, or replace them with the generated value at the rank they hold.') + '<\/div>';\n  }\n\n  h += '<table><tr><th>' + T('Nuancier', 'Ramp') + '<\/th><th>' + T('Rôle', 'Role') + '<\/th><th>' + T('Valeur', 'Value') + '<\/th><th>Shade<\/th><th>'\n    + T('Rang occupé', 'Held rank') + '<\/th><th>' + T('Rang mérité', 'Earned rank') + '<\/th>'\n    + gen.map(m => '<th data-method=\"' + m + '\">' + esc(MS(m)) + '<\/th>').join('') + '<\/tr>';\n  for (const a of DATA.anchorMap) {\n    const gap = Math.abs(a.rankGap) >= 2;\n    h += '<tr><td><span class=\"kindpill ' + a.kind + '\">' + a.kind + '<\/span> ' + esc(a.rampLabel) + '<\/td>'\n      + '<td>' + esc(roleLabel(a.role)) + (a.pinned ? ' <span style=\"color:var(--muted);font-size:11px\">' + T('(ancré)', '(pinned)') + '<\/span>' : '') + '<\/td>'\n      + '<td><span class=\"dot\" style=\"background:' + a.hex + '\"><\/span><code>' + a.hex + '<\/code><\/td>'\n      + '<td class=\"num\">s' + Math.round(a.shade) + '<\/td>'\n      + '<td class=\"num\">' + a.placedStep + (a.moved ? ' <span title=\"' + T('rang naturel déjà occupé par une autre couleur du nuancier', 'natural rank already taken by another colour of the ramp') + '\" style=\"color:var(--warn)\">↕<\/span>' : '') + '<\/td>'\n      + '<td class=\"num' + (gap ? ' worst' : '') + '\"><b>' + a.naturalStep + '<\/b>'\n      + (gap ? ' <span title=\"' + T('écart de ' + Math.abs(a.rankGap) + ' rangs', Math.abs(a.rankGap) + '-rank gap') + '\">⚠<\/span>' : '') + '<\/td>';\n    for (const m of gen) {\n      const p = a.perMethod[m \n(function renderUsages() {\n  const nR = DATA.meta.rampCount;\n  let h = '<table><tr><th>' + T('Usage', 'Usage') + '<\/th><th>' + T('Seuil', 'Threshold') + '<\/th>' + METHODS.map(m => '<th data-method=\"' + m + '\">' + esc(MS(m)) + '<\/th>').join('') + '<\/tr>';\n  for (const p of DATA.usages) {\n    h += '<tr><td>' + p.label + '<\/td><td class=\"num\">≥ ' + p.threshold + ' <span style=\"color:var(--muted);font-size:11px\">' + p.ref + '<\/span><\/td>';\n    for (const m of METHODS) {\n      const s = p.byMethod[m];\n      const cls = s.applicable === 0 ? '' : s.pass === s.applicable ? ' score-best' : s.pass <= s.applicable / 2 ? ' score-bad' : '';\n      const title = s.applicable === 0 ? T('ce pattern n\\'existe pas dans cette méthode (steps manquants)', 'this pattern does not exist in this method (missing steps)')\n        : (s.fails.length ? T('échecs : ', 'failures: ') + s.fails.join(', ') : T('tous les nuanciers passent', 'every ramp passes'));\n      h += '<td data-method=\"' + m + '\" class=\"num' + cls + '\" title=\"' + esc(title) + '\">'\n        + (s.applicable === 0 ? '—' : s.pass + '/' + s.applicable) + '<\/td>';\n    }\n    h += '<\/tr>';\n  }\n  h += '<\/table>';\n  h += '<div class=\"note\">' + T('<b>Lecture.<\/b> Avec une méthode à contraste ciblé, chaque pattern est soit tout-passe soit tout-échoue : '\n    + 'le contraste d\\'une paire de steps est le même pour toutes les teintes, par construction. Quand un pattern échoue, il échoue partout, '\n    + 'et le même remplacement (un cran plus loin) vaut pour toutes les teintes. Avec une méthode qui n\\'égalise pas la luminance entre teintes, le même pattern passe '\n    + 'sur certains nuanciers et pas d\\'autres : chaque usage doit être vérifié teinte par teinte, et les exceptions mémorisées. '\n    + (METHODS.includes('existing') ? 'Les colonnes de l\\'existant sont partielles (« — » quand le step n\\'existe pas) : c\\'est précisément le vide que le core doit combler.' : ''),\n    '<b>How to read this.<\/b> With a contrast-targeted method, each pattern either passes everywhere or fails everywhere: '\n    + 'the contrast of a pair of steps is the same for every hue, by construction. When a pattern fails, it fails everywhere, '\n    + 'and the same replacement (one step further) works for every hue. With a method that does not equalise luminance between hues, the same pattern passes '\n    + 'on some ramps and not on others: every usage has to be checked hue by hue, and the exceptions remembered. '\n    + (METHODS.includes('existing') ? 'The existing columns are partial (“—” when the step does not exist): that is precisely the gap the core has to fill.' : '')) + '<\/div>';\n  document.getElementById('usages').innerHTML = h;\n})();\n\n// ---------- nuanciers ----------\n\n/** Un swatch. `label` est ce que le testeur de paires affichera si on clique dessus. */\nfunction swatchHTML(meta, step, label, opts) {\n  opts = opts || {};\n  if (!meta) return '<div class=\"sw-none\" title=\"' + esc(label) + T(' : aucune couleur à ce rang', ': no colour at this rank') + '\"><\/div>';\n  const wOk = ratio(meta.hex, '#ffffff') >= 4.5, bOk = ratio(meta.hex, '#000000') >= 4.5;\n  return '<div class=\"sw' + (opts.cls || '') + '\" style=\"background:' + meta.hex + ';color:' + readableOn(meta.hex) + '\"'\n    + ' data-hex=\"' + meta.hex + '\" data-label=\"' + esc(label) + '\"'\n    + ' title=\"' + meta.hex + ' · oklch(' + meta.oklch.join(' ') + ') · L* ' + meta.lstar\n    + T(' · vs blanc ', ' · vs white ') + meta.cvw + T(' · vs noir ', ' · vs black ') + meta.cvb + ' · shade s' + Math.round(meta.shade)\n    + T(' · APCA sur blanc Lc ', ' · APCA on white Lc ') + meta.apcaOnWhite + '\">'\n    + '<span class=\"st\">' + step + (opts.shade ? ' <span style=\"opacity:.6\">s' + Math.round(meta.shade) + '<\/span>' : '') + '<\/span>'\n    + '<span class=\"marks\">' + (wOk ? 'W' : '') + (bOk ? 'B' : '') + '<\/span>'\n    + '<span class=\"hx\">' + meta.hex.slice(1) + '<\/span><\/div>';\n}\n\n const STEP_KEYS = ['enter', 'read', 'generate', 'tune', 'dark', 'verify', 'ship'];
const fresh = () => ({
  v: 1, sid: Math.random().toString(36).slice(2, 8), brand: t('myBrand'), door: null, naming: 'grid', stepList: NAMINGS.grid.presets.standard.slice(), namingMemory: {},
  ramps: [], method: 'fusilier', dark: { enabled: true, background: '#121212', method: 'mirror-wcag', profile: 'aligned', attenuate: 0 },
  tuned: {}, importLog: null, step: 0, accepted: [], assumed: [],
});

let state = (() => {
  const fromHash = location.hash.startsWith('#s=') ? decodeState(location.hash.slice(3)) : null;
  if (fromHash) {
    try { localStorage.setItem('hueladder-state-previous', localStorage.getItem('hueladder-state') || ''); } catch (e) {}
    history.replaceState(null, '', location.pathname);
    return { ...fresh(), ...fromHash };
  }
  try { const s = JSON.parse(localStorage.getItem('hueladder-state')); if (s && s.v === 1) return { ...fresh(), ...s }; } catch (e) {}
  return fresh();
})();
// états enregistrés par une version antérieure : la désaturation uniforme à 20 % n'avait pas
// de fondement, on repart du défaut mesuré (chroma du clair, sans atténuation)
if (!state.dark.method) state.dark.method = 'mirror-wcag';
if (state.dark.attenuate === undefined) { state.dark.attenuate = 0; if (state.dark.profile === 'desaturated') state.dark.profile = 'aligned'; delete state.dark.desaturate; }
if (!Array.isArray(state.accepted)) state.accepted = [];
// avant les trois entrées, tout état enregistré était un parcours de création
if (state.entry === undefined) state.entry = state.ramps.length ? 'create' : null;
if (!Array.isArray(state.assumed)) state.assumed = [];
// les états d'avant les nomenclatures : un préréglage de la grille
if (!state.naming) { state.naming = 'grid'; state.stepList = NAMINGS.grid.presets[state.crans || 'standard']; delete state.crans; }
if (!state.stepList) state.stepList = NAMINGS[state.naming].presets[NAMINGS[state.naming].defaultPreset];
// la mémoire par nomenclature : la liste en cours y est rangée sous le préréglage le plus proche
if (!state.namingMemory) {
  const found = Object.entries(NAMINGS[state.naming].presets).find(([, l]) => sameSet(l, state.stepList, state.naming === 'rank'));
  state.namingMemory = { [state.naming]: { preset: found ? found[0] : NAMINGS[state.naming].defaultPreset, list: state.stepList.slice() } };
}

// ================================================================ la spec, seul état du moteur

/**
 * Le studio n'est qu'un éditeur de spec. `tuned: true` y ajoute les réglages faits dans le
 * régleur ; sans eux, c'est la base sur laquelle le régleur travaille. `profile` force un
 * profil d'éclat sombre, pour montrer ce que l'autre choix aurait donné.
 */
function specOf({ tuned = true, method = state.method, profile = state.dark.profile } = {}) {
  const hasTuning = tuned && Object.keys(state.tuned).length > 0;
  const spec = {
    id: slug(state.brand), brand: state.brand, naming: state.naming, stepList: state.stepList, lang,
    ...(state.caveat ? { caveat: state.caveat } : {}),
    ...(state.ladders ? { ladders: state.ladders } : {}),
    ...(state.lightChroma ? { lightChroma: state.lightChroma } : {}),
    ...(state.cvdModes ? { cvdModes: true } : {}),
    ...(state.dataviz ? { dataviz: true } : {}),
    ...(state.keep || {}),
    source: 'studio Hueladder',
    title: t('reportTitle', state.brand),
    accent: accentHex(),
    coreMethod: hasTuning ? 'tuned' : method,
    tunedBase: method,
    // une palette importée garde ses couleurs à leur rang mérité ; une couleur choisie
    // dans le studio, elle, est le 500 par définition
    pinDefault: state.door !== 'audit',
    ramps: state.ramps.map(r => {
      const out = { name: r.name, label: r.label, kind: r.kind, source: state.door === 'audit' ? t('sourceAudit') : t('sourceCreate'), anchors: r.anchors };
      if (r.seed) out.seed = r.seed;
      if (r.method) out.method = r.method;
      ['primitives', 'lightChroma'].forEach(k => { if (r[k] !== undefined) out[k] = r[k]; });
      if (hasTuning && state.tuned[r.name]) out.tuned = state.tuned[r.name];
      return out;
    }),
  };
  if (state.dark.enabled) {
    spec.darkMode = { background: state.dark.background };
    if (state.dark.method !== 'mirror-wcag') spec.darkMode.method = state.dark.method;
    if (profile === 'bell') spec.darkMode.chromaProfile = 'bell';
    if (state.dark.attenuate > 0) spec.darkMode.desaturate = state.dark.attenuate;
    if (state.dark.pins && Object.keys(state.dark.pins).length) spec.darkMode.pins = state.dark.pins;
    if (state.dark.spreadTop) spec.darkMode.spreadTop = true;
    if (state.dark.haloCap) spec.darkMode.haloCap = state.dark.haloCap;
  }
  // les exceptions assumées au diagnostic partent dans le rapport, avec leur raison
  const notes = [...state.accepted.map(a => a.note), ...(state.assumed || []).map(a => a.note)];
  if (notes.length) spec.notes = notes;
  // les clés, pour qu'un constat accepté ne revienne pas quand on recharge la spec
  if (state.accepted.length) spec.accepted = state.accepted;
  if ((state.assumed || []).length) spec.assumed = state.assumed;
  return spec;
}

const memo = new Map();
function dataOf(opts) {
  if (!state.ramps.length) return null;
  const spec = applyNaming(specOf(opts));
  const key = JSON.stringify(spec);
  if (!memo.has(key)) {
    if (memo.size > 12) memo.clear();
    memo.set(key, { spec, data: buildData(spec) });
  }
  return memo.get(key);
}
const finalOf = () => dataOf({ tuned: true });

/** Les crans que ce préréglage livre, dans l'ordre de l'échelle. */
function emitted(data, spec) {
  return data.meta.steps.filter(s => !spec.emitSteps || spec.emitSteps.includes(s));
}
function scaleOf(data, ramp, mode = 'light', method = data.meta.coreMethod) {
  const r = data.ramps.find(x => x.name === ramp);
  const src = mode === 'dark' ? r.darkColors : r.colors;
  return Object.fromEntries(data.meta.steps.map((s, i) => [s, src && src[method] ? src[method][i] : null]));
}

function accentHex() {
  const brand = state.ramps.find(r => r.kind === 'brand') || state.ramps[0];
  if (!brand) return '#2f5bd3';
  const a = brand.anchors, hex = a.default || a['500'] || brand.seed || Object.values(a)[0];
  // l'accent de l'interface doit porter du texte blanc : on le fonce au besoin
  let { L, C, H } = hexToOklch(hex);
  let out = hex;
  while (contrast(out, '#ffffff') < 4.5 && L > 0.2) { L -= 0.02; out = oklchToHex(L, C, H); }
  return out;
}

/** Où tombe chaque cran entre le blanc (0) et le noir (1), selon ce que son nom encode. */
function stepPositions(naming, list) {
  if (naming === 'rank') return list.map((_, i) => (list.length > 1 ? i / (list.length - 1) : 0.5));
  if (naming === 'shade') return list.map(n => 1 - n / 200);
  if (naming === 'grid') return list.map(n => (REFERENCE_STEPS.includes(n) ? (REFERENCE_STEPS.indexOf(n) + 0.5) / REFERENCE_STEPS.length : n / 1000));
  return list.map(n => n / 1000);
}
function presetOf(naming, list) {
  return Object.entries(NAMINGS[naming].presets).find(([, l]) => sameSet(l, list, naming === 'rank'))?.[0] || null;
}
/** La règle d'une nomenclature et d'une liste, sans rebâtir le système. */
function rulesFor(naming, list) {
  const { contrastRules, defaultShadeLadder } = __lib.methods;
  if (naming === 'grid') return contrastRules(defaultShadeLadder(REFERENCE_STEPS.length));
  if (naming === 'rank') return contrastRules(defaultShadeLadder(list.length));
  const sp = applyNaming({ naming, stepList: list, ramps: [] });
  return { ...contrastRules(sp.ruleLadder), grain: sp.rankUnit.grain };
}

/**
 * Chaque nomenclature garde sa propre configuration : le préréglage de départ, et la liste telle
 * qu'on l'a modifiée. Passer à une autre nomenclature puis revenir retrouve ses crans, et un
 * tag « modifié » dit qu'on s'est écarté du préréglage, avec de quoi y revenir.
 */
function memoryOf(naming) {
  const N = NAMINGS[naming];

}
const isModified = naming => { const m = memoryOf(naming); return !sameSet(m.list, NAMINGS[naming].presets[m.preset], naming === 'rank'); };

function setSteps(naming, list, preset) {
  const n = Object.keys(state.tuned).length;
  if (n && !confirm(t('confirmCrans'))) return false;
  if (n) clearTuning();
  const m = memoryOf(naming);
  state.namingMemory[naming] = { preset: preset || m.preset, list: list.slice() };
  state.naming = naming; state.stepList = list.slice(); save(); render(); return true;
}

function loadSpec(spec) {

  clearTuning();
  state.tuned = Object.fromEntries(spec.ramps.filter(r => r.tuned).map(r => [r.name, r.tuned]));
  if (spec.naming && NAMINGS[spec.naming]) { state.naming = spec.naming; state.stepList = spec.stepList || NAMINGS[spec.naming].presets[NAMINGS[spec.naming].defaultPreset]; state.namingMemory = { [spec.naming]: { preset: presetOf(spec.naming, state.stepList) || NAMINGS[spec.naming].defaultPreset, list: state.stepList.slice() } }; }
  else if (spec.crans && STEP_PRESETS[spec.crans]) { state.naming = 'grid'; state.stepList = NAMINGS.grid.presets[spec.crans]; }
  if (spec.tunedBase || spec.coreMethod) state.method = spec.coreMethod === 'tuned' ? (spec.tunedBase || 'fusilier') : spec.coreMethod;
  state.dark = spec.darkMode
    ? { enabled: true, background: spec.darkMode.background, method: spec.darkMode.method || 'mirror-wcag',

        pins: spec.darkMode.pins || {}, spreadTop: !!spec.darkMode.spreadTop, haloCap: spec.darkMode.haloCap || null }
    : { ...state.dark, enabled: false };
  state.accepted = spec.accepted || [];
  state.assumed = spec.assumed || [];
  state.caveat = spec.caveat || '';
  state.ladders = spec.ladders && spec.ladders.shadeLadder ? spec.ladders : null;
  state.lightChroma = spec.lightChroma || null; state.cvdModes = !!spec.cvdModes; state.dataviz = !!spec.dataviz;

}
