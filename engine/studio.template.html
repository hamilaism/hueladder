const mLab = (data, m) => (I18N[lang].methods && I18N[lang].methods[m] ? methodLabel(m) : (data.methods[m] && data.methods[m].label) || m);
// une série par teinte, pour un graphique : la valeur de chaque cran (ou de chaque intervalle)
function seriesOf(data, r, m, key) {
  const meta = data.meta.coreSteps.map(s => r.meta[m] && r.meta[m][data.meta.steps.indexOf(s)]);
  if (key === 'step') return meta.slice(1).map((b, k) => (meta[k] && b ? Math.max(meta[k].cvb, b.cvb) / Math.min(meta[k].cvb, b.cvb) : null));
  if (key === 'H') {
    if (r.kind === 'neutral') return [];
    const h0 = hexToOklch(r.seed).H;
    return meta.map(x => (x && x.oklch[1] >= 0.03 ? ((x.oklch[2] - h0 + 540) % 360) - 180 : null));
  }
  return meta.map(x => (!x ? null : key === 'cvb' ? x.cvb : key === 'L' ? x.oklch[0] : key === 'C' ? x.oklch[1] : x.apcaOnWhite));
}
// les mêmes axes pour toutes les méthodes : le domaine se calcule sur toutes à la fois
function chartDomain(data, methods, key) {
  if (key === 'cvb') return { lo: 1, hi: 21, log: true, ticks: [1, 3, 4.5, 7, 21] };
  if (key === 'L') return { lo: 0, hi: 1, ticks: [0, 0.25, 0.5, 0.75, 1] };
  if (key === 'apca') return { lo: 0, hi: 108, ticks: [0, 30, 45, 60, 75, 90, 106] };
  const vals = methods.flatMap(m => data.ramps.filter(r => !r.derived).flatMap(r => seriesOf(data, r, m, key))).filter(v => v !== null && Number.isFinite(v));
  if (key === 'C') { const hi = Math.max(0.1, ...vals) * 1.05; return { lo: 0, hi, ticks: [0, 0.1, 0.2, 0.3].filter(v => v <= hi) }; }
  if (key === 'H') { const a = Math.max(5, ...vals.map(Math.abs)) * 1.1; return { lo: -a, hi: a, ticks: [-a, 0, a].map(v => Math.round(v)) }; }
  const hi = Math.max(1.5, ...vals) * 1.05;
  return { lo: 1, hi, ticks: [1, 1.25, 1.5, 2, 2.5, 3].filter(v => v <= hi) };
}
function methodChart(data, m, key, dom) {
  const W = 260, H = 170, n = data.meta.coreSteps.length - (key === 'step' ? 1 : 0);
  const X = i => 30 + i * (W - 40) / Math.max(1, n - 1);
  const pos = v => (dom.log ? Math.log(v / dom.lo) / Math.log(dom.hi / dom.lo) : (v - dom.lo) / (dom.hi - dom.lo));
  const Y = v => H - 20 - Math.max(0, Math.min(1, pos(v))) * (H - 32);
  const tick = v => (Math.abs(v) >= 10 || Number.isInteger(v) ? String(Math.round(v)) : num(v, 2));
  let g = '';
  for (const c of dom.ticks) g += '<line x1="30" x2="' + (W - 10) + '" y1="' + Y(c) + '" y2="' + Y(c) + '" stroke="var(--line)"' + ((key === 'cvb' && c === 4.5) || (key === 'H' && c === 0) ? ' stroke-dasharray="3 3"' : '') + '/><text x="26" y="' + (Y(c) + 3) + '" text-anchor="end" font-size="9" fill="var(--muted)">' + tick(c) + '</text>';
  for (const r of data.ramps.filter(x => !x.derived)) {
    const pts = seriesOf(data, r, m, key).map((v, i) => (v === null || !Number.isFinite(v) ? null : X(i).toFixed(1) + ',' + Y(v).toFixed(1))).filter(Boolean);
    if (pts.length < 2) continue;
    const col = (r.colors[m] && r.colors[m][data.meta.seedIndex]) || r.seed;
    g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="1.6"' + (r.kind === 'neutral' ? ' stroke-dasharray="4 3"' : '') + '><title>' + esc(r.label) + '</title></polyline>';
  }
  return '<figure class="mini"><figcaption>' + esc(uLab(data, m)) + '</figcaption><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(uLab(data, m)) + '">' + g + '</svg></figure>';
}
// dans Comprendre, l'existant n'est jamais « fourni » qu'avec les couleurs de la personne
const uLab = (data, m) => (m === 'existing' ? t('mineExisting') : mLab(data, m));
function understandData() {
  const mine = state.understand === 'mine' && state.ramps.length;
  const spec = mine ? specOf({ tuned: false }) : applyNaming({ ...__lib.explain.demoSpec(lang), naming: state.naming, stepList: state.stepList });
  return { mine, data: buildData(spec) };
}
VIEWS.understand = () => {
  const E = __lib.explain, k = lang === 'en' ? 'en' : 'fr', F = E.FRAME[k];
  const { mine, data } = understandData();
  ui.understand = data;
  const rows = E.methodTable(data), used = rows.filter(r => !r.sparse), best = E.bestOf(rows), shown = rows.map(r => r.method);
  const seed = data.meta.seedStep, nRamps = data.meta.rampCount;
  const short = m => (m === 'existing' ? t('mineExisting') : (data.methods[m] && data.methods[m].short) || mLab(data, m));
  const strip = s => String(s || '').replace(/<[^>]+>/g, '');
  const codeOnly = s => esc(s).replace(/&lt;(\/?)code&gt;/g, '<$1code>');
  const cell = x => (x.pass === x.applicable ? 'ok' : x.pass ? 'warn' : 'bad');
  const dl = pairs => '<dl class="gloss">' + pairs.map(([a, b]) => '<dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd>').join('') + '</dl>';
  const gaps = s => [s[3], s[4.5], s[7]].map(v => (v === null ? '—' : v)).join(' · ');
  const span = r => (r.intervalMin ? ratio(r.intervalMin.ratio) + '–' + ratio(r.intervalMax.ratio) : null);

  // ce que montrent les chiffres
  const lessons = '<div class="panel"><span class="label">' + t('lessonsT') + '</span><p class="thesis">' + esc(E.THESIS[k]) + '</p><p class="muted">' + esc(E.DEFAULT_CHOICE[k]) + '</p>'
    + '<ol id="lessons" class="lessons">' + E.lessons(data, { lang }).map(l => '<li><b>' + esc(l.title) + '.</b> ' + esc(l.text) + '</li>').join('') + '</ol></div>';

  // les méthodes une par une : leurs couleurs, ce qu'elles rendent égal, comment elles répartissent
  const cards = [...shown, ...(data.metrics.anchored ? ['anchored'] : [])].filter(m => E.METHOD_NOTES[m]).map(m => {
    const N = E.METHOD_NOTES[m][k], tool = E.METHOD_NOTES[m].tool, r = E.methodRow(data, m);
    return '<details class="mcard" data-m="' + m + '"><summary><b>' + esc(uLab(data, m)) + '</b> <span class="muted">— ' + esc(N.equal) + '</span></summary><div class="mbody">'
      + '<div class="mramps">' + data.ramps.filter(x => !x.derived && x.colors[m]).map(x => '<div title="' + esc(x.label || x.name) + '">' + data.meta.steps.map((st, i) => data.meta.isCore[i] ? '<i' + (x.colors[m][i] ? ' style="background:' + x.colors[m][i] + '"' : '') + ' title="' + esc((x.label || x.name) + ' ' + st + (x.colors[m][i] ? ' ' + x.colors[m][i] : '')) + '"></i>' : '').join('') + '</div>').join('') + '</div>'
      + '<p><b>' + t('cardEqual') + '</b> ' + esc(N.equal) + '</p><p><b>' + t('cardSpread') + '</b> ' + esc(N.spread) + '</p>'
      + '<p><b>' + t('cardWhen') + '</b> ' + esc(N.when) + '</p><p><b>' + t('cardWatch') + '</b> ' + esc(N.watch) + '</p>'
      + (r.sparse ? '' : '<p><b>' + t('cardHere') + '</b> ' + t('cardNums', r.crossings ?? 0, gaps(r.safe), span(r), r.kept, r.drift) + '</p>')
      + (E.SETTINGS[k][m] ? '<p class="set"><b>' + t('cardSet') + '</b> ' + esc(E.SETTINGS[k][m]) + '</p>' : '')
      + '<details class="tech"><summary>' + t('cardCalc') + '</summary><p class="muted">' + esc(strip(data.methods[m].desc)) + '</p></details>'
      + (tool ? '<p class="muted">' + t('cardSource') + ' <a href="' + tool[1] + '" target="_blank" rel="noopener">' + esc(tool[0]) + '</a></p>' : '') + '</div></details>';
  }).join('');

  // une teinte, toutes les méthodes : la même couleur de départ, passée par chacune
  const real = data.ramps.filter(x => !x.derived);
  if (!real.some(x => x.name === ui.side)) ui.side = real[0].name;
  const sr = real.find(x => x.name === ui.side);
  const side = '<div class="panel"><span class="label">' + t('sideT') + '</span><p class="muted">' + t('sideLead') + '</p>'
    + '<div class="tabs" id="stabs">' + real.map(x => '<button data-s="' + esc(x.name) + '" class="' + (x === sr ? 'on' : '') + '">' + esc(x.label || x.name) + '</button>').join('') + '</div>'
    + '<div class="pgrid" id="side"><div class="prow"><span></span><div class="pchips">' + data.meta.steps.map((st, i) => (data.meta.isCore[i] ? '<span class="pc">' + esc(st) + '</span>' : '')).join('') + '</div></div>' + [...shown, ...(data.metrics.anchored ? ['anchored'] : [])].filter(m => sr.colors[m]).map(m => '<div class="prow"><span>' + esc(uLab(data, m)) + '</span><div class="pchips">'
      + data.meta.steps.map((st, i) => { const hex = data.meta.isCore[i] && sr.colors[m][i]; return hex ? '<span class="pc"><i style="background:' + hex + '" title="' + esc(st + ' · ' + hex) + '"></i>' + [contrast(hex, '#ffffff'), contrast(hex, '#000000')].map(c => (c >= 4.5 ? '<b>' + ratio(c).slice(0, -2) + '</b>' : '<span>' + ratio(c).slice(0, -2) + '</span>')).join('') + '</span>' : ''; }).join('')
      + '</div></div>').join('') + '</div></div>';

  // les graphiques : un critère à la fois, les mêmes axes pour toutes les méthodes
  const G = E.GRAPHS[k];
  if (!G[ui.graph]) ui.graph = 'cvb';
  const dom = chartDomain(data, shown, ui.graph);
  const spreads = rows.map(r => {
    const sp = data.metrics[r.method].stepSpread[seed];
    if (!sp) return '';
    const P = c => (Math.log(c) / Math.log(21) * 100).toFixed(1) + '%';
    return '<div class="spread"><span>' + esc(uLab(data, r.method)) + '</span><div class="bar"><i style="left:' + P(sp.min) + ';width:calc(' + P(sp.max) + ' - ' + P(sp.min) + ' + 2px)"></i><b style="left:' + P(4.5) + '"></b></div><span class="mono">' + num(sp.min, 2) + '–' + num(sp.max, 2) + '</span></div>';
  }).join('');
  const graphs = '<div class="panel"><span class="label">' + t('graphsT') + '</span><p class="muted">' + t('graphsLead') + '</p>'
    + '<div class="tabs" id="gtabs">' + Object.entries(G).map(([key, [title]]) => '<button data-g="' + key + '" class="' + (key === ui.graph ? 'on' : '') + '">' + esc(title) + '</button>').join('') + '</div>'
    + '<p id="gread">' + esc(G[ui.graph][1]) + '</p><div class="minis" id="proof">' + shown.map(m => methodChart(data, m, ui.graph, dom)).join('') + '</div>'
    + '<p class="muted">' + t('spreadT', seed) + '</p><div class="spreads">' + spreads + '</div></div>';

  // les usages : la table des scores, et les couleurs de la paire choisie
  const usages = data.usages || [];
  const usage = '<div class="scroll"><table class="tbl cells umx" id="usagetbl"><thead><tr><th>' + t('usageCol') + '</th>' + used.map(r => '<th>' + esc(short(r.method)) + '</th>').join('') + '</tr></thead><tbody>'
    + usages.map((u, i) => '<tr data-u="' + i + '"><td>' + codeOnly(u.label) + ' <span class="muted">' + esc(u.ref) + '</span></td>' + used.map(r => {
      const x = u.byMethod[r.method];
      return !x || !x.applicable ? '<td>—</td>' : '<td class="' + cell(x) + '">' + x.pass + '/' + x.applicable + '</td>';
    }).join('') + '</tr>').join('') + '</tbody></table></div>';
  const toks = ['W', 'B', ...data.meta.coreSteps], tokLab = x => (x === 'W' ? t('white') : x === 'B' ? t('black') : x);
  if (!ui.pair || !toks.includes(ui.pair.fg) || !toks.includes(ui.pair.bg)) ui.pair = { fg: 'W', bg: seed, th: 4.5 };
  const sel = (key, list, cur, lab) => '<select data-p="' + key + '">' + list.map(x => '<option value="' + x + '"' + (String(x) === String(cur) ? ' selected' : '') + '>' + esc(lab(x)) + '</option>').join('') + '</select>';
  const pairCtl = () => '<label>' + t('pairFg') + ' ' + sel('fg', toks, ui.pair.fg, tokLab) + '</label><label>' + t('pairBg') + ' ' + sel('bg', toks, ui.pair.bg, tokLab) + '</label><label>' + t('pairTh') + ' ' + sel('th', [3, 4.5, 7], ui.pair.th, x => num(x) + ':1') + '</label>';
  const pairRes = () => {
    const { fg, bg, th } = ui.pair;
    $('pairres').innerHTML = '<div class="pgrid">' + used.map(r => {
      const s = E.pairScore(data, r.method, fg, bg, th);
      return '<div class="prow"><span>' + esc(uLab(data, r.method)) + '</span><div class="pchips">' + s.cells.map(c => '<span class="pc' + (c.ratio >= th ? '' : ' no') + '" title="' + esc(c.ramp + ' · ' + ratio(c.ratio)) + '"><i style="background:' + c.bg + ';color:' + c.fg + '">Aa</i><small>' + num(Math.floor(c.ratio * 100) / 100, 2) + '</small></span>').join('') + '</div><b class="' + cell(s) + '">' + s.pass + '/' + s.applicable + '</b></div>';
    }).join('') + '</div>';
  };
  const usagePanel = '<div class="panel"><span class="label">' + t('usageT') + '</span><p class="muted">' + t('usageLead', usages.length, nRamps) + '</p>' + usage
    + '<h3>' + t('pairT') + '</h3><p class="muted">' + t('pairLead') + '</p><div class="row" id="pairctl">' + pairCtl() + '</div><div id="pairres"></div></div>';

  // le tableau : chaque critère, ce qui y est bon, la meilleure valeur en gras
  const cols = E.columns(lang), pct = v => (v === null ? '—' : Math.round(v * 100) + ' %');
  const val = (r, key) => {
    const v = { verdict: r.crossings ?? '—', spread: r.spread === null ? '—' : num(r.spread, 2), safe: gaps(r.safe), intervals: span(r) || '—', aa: r.pairsAA, aaa: r.pairsAAA, kept: pct(r.kept), drift: r.drift === null ? '—' : num(r.drift) }[key];
    return (best[key] || []).includes(r.method) ? '<b>' + v + '</b>' : String(v);
  };
  const table = '<div class="scroll"><table class="tbl" id="costtbl"><thead><tr><th>' + (lang === 'en' ? 'Method' : 'Méthode') + '</th>' + cols.map(c => '<th title="' + esc(c[3]) + '">' + esc(c[1]) + '</th>').join('') + '</tr>'
    + '<tr class="good"><td>' + t('goodIf') + '</td>' + cols.map(c => '<td>' + esc(c[2]) + '</td>').join('') + '</tr></thead><tbody>'
    + rows.map(r => '<tr><td>' + esc(uLab(data, r.method)) + (r.sparse ? ' <span class="muted">(' + t('sparseNote') + ')</span>' : '') + '</td>' + cols.map(c => '<td>' + (r.sparse && c[0] !== 'aa' && c[0] !== 'aaa' ? (c[0] === 'verdict' ? (r.crossings ?? '—') : '—') : val(r, c[0])) + '</td>').join('') + '</tr>').join('')
    + '</tbody></table></div>';

  const guide = '<div class="scroll"><table class="tbl" id="guidetbl"><thead><tr>' + t('guideCols').map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>'
    + E.choose(data, { lang, label: m => uLab(data, m) }).map(g => '<tr><td>' + esc(g.need) + '</td><td><b>' + esc(g.label) + '</b></td><td class="muted">' + esc(g.price) + '</td><td>' + esc(g.where) + '</td></tr>').join('')
    + '</tbody></table></div>';
  const TR = E.TRUST[k], fm = data.metrics.fusilier;
  const trust = '<details class="panel" id="trust"><summary><span class="label">' + t('trustT') + '</span></summary>'
    + '<h3>' + t('trustProto') + '</h3><p>' + esc(TR.protocol) + '</p><p class="muted">' + esc(TR.measures) + ' ' + esc(TR.corpus(nRamps, fm ? fm.colorCount : '—', fm ? fm.totalPairs : '—')) + '</p>'
    + '<h3>' + t('trustConf') + '</h3><div class="scroll"><table class="tbl"><thead><tr>' + t('confCols').map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>'
    + TR.conformance.map(([m, lib, res]) => '<tr><td>' + esc(mLab(data, m)) + '</td><td class="mono">' + esc(lib) + '</td><td>' + esc(res) + '</td></tr>').join('') + '</tbody></table></div><p class="muted">' + esc(TR.conformanceNote) + '</p>'
    + '<h3>' + t('trustLimits') + '</h3><ul>' + TR.limits.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    + '<h3>' + t('trustSources') + '</h3><ul>' + E.SOURCES.map(([a, u]) => '<li><a href="' + u + '" target="_blank" rel="noopener">' + esc(a) + '</a></li>').join('') + '</ul></details>';
  const other = '<details class="panel" id="other"><summary><span class="label">' + t('otherT') + '</span></summary>'
    + '<h3>' + t('otherDark') + '</h3>' + dl(Object.values(E.DARK_TEXT[k])) + '<p class="muted">' + t('otherDarkGo') + '</p>'
    + '<h3>' + t('otherNaming') + '</h3>' + dl(Object.values(E.NAMING_TEXT[k])) + '<p class="muted">' + t('otherNamingGo') + '</p>'
    + '<h3>' + t('otherNorm') + '</h3><p>' + esc(E.NORMS[k]) + '</p></details>';

  $('main').innerHTML = headSolo(t('entries').understand, t('undTitle'), t('undLead'))
    + '<div class="tabs" id="corpus"><button data-c="demo" class="' + (mine ? '' : 'on') + '">' + t('corpusDemo') + '</button><button data-c="mine" class="' + (mine ? 'on' : '') + '"' + (state.ramps.length ? '' : ' disabled') + '>' + t('corpusMine') + '</button></div>'
    + (mine ? '' : '<p class="muted">' + t('corpusDemoNote', nRamps) + '</p>')
    + lessons
    + '<div class="panel"><span class="label">' + F.title + '</span><div class="grid3">' + [F.space, F.method, F.tool].map(([a, v]) => '<div><b>' + a + '</b><p class="muted">' + v + '</p></div>').join('') + '</div><p>' + F.quad + '</p><p class="muted">' + F.proof + '</p></div>'
    + '<div class="panel"><span class="label">' + t('famT') + '</span><div class="grid2">' + E.FAMILIES.map(f => { const [a, v] = f[k]; const ms = f.methods.filter(m => shown.includes(m)); return '<div><b>' + a + '</b> <span class="muted">' + ms.map(m => esc(uLab(data, m))).join(' · ') + '</span><p class="muted">' + v + '</p></div>'; }).join('') + '</div><p class="muted">' + E.BEYOND[k] + '</p></div>'
    + '<div class="panel"><span class="label">' + t('cardsT') + '</span><p class="muted">' + t('cardsLead') + '</p><div class="mcards" id="cards">' + cards + '</div></div>' + side
    + graphs + usagePanel
    + '<div class="panel"><span class="label">' + t('costT') + '</span><p class="muted">' + t('costLead') + '</p>' + table + '<details class="more"><summary>' + t('glossT') + '</summary>' + dl(cols.map(c => [c[1], c[3]])) + '</details></div>'
    + '<div class="panel"><span class="label">' + t('guideT') + '</span><p class="muted">' + t('guideLead') + '</p>' + guide + '</div>'
    + '<div class="panel" id="pitch"><span class="label">' + t('pitchT') + '</span><p class="muted">' + t('pitchLead') + '</p><ol class="lessons">' + E.DECK[k].map(x => '<li>' + esc(x) + '</li>').join('') + '</ol><h3>' + t('sameT') + '</h3><ul>' + E.SAME[k].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul><div class="row"><button id="undmd">' + t('pitchDl') + '</button><button id="undreport">' + t('fullReport') + '</button></div></div>'
    + trust + other
    + '<div class="row">' + (mine ? '<button data-entry="create">' + t('createFrom') + ' →</button>' : '<button data-entry="audit">' + t('tryMine') + ' →</button>') + '</div>';
  document.querySelectorAll('#corpus [data-c]').forEach(b => { b.onclick = () => { state.understand = b.dataset.c; save(); render(); }; });
  document.querySelectorAll('#gtabs [data-g]').forEach(b => { b.onclick = () => { ui.graph = b.dataset.g; render(); }; });
  document.querySelectorAll('#stabs [data-s]').forEach(b => { b.onclick = () => { ui.side = b.dataset.s; render(); }; });
  const bindPair = () => document.querySelectorAll('#pairctl [data-p]').forEach(s => { s.onchange = () => { ui.pair[s.dataset.p] = s.dataset.p === 'th' ? Number(s.value) : s.value; pairRes(); }; });
  document.querySelectorAll('#usagetbl tr[data-u]').forEach(tr => { tr.onclick = () => {
    const u = usages[Number(tr.dataset.u)];
    ui.pair = { fg: u.fg, bg: u.bg, th: u.threshold };
    $('pairctl').innerHTML = pairCtl(); bindPair(); pairRes();
    document.querySelectorAll('#usagetbl tr.on').forEach(x => x.classList.remove('on')); tr.classList.add('on');
    $('pairctl').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }; });
  bindPair(); pairRes();
  $('undreport').onclick = () => openReport(ui.understand);
  $('undmd').onclick = () => download((mine ? slug(state.brand) : 'hueladder') + '-comprendre.md', E.explainMarkdown(data, { lang, label: m => uLab(data, m) }), 'text/markdown');
};

function download(name, content, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ================================================================ en-tête et démarrage

function isDark() {
  const th = document.documentElement.dataset.theme;
  return th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
$('theme').onclick = () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('hueladder-theme', document.documentElement.dataset.theme); } catch (e) {}
  syncFrameTheme();
};
try { const th = localStorage.getItem('hueladder-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('lang').onclick = () => {
  if (STEP_KEYS[state.step] === 'tune') pullTuning();
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('hueladder-lang', lang); } catch (e) {}
  render();
};
$('brand').onchange = e => { state.brand = e.target.value.trim() || t('myBrand'); save(); render(); };
$('cransbtn').onclick = () => { ui.cransOpen = !ui.cransOpen; renderHeader(); };
$('share').onclick = async () => {
  if (STEP_KEYS[state.step] === 'tune') pullTuning();
  const url = location.href.split('#')[0] + '#s=' + encodeState(state);
  try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); } catch (e) { prompt(t('linkPrompt'), url); }
};
$('reset').onclick = () => {
  if (state.ramps.length && !confirm(t('confirmReset'))) return;
  state = fresh(); save(); render();
};

render();
